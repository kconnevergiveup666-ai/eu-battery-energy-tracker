# Daily refresh of the EU battery & energy legislative tracker, published to GitHub Pages.
#  - schedule: every day 22:00 UTC (06:00 Beijing time)
#  - workflow_dispatch: run manually from the Actions tab ("Run workflow")
#  - push to curated data / page / scripts: rebuild and redeploy without re-fetching
name: Update EU tracker

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/curated.js"
      - "data/sources.json"
      - "index.html"
      - "tools/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the latest data, not the commit that queued the run

      - name: Fetch OEIL procedures
        if: github.event_name != 'push'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\update-oeil.ps1

      - name: Fetch secondary legislation (EUR-Lex) and drafts (Have Your Say)
        if: github.event_name != 'push'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\update-secondary.ps1

      - name: Change tracking and build tracker.html
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build.ps1

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tracker.html
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            # generated files: if another run committed meanwhile, keep this run's (newer) output
            git pull --rebase --autostash -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Prepare Pages site
        shell: bash
        run: |
          mkdir -p _site
          cp tracker.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
