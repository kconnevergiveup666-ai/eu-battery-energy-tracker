specific components for the purposes of assessing the contribution to resilience","kind":"implementing","rel":"based_on","base":"32024R1735","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R1178"},{"celex":"32025D1479","date":"2025-05-22","title":"Commission Decision (EU) 2025/1479 of 22 May 2025 specifying the pro rata contributions to the Union CO2 injection capacity objective by 2030 from entities holding an authorisation as defined in Article 1, point 3, of Directive 94/22/EC of the European Parliament and of the Council","kind":"commission-act","rel":"based_on","base":"32024R1735","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025D1479"},{"celex":"32025R1477","date":"2025-05-21","title":"Commission Delegated Regulation (EU) 2025/1477 of 21 May 2025 supplementing Regulation (EU) 2024/1735 of the European Parliament and of the Council by specifying the rules on the identification of authorised oil and gas producers who are required to contribute to the objective of reaching the Union target for available CO2 injection capacity by 2030, on the calculation of their respective contributions, and on their reporting obligations","kind":"delegated","rel":"based_on","base":"32024R1735","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R1477"}],"initiatives":[{"id":"13791","title":"Net Zero Industry Act","summary":null,"actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":["http://data.europa.eu/eli/tfeu_2010/oj","http://data.europa.eu/eli/tfeu_2010/oj"],"matchedBy":"title","published":"2023-03-20","modified":"2023-06-28","publications":[{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2023-03-20","fbStart":"","fbEnd":"","feedback":215,"reference":"COM(2023)161"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13791_en"},{"id":"14467","title":"Minimum requirements on environmental sustainability for NZIA public procurement procedures","summary":"The Net Zero Industry Act will create a regulatory environment that allows for the scaling up of clean technologies, such as wind, heat pumps, and grid technologies, and sets a common framework for the public procurement of such technologies.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2025-01-03","modified":"2025-10-15","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-01-03","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)9041715"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-09-16","fbStart":"","fbEnd":"","feedback":49,"reference":"Ares(2025)7728646"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14467_en"},{"id":"19174","title":"Implementing Regulation on a standardised reporting template for Member States’ monitoring of the NZIA","summary":"The Net-Zero Industry Act requests Member States to submit to the Commission a report setting out monitoring data by March 2027. This Implementing Act provides a standardised reporting template for Member States’ reports, enhancing quality and consistency of the data.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2026-09-03","modified":"2026-11-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-09-03","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)8251214"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-10-14","fbStart":"","fbEnd":"","feedback":6,"reference":"Ares(2026)9691390"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19174_en"},{"id":"14409","title":"Delegated act on primarily used components under the Net-Zero Industry Act","summary":"The Net-Zero Industry Act (NZIA) puts the EU on track to strengthen its domestic manufacturing capacities of key clean technologies. NZIA puts forward a comprehensive supply chain approach as it not only considers the final product of net-zero technologies but also the components primarily used for the production of these final products. To facilitate the implementation of NZIA, the European Commission will adopt through a delegated act a list of components that can be considered as primarily used for the production of net-zero technologies. ","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2024-09-20","modified":"2025-05-23","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-09-20","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)6550662"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-01-23","fbStart":"","fbEnd":"","feedback":158,"reference":"Ares(2025)528655"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-05-23","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)2901"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14409_en"},{"id":"14385","title":"List of net-zero technology final products and their main specific components","summary":"The Net-Zero Industry Act provisions related to access to markets state that when the proportion of supply within the EU of a net-zero technology or its main specific components originating in a third country is above a certain threshold, the resilience criteria are triggered. This implementing act provides the list of each of the net-zero technology final products and their main specific components for which the resilience criteria is assessed for public procurements and auctions.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2024-09-02","modified":"2025-06-18","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-09-02","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)6073277"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-01-23","fbStart":"","fbEnd":"","feedback":90,"reference":"Ares(2025)545490"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2025-06-18","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)9033"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14385_en"},{"id":"14410","title":"Implementing Act on non-price criteria in renewable energy auctions","summary":"According to the Net Zero Industry Act (Article 26), a certain share of auctions to deploy certain renewable energy technologies shall include (i) pre-qualification criteria on responsible business conduct, cybersecurity and data security and ability to deliver the project fully and on time and (ii) pre-qualification or award criteria to assess the auction’s sustainability and resilience contribution.\nThis Act will further specify these criteria in order to ensure a uniform application across the Union. \n","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2024-09-23","modified":"2025-06-18","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-09-23","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)6560350"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-01-24","fbStart":"","fbEnd":"","feedback":121,"reference":"Ares(2025)558456"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2025-06-18","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)2900"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14410_en"}],"fetchedAt":"2026-11-19T22:40:26Z"},"iaa":{"id":"iaa","acts":[],"initiatives":[{"id":"14505","title":"Industrial Decarbonisation Accelerator Act","summary":"The Industrial Decarbonisation Accelerator Act aims at supporting the decarbonisation of industries, especially energy intensive sectors. The objective of the Act is to stimulate and accelerate investments in Europe, support industries’ competitiveness and productivity, while ensuring their decarbonisation. Further, the initiative will aim at speeding-up procedures and facilitate investments, including by creating markets for decarbonised products.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2025-02-10","modified":"2026-06-19","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-02-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)428577"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2025-04-15","fbStart":"","fbEnd":"","feedback":295,"reference":"Ares(2025)3079152"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-04-16","fbStart":"","fbEnd":"","feedback":315,"reference":"IDAA_Public_Consultation_Survey"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2026-03-11","fbStart":"","fbEnd":"","feedback":428,"reference":"COM(2026)100"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14505_en"}],"fetchedAt":"2026-11-19T22:40:35Z"},"espr":{"id":"espr","acts":[{"celex":"32026R1778","date":"2026-07-16","title":"Commission Implementing Regulation (EU) 2026/1778 of 16 July 2026 laying down the implementation arrangements for the digital product passport registry set up under Regulation (EU) 2024/1781 of the European Parliament and of the Council","kind":"implementing","rel":"based_on","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1778"},{"celex":"32026D1736","date":"2026-07-14","title":"Commission Implementing Decision (EU) 2026/1736 of 14 July 2026 on harmonised standards for digital product passports drafted in support of Regulation (EU) 2024/1781 of the European Parliament and of the Council","kind":"standard","rel":"cites","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D1736"},{"celex":"32026D1561","date":"2026-06-29","title":"Council Decision (EU) 2026/1561 of 29 June 2026 on the establishment of the Research Programme of the Research Fund for Coal and Steel, the multiannual technical guidelines for that programme, the multiannual financial guidelines for managing the assets of the Research Fund for Coal and Steel, and repealing Decisions 2003/77/EC and 2008/376/EC","kind":"council-act","rel":"cites","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D1561"},{"celex":"32026D1435","date":"2026-06-26","title":"Commission Decision (EU) 2026/1435 of 26 June 2026 concerning national provisions notified by French Republic on the destruction of unsold products (notified under document C(2026) 4364)","kind":"commission-act","rel":"cites","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D1435"},{"celex":"32026R0296","date":"2026-02-09","title":"Commission Delegated Regulation (EU) 2026/296 of 9 February 2026 supplementing Regulation (EU) 2024/1781 of the European Parliament and of the Council by setting out derogations from the prohibition of destruction of unsold consumer products","kind":"delegated","rel":"based_on","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R0296"},{"celex":"32026R0002","date":"2026-02-09","title":"Commission Implementing Regulation (EU) 2026/2 of 9 February 2026 laying down rules for the application of Regulation (EU) 2024/1781 of the European Parliament and of the Council as regards the details and format for the disclosure of information on discarded unsold consumer products","kind":"implementing","rel":"based_on","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R0002"},{"celex":"52025DC0772","date":"2025-12-16","title":"COMMUNICATION FROM THE COMMISSION (First) CPR Working Plan for 2026-2029","kind":"guidance","rel":"cites","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025DC0772"},{"celex":"52025PC0760","date":"2025-12-10","title":"Proposal for a COUNCIL DECISION on the adoption of the Research Programme of the Research Fund for Coal and Steel, on the multiannual technical guidelines for this programme, on the multiannual financial guidelines for managing the assets of the Research Fund for Coal and Steel, and repealing Decisions 2003/77/EC and 2008/376/EC","kind":"proposal","rel":"cites","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0760"},{"celex":"52025DC0187","date":"2025-04-16","title":"COMMUNICATION FROM THE COMMISSION Ecodesign for Sustainable Products and Energy Labelling Working Plan 2025-2030","kind":"guidance","rel":"based_on","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025DC0187"},{"celex":"52025DC0125","date":"2025-03-19","title":"COMMUNICATION FROM THE COMMISSION TO THE EUROPEAN PARLIAMENT, THE COUNCIL, THE EUROPEAN ECONOMIC AND SOCIAL COMMITTEE AND THE COMMITTEE OF THE REGIONS A European Steel and Metals Action Plan","kind":"guidance","rel":"cites","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025DC0125"},{"celex":"32024D2779","date":"2024-10-24","title":"Commission Decision (EU) 2024/2779 of 24 October 2024 setting up the group of experts on ecodesign for sustainable products and energy labelling (the Ecodesign Forum)","kind":"commission-act","rel":"based_on","base":"32024R1781","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024D2779"}],"initiatives":[{"id":"17874","title":"Setting ecodesign requirements for household dishwashers","summary":"This initiative will consider the revision of ecodesign requirements for household dishwashers:\n\n• environmental impacts of household dishwashers are reduced thanks to lower energy, water, detergent consumption and circularity requirements;\n• household dishwashers are designed to be durable and repairable;\n• customers (product users) have access to relevant information on energy, water, detergent consumption, circularity aspects, usage;\n• customers and professional repairers have access to relevant repair information.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENV","legalBasis":["http://data.europa.eu/eli/reg/2024/1781/oj"],"matchedBy":"legal-basis","published":"2026-04-27","modified":"2026-08-27","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-04-27","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)4109792"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17874_en"},{"id":"16116","title":"Ecodesign requirements for sustainable and circular apparel textiles","summary":"Making the production and consumption of textiles more sustainable is a central goal of the EU Strategy for sustainable and circular textiles. This initiative will develop ecodesign requirements to:\n-\tpromote sustainable and circular design of apparel textiles; \n-\timprove access to information relevant to the sustainability and circularity of apparel textiles.\n","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENV","legalBasis":["http://data.europa.eu/eli/reg/2024/1781/oj"],"matchedBy":"legal-basis","published":"2025-12-18","modified":"2025-12-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-12-18","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)11080809"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16116_en"},{"id":"17994","title":"Commission delegated act setting ecodesign  requirements for household washing machines and household washer-dryers","summary":"The aim is this initiative is that:\n•Environmental impacts of household washing machines and household washer-dryers are reduced thanks to lower energy, water, detergent consumption and circularity requirements;\n•Household washing machines and household washer-dryers are designed to be durable and repairable;\n•Product users have access to relevant information on energy, water, detergent consumption, circularity aspects, usage \u0026 microplastics release;\n•Product users \u0026 professional repairers have access to relevant repair information","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENV","legalBasis":["http://data.europa.eu/eli/reg/2024/1781/oj"],"matchedBy":"legal-basis","published":"2026-05-05","modified":"2026-07-16","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-05-05","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)4364349"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17994_en"},{"id":"19133","title":"Green Public Procurement Criteria for sustainable and circular apparel textiles","summary":"Making the production and consumption of textiles more environmentally sustainable is a central goal of the EU Strategy for Sustainable and Circular Textiles. This initiative considers the development of harmonized green public procurement requirements under the Ecodesign for Sustainable Products Regulation to promote sustainable and circular procurement of apparel textiles and create lead markets for sustainable textile products.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENV","legalBasis":["http://data.europa.eu/eli/reg/2024/1781/oj"],"matchedBy":"legal-basis","published":"2026-08-28","modified":"2026-08-25","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-08-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)8097757"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19133_en"},{"id":"17672","title":"Ecodesign requirements for iron and steel products ","summary":"Making the manufacturing and use of steel more sustainable is a central goal of the EU Clean Industrial Deal and the Steel and Metal Action Plan. The proposed Industrial Accelerator Act introduces low-carbon requirements for steel in public procurement and public support schemes. This initiative will define low-carbon steel and set ecodesign requirements to promote the sustainable and circular design of iron and steel products and improve access to information relevant to their sustainability and circular production.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2024/1781/oj"],"matchedBy":"legal-basis","published":"2026-04-15","modified":"2026-08-13","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-04-15","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)3678259"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2026-05-20","fbStart":"","fbEnd":"","feedback":84,"reference":"Ares(2026)5076198"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2026-05-20","fbStart":"","fbEnd":"","feedback":142,"reference":"Iron_and_steel_products_consultation_questionnaire"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17672_en"},{"id":"16052","title":"Digital Product Passport Registry (DPP)","summary":"In the context of the Ecodesign for Sustainable Products Regulation (ESPR) the Digital Product Passport (DPP) has been introduced as a tool to provide easy access to digital information related to products\u0027 sustainability, circularity, and legal compliance. This implementing act will establish the implementing arrangements for the Digital Product Passport Registry.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2025-12-15","modified":"2026-05-28","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-12-15","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)10886404"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-04-29","fbStart":"","fbEnd":"","feedback":222,"reference":"Ares(2026)4424976"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16052_en"},{"id":"14382","title":"Digital Product Passport (DPP) service providers","summary":"In the context of the Ecodesign for Sustainable Products Regulation (ESPR) the digital product passport (DPP) has been introduced as a tool to provide easy access to digital information related to products\u0027 sustainability, circularity, and legal compliance. This Delegated Act will establish rules on the operation of DPP service providers, an essential component of the wider DPP governance.","actType":"DEC_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2024/1781/oj"],"matchedBy":"legal-basis","published":"2024-08-23","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-08-23","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5904533"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2024-11-12","fbStart":"","fbEnd":"","feedback":178,"reference":"Ares(2024)8031852"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-04-08","fbStart":"","fbEnd":"","feedback":275,"reference":"9623f987-51d5-a590-9d20-c708b0b4ced0"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14382_en"},{"id":"14590","title":"Sustainable products - disclosure of information on unsold consumer products","summary":"EU rules on Ecodesign for Sustainable Products identifies the destruction of unsold consumer products as an environmental problem. To dis-incentivize this practice, economic operators (except for micro and small enterprises), are required to disclose information on the unsold consumer products that they dispose of. This initiative will specify the product types concerned, the details and format for the disclosure of information, and how such information is to be verified.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2025-03-24","modified":"2025-07-11","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-03-24","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)2204317"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-06-12","fbStart":"","fbEnd":"","feedback":100,"reference":"Ares(2025)4699162"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14590_en"},{"id":"12852","title":"Ecodesign and energy labelling working plan 2020-2024","summary":"The ecodesign and energy labelling working plan 2020-2024 will set priorities for the adoption of product specific implementing measures within this policy framework. The ecodesign and energy labelling framework has been one of the most effective policy instruments at EU level to promote energy efficiency, estimated to have contributed to around half of the energy savings target for 2020.","actType":"COMMUNIC","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2021-01-20","modified":"2022-03-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2021-01-20","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2021)346470"},{"type":"ROADMAP","stage":"ROADMAP","date":"2021-05-05","fbStart":"","fbEnd":"","feedback":42,"reference":"Ares(2021)3002090"},{"type":"COMMUNIC","stage":"ADOPTION_WORKFLOW","date":"2022-03-30","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2022)2026"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12852_en"},{"id":"14591","title":"Derogations to the prohibition of the destruction of unsold Apparel and Footwear","summary":"The Ecodesign for Sustainable Products Regulation (ESPR) identifies the destruction of unsold products as an environmental problem and prohibits the destruction of unsold apparel, clothing accessories and footwear. To ensure the measure is proportionate, it addresses cases where such products cannot be used and have to be delivered to recycling or other waste treatment operations. The Regulation provides for setting out derogations under which destruction may still be permitted. This initiative aims to specify those derogations.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2025-03-24","modified":"2026-02-09","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-03-24","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)2204845"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-06-30","fbStart":"","fbEnd":"","feedback":69,"reference":"Ares(2025)5207942"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2026-02-09","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)659"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14591_en"}],"fetchedAt":"2026 ,"fbEnd":"","feedback":103,"reference":"OPConsultationTEN-ERevision"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2020-12-16","fbStart":"","fbEnd":"","feedback":94,"reference":"COM(2020)824"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12382_en"},{"id":"14672","title":"European grid package","summary":"The European grid package will contribute to European competitiveness by facilitating access to affordable, secure and clean energy to businesses and citizens. The package will propose measures to accelerate the upgrade, digitalisation and expansion of the European grid infrastructure removing bottlenecks and increasing overall efficiency for a well interconnected and resilient energy system. With a focus on electricity, it will also cover hydrogen and other infrastructure categories included in the framework for trans-European (TEN-E)","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2025-05-12","modified":"2026-07-03","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-05-12","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)3618196"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2025-05-13","fbStart":"","fbEnd":"","feedback":178,"reference":"Ares(2025)3806419"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-05-13","fbStart":"","fbEnd":"","feedback":197,"reference":"EuropeanGridsPackage"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2026-05-05","fbStart":"","fbEnd":"","feedback":0,"reference":"COM(2025)1006"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14672_en"},{"id":"14607","title":"2nd  PCI/PMI list under the TEN-E Regulation","summary":"Regulation (EU) 2022/869 of the European Parliament and of the Council of 30 May 2022 on guidelines for trans-European energy infrastructure establishes a framework for the identification, planning and implementation of projects of common interest (‘PCIs’) and project of mutual interest (‘PMI’) which are required to implement the 11 strategic geographical energy infrastructure priority corridors. ","actType":"CORRIGENDUM","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2025-04-02","modified":"2026-03-27","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-04-02","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)2466922"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-12-01","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)8144"},{"type":"CORRIGENDUM","stage":"ADOPTION_WORKFLOW","date":"2026-03-27","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)2248"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14607_en"},{"id":"11817","title":"Evaluation of the effectiveness and policy coherence of the guidelines for trans-European Energy infrastructure","summary":"Evaluation of the guidelines for trans-European energy infrastructure [Regulation (EU) No 347/2013, \"TEN-E Regulation\"] in view of recent policy developments and the progress made in its implementation. \n\nThe evaluation will assess the effectiveness and policy coherence of the guidelines considering, inter alia, the Union energy and climate targets for 2030, the EU long-term decarbonisation commitment, and the energy efficiency first principle.","actType":"SWD","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2019-06-03","modified":"2025-09-18","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2019-06-03","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2019)3443380"},{"type":"ROADMAP_EFC","stage":"ROADMAP","date":"2019-06-14","fbStart":"","fbEnd":"","feedback":30,"reference":"Ares(2019)3805 atform (Text with EEA relevance)","kind":"delegated","rel":"based_on","base":"32018L2001","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021R2003"},{"celex":"52021PC0562","date":"2021-07-14","title":"Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL on the use of renewable and low-carbon fuels in maritime transport and amending Directive 2009/16/EC","kind":"proposal","rel":"cites","base":"32018L2001","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0562"}],"initiatives":[{"id":"12714","title":"Minimum thresholds for greenhouse gas emissions savings of recycled carbon fuels","summary":"This Delegated Regulation supplements the Directive (EU) 2018/2001 on the promotion of the use of energy from renewable sources, by establishing appropriate minimum thresholds for greenhouse gas emissions savings of recycled carbon fuels through a life-cycle assessment that takes into account the specificities of each fuel.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2018/2001/oj"],"matchedBy":"legal-basis","published":"2020-11-10","modified":"2021-07-17","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-11-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)6374183"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12714_en"},{"id":"12553","title":"Revision of the Renewable Energy Directive (EU) 2018/2001","summary":"The European Green Deal Communication foresees a review of the Renewable Energy Directive (EU) 2018/2001 and, if appropriate, its revision in order to adjust it to the goal of increasing the EU  climate target to at least 50% and towards 55% in a responsible way by 2030. \nIn addition, in 2020 the Commission will assess the final integrated National Energy and Climate Plans under the Governance Regulation, and present several strategies including actions that may require to revise the Directive.","actType":"PROP_DIR","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-08-03","modified":"2021-11-19","publications":[{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-08-03","fbStart":"","fbEnd":"","feedback":374,"reference":"Ares(2020)4087053"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-11-17","fbStart":"","fbEnd":"","feedback":39046,"reference":"Review-of-Directive-2018_2001_EU-energy-from-renewables-sources"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"2021-07-16","fbStart":"","fbEnd":"","feedback":298,"reference":"COM(2021)557"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12553_en"},{"id":"14343","title":"Amendment of the Renewable Energy Directive: revising the values and modifying the methodology laid down in Annexes V-VI","summary":"In accordance with Article 31(5) of the Renewable Energy Directive, the Commission is required to review Annexes V and VI with a view, where justified, to adding or revising values for biofuel, bioliquid and biomass fuel production pathways. Those reviews shall also consider modifying the methodology laid down in Part C of Annex V and in Part B of Annex VI. The Commission is empowered to adopt delegated acts pursuant to Article 35 to amend, where appropriate, Annexes V and VI by adding or revising the default values or modifying the methodology","actType":"DIR_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2018/2001/oj"],"matchedBy":"legal-basis","published":"2024-07-18","modified":"2026-08-13","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-18","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5054731"},{"type":"DIR_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-12-15","fbStart":"","fbEnd":"","feedback":166,"reference":"Ares(2025)11154567"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14343_en"},{"id":"14075","title":"Guidance to facilitate the designation of renewables acceleration areas","summary":"The revised Renewable Energy Directive (Directive (EU) 2023/2413 amending the Renewable Energy Directive (EU) 2018/2001 requires that by 21 February 2026 Member States designate renewables acceleration areas for one or more types of renewable energy sources. \n\nThe European Wind Power Action Plan states that by April 2024 the Commission will issue guidance to the Member States on the designation of renewables acceleration areas.\n","actType":"SWD","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2024-01-03","modified":"2024-02-24","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-01-03","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)8702652"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2024-01-26","fbStart":"","fbEnd":"","feedback":211,"reference":"Ares(2024)600621"},{"type":"SWD","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14075_en"},{"id":"14297","title":"COMMISSION DELEGATED REGULATION on extending the scope of traceability of the Union database","summary":"To ensure that only sustainable volumes of renewable fuels, recycled carbon fuels are counted for the achievement of the EU decarbonisation targets, also avoiding any risk of double counting of the same energy units, the Commission put in place a traceability tool, “the Union database (UDB)”. \n\nTo improve the traceability, the revised Renewable Energy Directive empowers the Commission to extend the scope of the data in UDB to also cover data from the point of production/ collection of the raw materials used for the fuel production. \n","actType":"REG_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2018/2001/oj"],"matchedBy":"legal-basis","published":"2024-06-17","modified":"2026-06-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4208375"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-10-10","fbStart":"","fbEnd":"","feedback":125,"reference":"Ares(2024)7198636"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14297_en"},{"id":"13829","title":"Report on the implementation of Article 5 of the Renewable Energy Directive","summary":"The report on the implementation of Article 5 of the Renewable Energy Directive will assess to what extent the Member States have supported electricity from renewable sources, which is produced in another Member State. The report will also assess the need to introduce an obligation on Member States partially to open participation in their support schemes to producers located in other Member States with a view to a 5 % opening by 2025 and a 10 % opening by 2030.","actType":"REPORT","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2023-05-12","modified":"2023-12-11","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-05-12","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3215167"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2023-07-31","fbStart":"","fbEnd":"","feedback":18,"reference":"Ares(2023)5296450"},{"type":"REPORT","stage":"ADOPTION_WORKFLOW","date":"2023-12-11","fbStart":"","fbEnd":"","feedback":0,"reference":"COM(2023)778"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13829_en"},{"id":"12713","title":"Greenhouse gas emissions savings methodology for recycled carbon fuels and renewable fuels of non-biological origin","summary":"The Commission is required to adopt by 31/12/2021, a Delegated Regulation to supplement Directive 2018/2001 on the promotion of the use of energy from renewable source, by specifying the methodology for assessing greenhouse gas emissions savings from renewable liquid and gaseous transport fuels of non-biological origin and from recycled carbon fuels.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-11-10","modified":"2023-02-13","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-11-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)6374154"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2022-05-20","fbStart":"","fbEnd":"","feedback":199,"reference":"Ares(2022)3836721"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2023-02-13","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)1086"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12713_en"},{"id":"12716","title":"Methodology for calculating the quantity of renewable energy used for cooling and district cooling","summary":"The Renewable Energy Directive promotes the increase of renewable energy in all energy sectors, including heating and cooling. This Delegated Regulation aims to establish a methodology to calculate how much renewable energy Member States use for cooling.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-11-10","modified":"2021-12-14","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-11-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)6374463"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2021-10-28","fbStart":"","fbEnd":"","feedback":11,"reference":"Ares(2021)6653457"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2021-12-14","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2021)9392"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12716_en"},{"id":"12199","title":"Methodology on share of renewable electricity in the production of renewable transport fuels of non biological origin","summary":"The Renewable Energy Directive (EU) 2018/2001 promotes the use of renewables in the EU. \nFor the transport sector, a separate target of 14 % renewables has been set up, and is allowed to be met via the use of renewable liquid and gaseous transport fuels of non-biological origin. \nThe Commission has been empowered to determine the requirements for renewable electricity used in the production of these renewable transport fuels of non-biological origin to be counted as fully renewable.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-02-26","modified":"2023-02-13","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-02-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)1078537"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2022-05-20","fbStart":"","fbEnd":"","feedback":337,"reference":"Ares(2022)3836651"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2023-02-13","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)1087"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12199_en"},{"id":"12711","title":"Methodology to determine the share of renewables in case of co-processing","summary":"The Commission is required to adopt by 31 December 2021, a Delegated Regulation to supplement Directive 2018/2001 on the promotion of the use of energy from renewable source, by specifying the methodology to determine the share of biofuel, and biogas for transport, resulting from biomass being processed with fossil fuels in a common process (co-processing).","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-11-10","modified":"2023-06-05","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-11-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)6374065"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2022-06-22","fbStart":"","fbEnd":"","feedback":32,"reference":"Ares(2022)4592406"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2023-06-05","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)3513"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12711_en"},{"id":"12712","title":"Union Renewable Development Platform (URDP)","summary":"EU legislation on renewables establishes different cooperation mechanisms for Member States, one of them being “statistical transfers”. The creation of the Union Renewable Development Platform aims to enable a more efficient matching of supply and demand for statistical transfers and its price setting.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-11-10","modified":"2021-08-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-11-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)6374136"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2021-04-29","fbStart":"","fbEnd":"","feedback":9,"reference":"Ares(2021)2869803"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2021-08-12","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2021)5752"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12712_en"}],"fetchedAt":"2026-11-19T22:42:37Z"},"eed":{"id":"eed","acts":[{"celex":"52026DC0500","date":"2026-09-21","title":"REPORT FROM THE COMMISSION TO THE EUROPEAN PARLIAMENT AND THE COUNCIL on the energy efficiency of data centres in the EU","kind":"report","rel":"based_on","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026DC0500"},{"celex":"32026H0537","date":"2026-03-10","title":"Commission Recommendation (EU) 2026/537 of 10 March 2026 on unlocking private investment in energy efficiency","kind":"commission-act","rel":"cites","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026H0537"},{"celex":"32026H0536","date":"2026-03-10","title":"Commission Recommendation (EU) 2026/536 of 10 March 2026 with practical guidance on one-stop shops services for energy efficiency and the energy performance of buildings","kind":"commission-act","rel":"cites","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026H0536"},{"celex":"52026DC0118","date":"2026-03-10","title":"REPORT FROM THE COMMISSION TO THE EUROPEAN PARLIAMENT AND THE COUNCIL on Energy Efficiency financing in Europe An assessment of public spending for energy efficiency and the energy performance of buildings","kind":"report","rel":"based_on","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026DC0118"},{"celex":"32024L1788","date":"2024-06-13","title":"Directive (EU) 2024/1788 of the European Parliament and of the Council of 13 June 2024 on common rules for the internal markets for renewable gas, natural gas and hydrogen, amending Directive (EU) 2023/1791 and repealing Directive 2009/73/EC (recast) (Text with EEA relevance)","kind":"amending","rel":"amends","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024L1788"},{"celex":"32024R1364","date":"2024-03-14","title":"Commission Delegated Regulation (EU) 2024/1364 of 14 March 2024 on the first phase of the establishment of a common Union rating scheme for data centres","kind":"delegated","rel":"based_on","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1364"},{"celex":"32023H01553","date":"2023-12-12","title":"Commission Recommendation of 12 December 2023 on transposing Article 30 on national energy efficiency funds, financing and technical support of the Directive (EU) 2023/1791 on energy efficiency (EED recast)","kind":"commission-act","rel":"based_on","base":"32023L1791","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023H01553"}],"initiatives":[{"id":"19683","title":"Review of primary energy factors  ","summary":"A Primary Energy Factor (PEF) provides a comparison of how much primary energy is needed to produce an energy product required to satisfy final energy demand. PEF for electricity was last defined by Directive (EU) 2023/1791 where Article 31 foresees that by 25 December 2026 and every four years thereafter, the Commission shall revise the default coefficients on the basis of observed data\n","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2023/1791/oj"],"matchedBy":"legal-basis","published":"2026-11-05","modified":"2026-10-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-11-05","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)10174559"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19683_en"},{"id":"12552","title":"Review of Directive 2012/27/EU on energy efficiency","summary":"The European Green Deal emphasises the need to prioritise energy efficiency so that it sufficiently contributes to achieving the higher EU climate ambition at level of at least 50% towards 55 % in a responsible way by 2030.\n\nThus  the Commission has committed itself  to review and revise if necessary the Energy Efficiency Directive in order to enable the achievement of a higher EU climate target for 2030.","actType":"PROP_DIR","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2020-08-03","modified":"2021-11-20","publications":[{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-08-03","fbStart":"","fbEnd":"","feedback":189,"reference":"Ares(2020)4087034"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-11-17","fbStart":"","fbEnd":"","feedback":344,"reference":"ReviewEED"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"2021-07-16","fbStart":"","fbEnd":"","feedback":187,"reference":"COM(2021)558"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12552_en"},{"id":"1990","title":"Adaptation of energy efficiency targets for 2030 to a European Union at 27 Member States","summary":null,"actType":"PROP_DEC","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":["http://data.europa.eu/eli/tfeu_2010/oj","http://data.europa.eu/eli/tfeu_2010/oj","http://data.europa.eu/eli/tfeu_2010/oj"],"matchedBy":"title","published":"2018-11-14","modified":"2020-02-20","publications":[{"type":"PROP_DEC","stage":"ADOPTION_WORKFLOW","date":"2018-11-14","fbStart":"","fbEnd":"","feedback":1,"reference":"COM(2018)744"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/1990_en"},{"id":"17452","title":"Energy efficiency legal framework post-2030","summary":"The initiative aims to ensure that energy efficiency contributes to the achievement of the EU climate target of 90% greenhouse gas emissions by 2040 in a cost-efficient way and to strengthen the EU’s competitiveness by securing affordable and clean energy for European citizens and industry. The existing legislation is targeted to the 2030 decarbonisation scenario, so it would not suffice to achieve this goal; therefore, setting-up an energy efficiency framework for post 2030 legal framework is necessary.","actType":"PROP_DIR","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2026-03-19","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-03-19","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)2948633"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2026-03-19","fbStart":"","fbEnd":"","feedback":161,"reference":"Ares(2026)2953593"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2026-03-20","fbStart":"","fbEnd":"","feedback":227,"reference":"energyefficiencyframeworkforthedecadeahead"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17452_en"},{"id":"16035","title":"Rating scheme for data centres in Europe","summary":"The Energy Efficiency Directive (EU) 2023/1791 promotes the energy efficiency and sustainability of data centres. A common Union scheme for rating the sustainability of data centres in Europe will be developed via a Delegated Regulation based on Article 33(3) of the Energy Efficiency Directive. This should also simplify the reporting scheme that was introduced with the Delegated Regulation (EU) 2024/1364.\n","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2025-12-12","modified":"2026-09-24","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-12-12","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)10848343"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-03-26","fbStart":"","fbEnd":"","feedback":130,"reference":"Ares(2026)3247482"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2026-09-24","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)3472"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16035_en"},{"id":"13818","title":"Reporting scheme for data centres in Europe","summary":"The proposal for an Energy Efficiency Directive 2012/27/EU recast introduces in its proposed Article 11(10) reporting requirements on the energy performance and sustainability of data centres.\n\nWith this Delegated Act the Commission exercises its power, under Article 31(3) of the proposal for an Energy Efficiency Directive 2012/27/EU recast to establish a common Union scheme for rating the sustainability of data centres located in its territory.\n","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2023-04-28","modified":"2024-03-14","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-04-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)2865575"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-12-11","fbStart":"","fbEnd":"","feedback":62,"reference":"Ares(2023)8478399"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2024-03-14","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)1639"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13818_en"},{"id":"13938","title":"Guidance to Member States and market actors to unlock private investments in energy efficiency (EED recast)","summary":"Increase the uptake of energy efficiency investments is fundamental to deliver on the 2030 climate and energy targets, while ensuring competitiveness and sustainability of the EU economy. Article 28(8) of the Energy Efficiency Directive recast requires the European Commission to provide guidance by 31 December 2024 to Member States and market actors on how to unlock private investment, notably by developing innovative financing tools, scaling up financial instruments and making the most of public budget support. \n\n\n","actType":"RECO","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2023-08-01","modified":"2026-03-10","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-08-01","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)5192667"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2024-01-29","fbStart":"","fbEnd":"","feedback":48,"reference":"Ares(2024)645707"},{"type":"RECO","stage":"ADOPTION_WORKFLOW","date":"2026-03-10","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)1526"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13938_en"},{"id":"13824","title":"Assessment of the energy efficiency public funding support at Union and national level","summary":"Energy efficiency is instrumental to achieve full decarbonisation by 2050 while ensuring competitiveness of the European economy. With a view to deploy financing at the needed scale, the Energy Efficiency Directive recast requests the Commission to assess the current state of public funding support and the capacity of Member States to increase the uptake of private investments in energy efficiency. The Commission shall also evaluate whether an energy efficiency mechanism at Union level is needed. ","actType":"REPORT","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2023-05-04","modified":"2026-03-10","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-05-04","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3035204"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2024-01-29","fbStart":"","fbEnd":"","feedback":39,"reference":"Ares(2024)645706"},{"type":"REPORT","stage":"ADOPTION_WORKFLOW","date":"2026-03-10","fbStart":"","fbEnd":"","feedback":0,"reference":"COM(2026)118"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13824_en"},{"id":"19293","title":"Minimum performance standards for data centres in Europe","summary":"EU rules on energy efficiency introduced provisions to promote the energy efficiency and sustainability of data centres. With this initiative, the European Commission aims to establish common Union minimum performance standards for data centres located in its territory.","actType":"PROP_REG","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"OPEN","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2026-09-17","modified":"2026-09-21","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-09-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)8738685"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2026-09-21","fbStart":"","fbEnd":"","feedback":66,"reference":"Ares(2026)8908107"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2026-09-21","fbStart":"","fbEnd":"","feedback":20,"reference":"minimumperformancestandardsfordatacentres"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19293_en"}],"fetchedAt":"2026-11-19T22:43:01Z"},"epbd":{"id":"epbd","acts":[{"celex":"32026H0536","date":"2026-03-10","title":"Commission Recommendation (EU) 2026/536 of 10 March 2026 with practical guidance on one-s x IV (Energy) to the EEA Agreement (EPBD) (Text with EEA relevance)","kind":"council-act","rel":"cites","base":"32024L1275","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025D1432"},{"celex":"32025R1511","date":"2025-06-30","title":"Commission Delegated Regulation (EU) 2025/1511 of 30 June 2025 supplementing Directive (EU) 2024/1275 of the European Parliament and of the Council as regards the establishment of a comparative methodology framework for calculating cost-optimal levels of minimum energy performance requirements for buildings and building elements","kind":"delegated","rel":"based_on","base":"32024L1275","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R1511"},{"celex":"32025R2273","date":"2025-06-30","title":"Commission Delegated Regulation (EU) 2025/2273 of 30 June 2025 supplementing Directive (EU) 2024/1275 of the European Parliament and of the Council as regards the establishment of a comparative methodology framework for calculating cost-optimal levels of minimum energy performance requirements for buildings and building elements","kind":"delegated","rel":"based_on","base":"32024L1275","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R2273"},{"celex":"32025R1328","date":"2025-06-30","title":"Commission Implementing Regulation (EU) 2025/1328 of 30 June 2025 implementing Directive (EU) 2024/1275 of the European Parliament and of the Council by establishing common templates for the transfer of information from national energy performance of buildings databases to the EU Building Stock Observatory","kind":"implementing","rel":"based_on","base":"32024L1275","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R1328"},{"celex":"52025PC0311","date":"2025-06-13","title":"Proposal for a COUNCIL DECISION on the position to be adopted, on behalf of the European Union, within the EEA Joint Committee concerning an amendment to Annex IV (Energy) to the EEA Agreement (EPBD)","kind":"proposal","rel":"cites","base":"32024L1275","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0311"},{"celex":"52024XC06206","date":"2024-10-18","title":"Commission Notice on phasing out financial incentives for stand-alone boilers powered by fossil fuels under the recast Energy Performance of Buildings Directive","kind":"guidance","rel":"based_on","base":"32024L1275","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52024XC06206"}],"initiatives":[{"id":"12910","title":"Revision of the Energy Performance of Buildings Directive 2010/31/EU","summary":"The Commission presented its Renovation Wave communication on 14/10/2020, containing an action plan with concrete regulatory, financing and enabling measures and with the aim to at least double the annual energy renovation rate of buildings by 2030. The existing legislation will not suffice to achieve that goal; therefore, a targeted revision of the Energy Performance of Buildings Directive is necessary. This revision will focus on provisions that are central to delivering a Renovation Wave.","actType":"PROP_DIR","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2021-02-22","modified":"2022-04-02","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2021-02-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2021)1349488"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2021-02-22","fbStart":"","fbEnd":"","feedback":243,"reference":"Ares(2021)1397833"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2021-03-30","fbStart":"","fbEnd":"","feedback":535,"reference":"EPBDConsultation"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"2021-12-15","fbStart":"","fbEnd":"","feedback":229,"reference":"COM(2021)802"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12910_en"},{"id":"14396","title":"Establishment of a portfolio framework to increase lending towards energy performance renovations ","summary":"According to Article 17 of the EPBD recast (Directive (EU) 2024/1275), the European Commission shall adopt a delegated act to establish a comprehensive portfolio framework for voluntary use by financial institutions. \n\nIts objective is to increase lending volumes for energy renovations in line with the European Union’s decarbonisation targets, protect vulnerable households and describe best practices to encourage lenders to prioritise worst-performing buildings. \n","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2024/1275/oj"],"matchedBy":"legal-basis","published":"2024-09-09","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-09-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)6245747"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2024-10-08","fbStart":"","fbEnd":"","feedback":55,"reference":"Ares(2024)7124279"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-08-26","fbStart":"","fbEnd":"","feedback":45,"reference":"Portfolio-framework-delegated-act"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14396_en"},{"id":"14395","title":"Revision of the Cost-Optimal Methodology framework for calculating minimum energy performance requirements for buildings","summary":"By 30 June 2025, the Commission shall revise the comparative methodology framework for calculating cost-optimal levels of minimum energy performance requirements for new buildings and existing buildings undergoing major renovation, and for individual building elements (as established in Directive 2024/1275/EU (EPBD), Article 6(1)). To this end, the Commission will adopt a delegated act in accordance with Annex VII to the EPBD.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2024-09-09","modified":"2025-06-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-09-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)6245704"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-04-09","fbStart":"","fbEnd":"","feedback":50,"reference":"Ares(2025)2899026"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-06-30","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)4133"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14395_en"},{"id":"12364","title":"Establishment of a smart readiness indicator for buildings","summary":"This initiative will establish an optional instrument for rating the smart readiness of buildings, the “smart readiness indicator” (SRI). Smart readiness refers to adaptation capabilities of buildings with regard to operation, performance, fulfilment of users’ needs and demand flexibility. This initiative covers the definition of the SRI and the SRI calculation methodology. The implementation arrangements of the SRI in the European Union are addressed separately.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2010/31/oj","http://data.europa.eu/eli/dir/2010/31/oj"],"matchedBy":"title","published":"2020-05-07","modified":"2020-10-14","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-05-07","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)2347000"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2020-06-18","fbStart":"","fbEnd":"","feedback":24,"reference":"Ares(2020)3182807"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2020-10-14","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2020)6930"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12364_en"},{"id":"12365","title":"Implementation modalities of the smart readiness indicator for buildings","summary":"This initiative will clarify the implementation arrangements of an optional instrument for rating the smart readiness of buildings, the “smart readiness indicator” (SRI). Smart readiness refers to adaptation capabilities of buildings with regard to operation, performance, fulfilment of users’ needs and demand flexibility. This initiative covers the implementation arrangements of the SRI (SRI definition and calculation methodology are addressed separately).","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":["http://data.europa.eu/eli/dir/2010/31/oj"],"matchedBy":"title","published":"2020-05-07","modified":"2020-10-21","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-05-07","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)2347002"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2020-06-18","fbStart":"","fbEnd":"","feedback":13,"reference":"Ares(2020)3171707"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2020-10-21","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2020)6929"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12365_en"},{"id":"14604","title":"Union framework for the calculation of life-cycle Global Warming Potential for new buildings","summary":"According to Article 7(3) of the EPBD recast (Directive (EU) 2024/1275), the European Commission shall adopt a delegated act to set out a Union framework for the national calculation of life-cycle Global Warming Potential for new buildings. The objective is to make comparable the national values for the life-cycle Global Warming Potential, which will have to be calculated for all new buildings as of 2030.","actType":"CORRIGENDUM","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENER","legalBasis":[],"matchedBy":"title","published":"2025-03-31","modified":"2026-04-27","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-03-31","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)2412626"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-10-03","fbStart":"","fbEnd":"","feedback":116,"reference":"Ares(2025)8384118"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-12-16","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)8723"},{"type":"CORRIGENDUM","stage":"ADOPTION_WORKFLOW","date":"2026-04-27","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)2887"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14604_en"}],"fetchedAt":"2026-11-19T22:43:41Z"},"co2-cars":{"id":"co2-cars","acts":[{"celex":"32026D1907","date":"2026-07-29","title":"Commission Implementing Decision (EU) 2026/1907 of 29 July 2026 specifying the values relating to the performance of manufacturers and pools of manufacturers of new passenger cars and new light commercial vehicles for the calendar year 2024 pursuant to Regulation (EU) 2019/631 of the European Parliament and of the Council (notified under document C(2026) 5285)","kind":"implementing","rel":"based_on","base":"32019R0631","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D1907"},{"celex":"32026R1030","date":"2026-04-29","title":"Regulation (EU) 2026/1030 of the European Parliament and of the Council of 29 April 2026 on the greenhouse gas emissions accounting of transport services (Text with EEA relevance)","kind":"amending","rel":"cites","base":"32019R0631","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1030"},{"celex":"52026PC0100","date":"2026-03-04","title":"Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL establ
