<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>欧盟电池与能源立法追踪</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --line:#e2e5ea; --text:#1b1f24; --muted:#5f6b7a; --faint:#8a95a3;
  --accent:#1f5fd6; --accent-weak:#e6eefc;
  --c-commission:#1f5fd6; --c-epc:#7a3fd1; --c-epp:#c2398a; --c-council:#d9822b; --c-trilogue:#b8860b; --c-final:#18864b; --c-impl:#0e8f8f; --c-future:#8a95a3;
  --battery:#0e8f8f; --industry:#7a3fd1; --power:#d9822b; --renewable:#18864b; --transport:#1f5fd6; --carbon:#6b7280;
  --done:#18864b; --current:#d9822b; --pending:#c9ced6;
  --c-sec:#5b6ee1; --c-other:#8a6d3b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
:root{--open:#c0392b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --c-sec:#8fa0ff; --c-other:#c9a46a; --open:#ff7a6b } }
:root[data-theme="dark"]{ --c-sec:#8fa0ff; --c-other:#c9a46a; --open:#ff7a6b }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b; --text:#e6e9ed; --muted:#a1abb8; --faint:#7d8896;
    --accent:#6ea0ff; --accent-weak:#1b2a44;
    --c-commission:#6ea0ff; --c-epc:#a98bf0; --c-epp:#e879b8; --c-council:#f0a456; --c-trilogue:#e0b84a; --c-final:#4cc08a; --c-impl:#3cc6c6; --c-future:#7d8896;
    --battery:#3cc6c6; --industry:#a98bf0; --power:#f0a456; --renewable:#4cc08a; --transport:#6ea0ff; --carbon:#9aa3af;
    --done:#4cc08a; --current:#f0a456; --pending:#3a424d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b; --text:#e6e9ed; --muted:#a1abb8; --faint:#7d8896;
  --accent:#6ea0ff; --accent-weak:#1b2a44;
  --c-commission:#6ea0ff; --c-epc:#a98bf0; --c-epp:#e879b8; --c-council:#f0a456; --c-trilogue:#e0b84a; --c-final:#4cc08a; --c-impl:#3cc6c6; --c-future:#7d8896;
  --battery:#3cc6c6; --industry:#a98bf0; --power:#f0a456; --renewable:#4cc08a; --transport:#6ea0ff; --carbon:#9aa3af;
  --done:#4cc08a; --current:#f0a456; --pending:#3a424d; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hwrap{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:8px}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;cursor:pointer}

main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card .bd{padding:14px 16px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.feed li:last-child{border-bottom:0}
.feed .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.feed .t{font-size:13.5px}
.feed .s{font-size:12px;color:var(--muted)}
.lane-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* gantt */
.gantt-wrap{overflow-x:auto}
.gantt{min-width:880px}
.grow{display:grid;grid-template-columns:200px 1fr;align-items:center;min-height:30px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.gname{font-size:12.5px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gname:hover{color:var(--accent)}
.gtrack{position:relative;height:30px}
.gaxis{position:relative;height:22px;font-size:11px;color:var(--faint)}
.gaxis span{position:absolute;transform:translateX(-50%);top:3px}
.gyear{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--c-epp);opacity:.6}
.seg{position:absolute;top:9px;height:12px;border-radius:3px}
.seg.ep{background:var(--c-epc)} .seg.tri{background:var(--c-trilogue)} .seg.fin{background:var(--c-final)}
.seg.open{background:repeating-linear-gradient(45deg,var(--c-epc) 0 4px,transparent 4px 8px);opacity:.75;border:1px solid var(--c-epc)}
.mk{position:absolute;top:7px;width:10px;height:16px;transform:translateX(-50%)}
.mk.prop{border-left:2px solid var(--c-commission);width:2px;top:4px;height:22px}
.mk.cou{width:10px;height:10px;top:10px;background:var(--c-council);transform:translateX(-50%) rotate(45deg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* dossiers */
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.filters{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.list{overflow:auto;padding:6px}
.item{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel2)}
.item.on{background:var(--accent-weak);border-color:var(--accent)}
.item .n{font-weight:600;font-size:13.5px}
.item .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.item.child{margin-left:16px;border-left:2px solid var(--line);border-radius:0 8px 8px 0}
.cat{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,transparent)}
.pill.live{color:var(--current);border-color:color-mix(in srgb,var(--current) 50%,transparent)}
.pill.core{color:var(--c-epp);border-color:color-mix(in srgb,var(--c-epp) 40%,transparent)}

.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.dhead{padding:18px 20px}
.dhead h1{font-size:20px;margin:6px 0 4px}
.dhead .en{color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;background:var(--panel2);border-radius:6px;padding:2px 8px;color:var(--muted)}

/* stage pipeline */
.pipe{display:grid;grid-template-columns:repeat(8,1fr);gap:0;padding:18px 14px 14px;overflow-x:auto}
.stg{position:relative;text-align:center;padding:0 4px;min-width:96px}
.stg:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--pending);z-index:0}
.stg:first-child:before{display:none}
.stg.done:before,.stg.cur:before{background:var(--done)}
.stg .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel);border:3px solid var(--pending);color:var(--faint)}
.stg.done .dot{background:var(--done);border-color:var(--done);color:#fff}
.stg.cur .dot{border-color:var(--current);color:var(--current);box-shadow:0 0 0 4px color-mix(in srgb,var(--current) 20%,transparent)}
.stg.skip .dot{border-style:dashed}
.stg .nm{font-size:12.5px;font-weight:600}
.stg .who{font-size:11px;color:var(--faint)}
.stg .dt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sum p{margin:0 0 10px}
.sum ul{margin:0;padding-left:18px} .sum li{margin:4px 0}

/* actors */
.actors table{width:100%;border-collapse:collapse;font-size:13px}
.actors th,.actors td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.actors th{font-size:11.5px;color:var(--faint);font-weight:600}
.cbadge{display:inline-block;font-weight:700;font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--panel2);margin-right:6px;font-family:ui-monospace,Consolas,monospace}
.grp{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;color:#fff;vertical-align:1px}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.shadows{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sub{font-size:12px;color:var(--muted)}

/* timeline */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{position:relative;display:grid;grid-template-columns:96px 22px 1fr;gap:0 10px;padding:6px 0}
.tl .d{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding-top:1px}
.tl .rail{position:relative}
.tl .rail:before{content:"";position:absolute;left:10px;top:-6px;bottom:-6px;width:2px;background:var(--line)}
.tl li:first-child .rail:before{top:10px} .tl li:last-child .rail:before{bottom:calc(100% - 10px)}
.tl .rail i{position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.tl .ev{font-size:13.5px}
.tl .ev .orig{font-size:11.5px;color:var(--faint)}
.tl .ev .lane{font-size:11px;font-weight:600;margin-right:6px}
.tl li.future .ev{opacity:.75} .tl li.future .rail i{background:transparent!important;border:2px dashed var(--c-future)}
.tl li.yr{grid-template-columns:96px 22px 1fr;padding:12px 0 4px}
.tl li.yr .d{font-weight:700;color:var(--text);font-size:13px}
.unv{font-size:10.5px;color:var(--current);border:1px solid var(--current);border-radius:4px;padding:0 4px;margin-left:6px}
.toolbar{display:flex;gap:10px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}
.toolbar label{cursor:pointer;display:flex;gap:4px;align-items:center}
.lanes{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}

.family{display:flex;flex-direction:column;gap:6px}
.fam-node{display:flex;align-items:center;gap:8px;font-size:13px}
.fam-node .ln{color:var(--faint)}
.fam-node.me{font-weight:700}
.relrow{font-size:12.5px;padding:3px 0}

.empty{padding:40px;text-align:center;color:var(--muted)}
.pill.open{color:var(--open);border-color:color-mix(in srgb,var(--open) 50%,transparent);font-weight:600}
.init{padding:9px 0;border-bottom:1px dashed var(--line)} .init:last-child{border-bottom:0}
.ihd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ititle{font-weight:600;font-size:13.5px}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:5px 0 2px;font-size:11.5px}
.step{padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--faint)}
.step.on{color:var(--text)}
.arr{color:var(--faint)}
.actgrp{margin-bottom:10px} .agh{font-size:12px;font-weight:600;color:var(--muted);margin:6px 0 2px}
.act{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;padding:3px 0 3px 94px;position:relative}
.act .d{position:absolute;left:0;top:3px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.chg li .t{font-size:13px}
.help code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:12.5px}
.help pre{background:var(--panel2);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px}

@media (max-width: 1000px){
  .layout,.grid2,.cols{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .list{max-height:320px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pipe{grid-template-columns:repeat(8,110px)}
}
@media (max-width: 560px){
  main{padding:12px 16px 40px} .hwrap{padding:10px 16px}
  .tl li{grid-template-columns:78px 22px 1fr}
  nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  nav.tabs button{white-space:nowrap;flex:0 0 auto}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">欧盟电池与能源立法追踪<small>EU Battery &amp; Energy Industrial Policy Legislative Tracker</small></div>
    <nav class="tabs" id="tabs">
      <button data-v="overview">总览</button>
      <button data-v="dossiers">法规库</button>
      <button data-v="drafts">草案与二级立法</button>
      <button data-v="feed">动态时间线</button>
      <button data-v="help">数据与更新</button>
    </nav>
    <div class="hright"><span id="gen"></span><button class="iconbtn" id="themeBtn" title="切换明暗">◐</button></div>
  </div>
</header>
<main id="app"></main>

<script>
/*
 * curated.js —— 人工整理层（监测清单 + 中文解读 + 理事会内部节点 + 实施节点）
 *
 * 1. 每条记录的  oeil: "YYYY/NNNN(COD)"  决定了 tools/update-oeil.ps1 要抓取哪些程序。
 *    新增一部法规：复制一条记录，填好 oeil 编号，然后运行更新脚本即可。
 * 2. 欧委会提案、议会各委员会（主审/意见/联合委员会、报告员、影子报告员）、
 *    议会全会、理事会最终通过、签署、公报发布 —— 全部由脚本从 OEIL 自动抓取，无需手填。
 * 3. OEIL 不记录理事会内部进程（工作组 / COREPER 授权 / 部长理事会总体方针）以及三方谈判结果，
 *    这些写在 council 数组里；实施与适用节点写在 milestones 数组里。
 *    council / milestones 的 verified:false 表示日期尚待对照官方来源核实。
 *
 * council[].stage 取值：
 *   wp        理事会工作组审议          coreper   COREPER 谈判授权
 *   ga        部长理事会总体方针         trilogue  三方谈判（中间轮次）
 *   deal      三方达成临时协议           endorse   COREPER 确认协议文本
 * milestones[].kind 取值：force 生效 / apply 开始适用 / deadline 义务期限 / transpose 转化期限 /
 *   secondary 授权法案/实施法案/指南 / review 评估审查
 * council[].planned:true / tracking.items[].planned:true 表示“已排期/预计”的未来节点。
 *
 * tracking —— 在审法规的动态跟进（Legislative Train 等来源，人工阅读后整理；脚本无法自动抓取这些站点）
 *   { asOf: 来源版本日期, source, url,
 *     items: [{ date, lane: commission|epc|epp|council|trilogue|other, text, planned?, src? }],
 *     outlook: 下一步展望 }
 * 二级立法（授权/实施法案、指南、草案、意见征求）由 tools/update-secondary.ps1 自动抓取，配置见 data/sources.json。
 */
window.CURATED = [
  /* ================= 电池与关键原材料 ================= */
  {
    id: "batteries",
    oeil: "2020/0353(COD)",
    nameZh: "电池与废电池法规（新电池法）",
    shortZh: "新电池法",
    category: "battery",
    relevance: "core",
    tags: ["电池护照", "碳足迹", "再生料含量", "尽职调查", "回收"],
    summaryZh: "取代 2006 年电池指令，是欧盟首部覆盖电池全生命周期的“法规”（直接适用）。对动力电池、工业电池、轻型交通工具电池等设定碳足迹申报与分级、再生材料最低含量、性能耐久性、可拆卸、电池护照、供应链尽职调查及回收效率/材料回收率目标。",
    impactZh: [
      "进入欧盟市场的 EV/工业电池需提交碳足迹声明，后续按等级设上限——对上游正极、电芯制造的用电结构构成直接压力",
      "2031 年起钴 16%、锂 6%、镍 6%、铅 85% 的再生料最低含量；2036 年提高至钴 26%、锂 12%、镍 15%",
      "2027 年 2 月起 EV、LMT 及 >2kWh 工业电池须配备数字电池护照",
      "供应链尽职调查义务经 Omnibus IV 推迟至 2027 年 8 月 18 日"
    ],
    council: [
      { date: "2022-03-17", stage: "ga", label: "环境理事会达成总体方针", body: "环境理事会 (ENVI Council)" },
      { date: "2022-12-09", stage: "deal", label: "理事会与议会达成临时协议", body: "捷克轮值主席国" },
      { date: "2023-01-18", stage: "endorse", label: "COREPER 确认三方协议文本", body: "COREPER I", note: "OEIL 收录的 COREPER 确认函 GEDA/A/(2023)000527" }
    ],
    milestones: [
      { date: "2023-08-17", kind: "force", label: "法规生效" },
      { date: "2024-02-18", kind: "apply", label: "法规整体开始适用" },
      { date: "2025-12-31", kind: "deadline", label: "锂电池回收效率 ≥65%（2030 年 ≥70%）" },
      { date: "2026-08-18", kind: "deadline", label: "电池标签要求适用" },
      { date: "2027-02-18", kind: "deadline", label: "电池护照、QR 码及便携电池可拆卸要求适用" },
      { date: "2027-08-18", kind: "deadline", label: "供应链尽职调查义务适用（原定 2025-08-18，经 2025/1561 推迟）" },
      { date: "2027-12-31", kind: "deadline", label: "材料回收率：锂 50%，钴/镍/铜 90%" },
      { date: "2031-08-18", kind: "deadline", label: "再生料最低含量第一阶段（Co16% / Li6% / Ni6% / Pb85%）" },
      { date: "2036-08-18", kind: "deadline", label: "再生料最低含量第二阶段（Co26% / Li12% / Ni15% / Pb85%）" }
    ]

COUNCIL on the exercise of the power to adopt delegated acts conferred on the Commission pursuant to Council Directive 86/278/EEC of 12 June 1986 on the protection of the environment, and in particular of the soil, when sewage sludge is used in agriculture, Directive 94/62/EC of 20 December 1994 on packaging and packaging waste, Directive 2000/53/EC of 18 September 2000 on end-of life vehicles, Regulation (EC) No 1013/2006 on shipments of waste, Directive 2006/66/EC of 6 September 2006 on batteries and accumulators and waste batteries and accumulators and Directive 2008/98/EC of 19 November 2008 on waste","kind":"report","rel":"cites","base":"32023R1542","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52024DC0454"},{"celex":"32024R1781","date":"2024-06-13","title":"Regulation (EU) 2024/1781 of the European Parliament and of the Council of 13 June 2024 establishing a framework for the setting of ecodesign requirements for sustainable products, amending Directive (EU) 2020/1828 and Regulation (EU) 2023/1542 and repealing Directive 2009/125/EC (Text with EEA relevance)","kind":"amending","rel":"amends","base":"32023R1542","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1781"}],"initiatives":[{"id":"14312","title":"Carbon footprint label classes for electric vehicle batteries","summary":"The Batteries Regulation includes life-cycle carbon footprint requirements for several categories of batteries. These requirements have to be detailed by implementing legislation. This delegated act is the second step for the implementation of the carbon footprint requirements for electric vehicle batteries. It specifies the carbon footprint label classes for these batteries","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2023/1542/oj"],"matchedBy":"legal-basis","published":"2024-06-26","modified":"2025-12-15","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4462340"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14312_en"},{"id":"19132","title":"Minimum values for the performance and durability parameters for portable batteries of general use.","summary":"The Battery Regulation requires the EC to establish mandatory minimum values for the electrochemical performance and durability parameters for portable batteries of general use, excluding button cells. \nThe objective is to ensure that batteries placed on the Union market are durable and of high performance.\nEstablishing minimum values for certain parameters is important to prevent that low-performing/low-quality portable batteries are placed on the Union market.\n","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENV","legalBasis":["http://data.europa.eu/eli/reg/2023/1542/oj"],"matchedBy":"legal-basis","published":"2026-08-28","modified":"2026-08-25","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-08-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)8097754"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19132_en"},{"id":"16636","title":"Procedure for authorisation of replacement rechargeable electric energy storage systems (REESS) of motor vehicles","summary":"Technological advancement needs to allow for replacing batteries of electric vehicles with more advanced non-original batteries. The availability of the original batteries may become limited over time due to technological obsolescence and the depletion of raw materials. This initiative allows for the authorisation of the replacement of batteries in existing vehicles,ensuring their safety, continued operation and extended lifespan. It will strengthen consumer confidence in electric vehicles.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/dec/2004/757/oj"],"matchedBy":"title","published":"2026-02-03","modified":"2026-01-29","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-02-03","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)966952"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16636_en"},{"id":"14313","title":"Carbon footprint methodology for industrial batteries","summary":"The Batteries Regulation includes life-cycle carbon footprint requirements for several categories of batteries. These requirements have to be detailed by implementing legislation. This delegated act specifies the methodology for the calculation and verification of the life-cycle carbon footprint for industrial batteries with a capacity greater than 2 kWh, except those with external storage.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2023/1542/oj"],"matchedBy":"legal-basis","published":"2024-06-26","modified":"2025-12-15","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4464845"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14313_en"},{"id":"18668","title":"Improved calculation methodology for collection rates of waste batteries and adaptation of collection targets","summary":"The Battery Regulation empowers the Commission to develop an improved method to calculate collection rates of waste portable and Light Means of Transport batteries to better reflect their longer lifetime.\nThe objective is to support the circular economy, ensure high but realistic collection targets for waste batteries and prevent them from ending up in mixed municipal waste.\nThe methodology is important to ensure a level playing field and provide legal certainty on collection requirements within the EU.\n","actType":"DEC_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"ENV","legalBasis":["http://data.europa.eu/eli/reg/2023/1542/oj"],"matchedBy":"legal-basis","published":"2026-07-08","modified":"2026-07-03","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-07-08","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)6641246"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/18668_en"},{"id":"14310","title":"Information requirements for applications for recognition of battery due diligence schemes","summary":"The Batteries Regulation requires companies to undertake due diligence in relation to social and environmental risk for four key minerals (cobalt, natural graphite, lithium, nickel) in batteries that they place on the EU market. Recognised due diligence schemes can help implementing this. This implementing act specifies the information that applications of battery due diligence schemes for recognition by the Commission need to contain.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2023/1542/oj"],"matchedBy":"legal-basis","published":"2024-06-26","modified":"2025-12-16","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4462224"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14310_en"},{"id":"14311","title":"Criteria and methodology for the assessment and recognition of battery due diligence schemes","summary":"The Batteries Regulation requires companies to undertake due diligence in relation to social and enviromental risk for four key minerals (cobalt, natural graphite, lithium, nickel) in batteries that they place on the EU market. Recognised due diligence schemes can help implementing this. This delegated act includes the criteria and methodology that the Commission will use to asess and recognise battery due diligence schemes.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2023/1542/oj"],"matchedBy":"legal-basis","published":"2024-06-26","modified":"2025-12-16","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4462309"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14311_en"},{"id":"14460","title":"Minimum values for the electrochemical performance and durability of rechargeable industrial batteries","summary":"The Batteries Regulation aims to ensure, amongst others, that batteries are durable and of high performance. The Regulation requires the Commission to set minimum levels of electrochemical performance and durability that batteries will have to meet when sold on the EU market. This delegated act will set such minimum levels for industrial batteries.","actType":"REG_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2024-12-13","modified":"2026-10-28","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-12-13","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)8788957"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-09-29","fbStart":"","fbEnd":"","feedback":33,"reference":"Ares(2026)9188325"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14460_en"},{"id":"12399","title":"Modernising the EU’s batteries legislation","summary":"The Commission is working to update the EU battery legislation, covering the life cycle of all types of batteries (design and production, and collection, reuse and recycling of waste batteries). It will address the shortcomings identified in the evaluation of Directive 2006/66/EU, and the circular and low carbon economy perspectives. This is part of the European Green Deal, the Circular Economy Action Plan and wider industrial and energy policies, notably the Strategic Action Plan on Batteries.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":["http://data.europa.eu/eli/tfeu_2010/oj","http://data.europa.eu/eli/tfeu_2010/oj"],"matchedBy":"title","published":"2020-05-25","modified":"2021-03-02","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-05-25","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)2634699"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-05-28","fbStart":"","fbEnd":"","feedback":104,"reference":"Ares(2020)2777034"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2020-12-10","fbStart":"","fbEnd":"","feedback":135,"reference":"COM(2020)798"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12399_en"},{"id":"14858","title":"Methodology for calculation and verification of recycled content in batteries","summary":"The Battery Regulation established targets for recycled content for lithium, cobalt, nickel and lead that several categories of batteries will have to meet to be placed on the EU market. Two sets of targets will apply first from 2031 then from 2036.\n\nIn order to make these provisions operational this act lays down the methodology for calculating and verifying these recycled content rates. \n","actType":"REG_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2025-09-22","modified":"2026-09-10","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-09-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)7729439"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-08-12","fbStart":"","fbEnd":"","feedback":70,"reference":"Ares(2026)7823470"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14858_en"},{"id":"13877","title":"Carbon footprint methodology for electric vehicle batteries","summary":"The Battery Regulation includes life-cycle carbon footprint requirements for several categories of batteries. These requirements have to be detailed by implementing legislation. This delegated act is the first step for the implementation of the carbon footprint requirements for electric vehicle batteries. It specifies the methodology for the calculation and verification of the life-cycle carbon footprint for these batteries.","actType":"REG_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":["http://data.europa.eu/eli/dir/2008/98/oj"],"matchedBy":"title","published":"2023-06-22","modified":"2026-07-14","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)4174225"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-04-30","fbStart":"","fbEnd":"","feedback":127,"reference":"Ares(2024)3131389"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13877_en"},{"id":"14456","title":"Batteries – definition of labelling requirements","summary":"EU rules on batteries include harmonized specifications for the labelling requirements of all battery categories. This initiative will guides economic operators towards a common look and feel to meet the various labelling requirements applicable to the batteries that are placed in the internal market.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2024-12-11","modified":"2026-01-27","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-12-11","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)8677914"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-12-15","fbStart":"","fbEnd":"","feedback":91,"reference":"Ares(2025)11169592"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14456_en"},{"id":"13878","title":"Format of the carbon footprint declaration for batteries","summary":"The Battery Regulation includes life-cycle carbon footprint requirements for several categories of batteries. These requirements have to be detailed by implementing legislation. Companies will have to declare the carbon footprint of their batteries. This implementing act will specify the format for that declaration.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":["http://data.europa.eu/eli/dir/2008/98/oj"],"matchedBy":"title","published":"2023-06-22","modified":"2026-07-14","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)4174271"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-04-30","fbStart":"","fbEnd":"","feedback":15,"reference":"Ares(2024)3131449"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13878_en"},{"id":"1996","title":"Sustainability requirements for batteries","summary":"This initiative will explore, within the framework of the Strategic Action Plan on batteries, on targeted measures at EU level to make Europe a global leader in sustainable battery production and use. The main objective is to foster the growth of high performing, safe and sustainable battery cells and battery packs/modules that are produced with the lowest possible environmental footprint.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2018-11-26","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2018-11-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2018)5951053"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2019-01-09","fbStart":"","fbEnd":"","feedback":25,"reference":"Ares(2019)100807"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2019-06-13","fbStart":"","fbEnd":"","feedback":180,"reference":"EcodesignBatteries2019"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/1996_en"},{"id":"14702","title":"Proposal amending the Batteries Regulation (EU) 2023/1542 as regards battery due diligence obligations","summary":null,"actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":["http://data.europa.eu/eli/tfeu_2010/oj","http://data.europa.eu/eli/tfeu_2010/oj"],"matchedBy":"title","published":"2025-05-23","modified":"2025-08-01","publications":[{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2025-05-23","fbStart":"","fbEnd":"","feedback":41,"reference":"COM(2025)258"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14702_en"},{"id":"16473","title":"Commission Implementing Regulation on access rights to certain parts of the battery passport","summary":"As from February 2027 large batteries will have a digital battery passport accessible via QR code. The passport will contain public information on performance and sustainability, compliance information for authorities, and information relevant for repairing, remanufacturing, repurposing and recycling of the battery. The last category of information should only accessible to those companies and persons that have a legitimate interest in the information. This act will define who can access it.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2026-01-23","modified":"2026-11-17","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-01-23","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)568530"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-10-19","fbStart":"","fbEnd":"","feedback":98,"reference":"Ares(2026)9814179"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16473_en"},{"id":"14857","title":"Batteries regulation - List of exempted products from the general removability and replaceability requirements ","summary":"Article 11 of the Batteries Regulation establishes requirements for the removability and replaceability of portable batteries incorporated into products.  Such batteries need to be removable and replaceable by the end-user. For certain products where the safety of end-users is at stake, it may be sufficient that portable batteries are removable and replaceable only by independent professionals. This delegated act will set out a list of products or product categories, additional to the one in Article 11(2), for which such derogation is justified","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2025-09-22","modified":"2026-07-14","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-09-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)7729422"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-04-28","fbStart":"","fbEnd":"","feedback":127,"reference":"Ares(2026)4360577"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2026-07-14","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)5031"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14857_en"},{"id":"14296","title":"Waste batteries - Format to be used by Member States reporting on their collection and treatment","summary":"EU legislation on batteries requires Member States to report the amount of batteries supplied within their territory and collected, by category and chemistry, as well as rates for recycling efficiency and recovery of materials, accompanied by a quality check report. \nThis initiative will establish the formats to be used, to ensure uniform conditions for the reporting of Member States to the Commission.\n","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2024-06-13","modified":"2025-11-23","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-13","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4107302"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-07-14","fbStart":"","fbEnd":"","feedback":14,"reference":"Ares(2025)5700213"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2025-11-23","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)7563"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14296_en"},{"id":"14016","title":"Targeted amendment of the European List of Waste as regards waste batteries and wastes from their treatment","summary":"To help manage waste, the European List of Waste provides common terminology for classifying waste across the EU, including hazardous waste. The Commission intends to revise this list to take account of new battery chemistries and rapidly evolving manufacturing and recycling processes. Its objective is to improve the identification, monitoring and traceability of the different waste streams and bring certainty on their status as hazardous / non-hazardous waste.","actType":"DEC_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2023-11-07","modified":"2025-03-05","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-11-07","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)7392610"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-10-11","fbStart":"","fbEnd":"","feedback":38,"reference":"Ares(2024)7236427"},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-03-05","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)1360"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14016_en"},{"id":"14265","title":"Calculation and verification methodology of rates for recycling efficiency and recovery of materials of waste batteries","summary":"The Battery Regulation requires the EC to establish a method to calculate and verify the efficiency of battery recycling processes and recovery of materials. \nThe objective is to support the circular economy in the battery sector and ensure high quality of recovery of materials, especially of critical and strategic raw materials.\nThe calculation and verification methodology is important to ensure a level playing field between recyclers and provide legal certainty on requirements within the EU.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2024-05-07","modified":"2025-03-21","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-05-07","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)2038311"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-09-20","fbStart":"","fbEnd":"","feedback":44,"reference":"Ares(2024)6672760"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-03-21","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)1674"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14265_en"},{"id":"16633","title":"Procedure for authorisation of replacement rechargeable electric energy storage systems (REESS) of motor vehicles","summary":"Technological advancement needs to allow for replacing batteries of electric vehicles with more advanced non-original batteries. The availability of the original batteries may become limited over time due to technological obsolescence and the depletion of raw materials. This initiative allows for the authorisation of the replacement of batteries in existing vehicles,ensuring their safety, continued operation and extended lifespan. It will strengthen consumer confidence in electric vehicles.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2026-01-28","modified":"2026-01-29","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-01-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)966568"},{"type":"ABANDONED","stage":"ABANDONED","date":"2026-01-28","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16633_en"},{"id":"17697","title":"Test, method and administrative requirements for ISC and market surveillance of battery durability of M1 and N1 vehicles","summary":"This initiative is laying down specific methods, requirements and tests as well as administrative requirements for in-service conformity (ISC) and market surveillance of cars and vans regarding in-vehicle battery durability, , electric vehicle (EV) range at low temperature and electric vehicle (EV) system power, expanded scope of on-board fuel consumption monitoring (OBFCM). It is essential for the effective implementation of Euro 7 standards, facilitating type-approval in line with Euro 7.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2024/1257/oj"],"matchedBy":"title","published":"2026-04-16","modified":"2026-04-11","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-04-16","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)3722371"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17697_en"},{"id":"17696","title":"Tests, methods and administrative requirements for type-approval of in-vehicle battery durability of cars and vans","summary":"This initiative outlines methods, tests, and administrative requirements for type-approval of cars and vans focusing on battery durability, EV range at low temperatures, EV system power, and expanded on-board fuel consumption monitoring. It is essential for the effective implementation of the Euro 7 , facilitating type-approval before the application date. By ensuring all tests and requirements are in place, it aims to reduce vehicle pollution and improve air quality.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2026-04-16","modified":"2026-06-25","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-04-16","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)3722362"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-05-27","fbStart":"","fbEnd":"","feedback":27,"reference":"Ares(2026)5308838"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17696_en"}],"fetchedAt":"2026-11-19T22:39:22Z"},"crma":{"id":"crma","acts":[{"celex":"32026D2349","date":"2026-10-09","title":"Commission Decision (EU) 2026/2349 of 9 October 2026 recognising certain critical raw material projects as Strategic Projects under Regulation (EU) 2024/1252 of the European Parliament and of the Council (notified under document C(2026) 8051)","kind":"commission-act","rel":"based_on","base":"32024R1252","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D2349"},{"celex":"32026R1116","date":"2026-05-26","title":"Commission Implementing Regulation (EU) 2026/1116 of 26 May 2026 listing the products, components and waste streams considered as having a relevant critical raw materials recovery potential under Regulation (EU) 2024/1252","kind":"implementing","rel":"based_on","base":"32024R1252","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1116"},{"celex":"52025DC0945","date":"2025-12-03","title":"COMMUNICATION FROM THE COMMISSION TO THE EUROPEAN PARLIAMENT, THE COUNCIL, THE EUROPEAN ECONOMIC AND SOCIAL COMMITTEE AND THE COMMITTEE OF THE REGIONS RESourceEU Action Plan Accelerating our critical raw materials strategy to adapt to a new reality","kind":"guidance","rel":"cites","base":"32024R1252","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025DC0945"},{"celex":"32025R2194","date":"2025-10-28","title":"Commission Implementing Regulation (EU) 2025/2194 of 28 October 2025 establishing a single template to be used by project promoters for the application for recognition of a critical raw material project as a Strategic Project in accordance with Regulation (EU) 2024/1252 of the European Parliament and of the Council","kind":"implementing","rel":"based_on","base":"32024R1252","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R2194"},{"celex":"32025D1174","date":"2025-06-04","title":"Commission Decision (EU) 2025/1174 of 4 June 2025 recognising certain critical raw material projects located in third countries and in overseas countries or territories as Strategic Projects under Regulation (EU) 2024/1252 of the European Parliament and of the Council (notified under document C(2025) 3491)","kind":"commission-act","rel":"based_on","base":"32024R1252","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025D1174"},{"celex":"32025D0840","date":"2025-03-25","title":"Commission Decision (EU) 2025/840 of 25 March 2025 recognising certain critical raw material projects as Strategic Projects under Regulation (EU) 2024/1252 of the European Parliament and of the Council (notified under document C(2025) 1904)","kind":"commission-act","rel":"based_on","base":"32024R1252","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025D0840"}],"initiatives":[{"id":"19596","title":"Establishing the format of the label to be affixed to certain products containing permanent magnets","summary":"Article 28(2) of the Critical Raw Materials Act requires the Commission to establish, through an implementing act, the format of a label for certain products containing permanent magnets. The label will indicate whether a product contains a permanent magnet and, where applicable, its type (neodymium-iron-boron; samarium-cobalt; aluminium-nickel-cobalt; ferrite).","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":["http://data.europa.eu/eli/reg/2024/1252/oj"],"matchedBy":"legal-basis","published":"2026-10-28","modified":"2026-10-23","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-10-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)9954967"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19596_en"},{"id":"14832","title":"EU Critical Raw Materials Centre","summary":"The EU faces strong dependencies in its access to critical raw materials, like rare earths, crucial for EU manufacturing, green, digital, aerospace and defence industries, which are being exploited by other geopolitical players. To address them, as suggested in the Draghi report and announced in the Clean Industrial Deal, the Commission is planning to set up an EU Critical Raw Materials Centre, consisting of 4 pillars: joint purchasing, stockpiling, investments, and raw materials intelligence.","actType":"PROP_REG","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2025-09-02","modified":"2026-07-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-09-02","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)6918424"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2026-05-19","fbStart":"","fbEnd":"","feedback":138,"reference":"Ares(2026)5029796"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2026-05-19","fbStart":"","fbEnd":"","feedback":72,"reference":"CRMCentreSurvey2026"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14832_en"},{"id":"14677","title":"Commission Implementing Regulation on the list for the purposes of Article 26 of Regulation (EU) 2024/1252","summary":"This Commission Implementing Regulation lays down the list of products, components and waste streams that shall at least be considered as having critical raw materials recovery potential for the purposes of Article 26 of Regulation (EU) 2024/1252.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2025-05-15","modified":"2025-07-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-05-15","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)3739448"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-06-27","fbStart":"","fbEnd":"","feedback":84,"reference":"Ares(2025)5155732"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14677_en"},{"id":"13597","title":"European Critical Raw Materials Act","summary":"To achieve the green and digital transitions, the EU must significantly increase and diversify its critical raw materials supply, strengthen circularity and support research and innovation. The Commission will propose measures to reinforce EU monitoring capacities and strengthen both the EU value chain - through the identification of mineral resources and raw materials projects in the EU\u0027s strategic interest, with a high level of environmental protection – and the EU external policies on CRMs.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2022-09-30","modified":"2023-07-01","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2022-09-30","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2022)6712646"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2022-09-30","fbStart":"","fbEnd":"","feedback":310,"reference":"Ares(2022)6746256"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2022-09-30","fbStart":"","fbEnd":"","feedback":259,"reference":"CriticalRawMaterialsAct"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2023-03-20","fbStart":"","fbEnd":"","feedback":207,"reference":"COM(2023)160"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13597_en"},{"id":"14719","title":"Commission Implementing Act establishing a Strategic Project application template under the Critical Raw Materials Act","summary":"This Commission Implementing Regulation establishes a single template pursuant to Article 7(2) of the Regulation (EU) 2024/1252 to be used by project promoters for applications submitted for the recognition of a project as a Strategic Project.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"GROW","legalBasis":[],"matchedBy":"title","published":"2025-06-11","modified":"2025-10-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-06-11","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)4483256"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-07-22","fbStart":"","fbEnd":"","feedback":14,"reference":"Ares(2025)5941863"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2025-10-30","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)7057"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14719_en"},{"id":"17276","title":"Relevant raw materials and the format and frequency of data to be reported under the Regulation (EU) 2024/1244  ","summary":"Art 6(1) of the Industrial Emissions Portal Regulation requests industrial operators to report to their competent authorities on relevant raw material use and specifies criteria determining the choice of those materials.\nMoreover, in accordance with Article 7 of the Regulation, Member States report all data to the Commission by electronic means. Through this decision, the Commission will determine the list of raw materials and establish the format of the data to be reported per each economic activity of the IEPR.\n","actType":"DEC_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2026-03-16","modified":"2026-10-13","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-03-16","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)2603351"},{"type":"DEC_IMPL","stage":"ADOPTION_WORKFLOW","date":"2026-10-13","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)7610"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17276_en"}],"fetchedAt":"2026-11-19T22:39:57Z"},"elv":{"id":"elv","acts":[],"initiatives":[{"id":"12633","title":"Revision of EU legislation on end-of-life vehicles","summary":"This initiative will aim at improving the collection of end-of-life vehicles, their treatment and recycling, and re-use of their components. It will encourage the EU car industry to adopt a more circular model for design and production of cars. This should contribute to the transformation of the automotive sector to adapt to the European Green Deal.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"ENV","legalBasis":[],"matchedBy":"title","published":"2020-10-08","modified":"2023-12-05","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-10-08","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)5226499"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-10-22","fbStart":"","fbEnd":"","feedback":61,"reference":"Ares(2020)5755999"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2021-07-20","fbStart":"","fbEnd":"","feedback":208,"reference":"ELVimpactAssessment"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2023-07-14","fbStart":"","fbEnd":"","feedback":874,"reference":"COM(2023)451"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12633_en"},{"id":"1912","title":"Legislation on end-of-life vehicles - evaluation","summary":"The Directive on end-of-life vehicles (ELVs) seeks to minimise the impact of ELVs in the environment, and to ensure the smooth operation of the internal market. The purpose of this evaluation is to assess how the Directive is working and whether it is delivering the expected benefits for the environment, citizens and stakeholders","actType":"SWD","stage":"ADOPTION_W
