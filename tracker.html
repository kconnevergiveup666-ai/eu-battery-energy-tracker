atform to be appointed by Germany from 15 November 2018 for a maximum period of 5 years. To facilitate a timely start of the Innovation Fund before 2021, as established by the revised ETS Directive, the draft amendment will also enable the monetisation of a first batch of 50 million allowances on the Common Auction Platform in 2020.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj","http://data.europa.eu/eli/dir/2003/87/oj","http://data.europa.eu/eli/dir/2003/87/oj","http://eur-lex.europa.eu/eli/dir/2010/31/oj"],"matchedBy":"legal-basis","published":"2018-09-12","modified":"2020-02-20","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2018-09-12","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2018)393683"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2018-09-12","fbStart":"","fbEnd":"","feedback":1,"reference":"Ares(2018)4672849"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2018-10-30","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2018)7019"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/1901_en"},{"id":"13447","title":"Competitive bidding under the Innovation Fund and implementation of other changes stemming from the ETS Directive Rev.","summary":"The initiative will implement changes to the Innovation Fund to be agreed in the ETS Revision , notably use of competitive bidding.\nWhilst the IF currently functions with a grants awarded via scoring procedure, competitive bidding can be complementary considering:\n-\tIncreased budget, (as proposed in ETS Directive revision)\n-\tIncreased need for efficiency and market-based funding instruments\n-\tIncreasing maturity of projects needing support\n-\tReduced administrative burden\n","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title"," pean Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. Following the revision of the EU ETS Directive, the European Commission needs to update several regulatory acts for the implementation of the EU ETS. One of these acts will update the rules for free allocation.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-06-09","modified":"2024-01-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3883475"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-12-05","fbStart":"","fbEnd":"","feedback":123,"reference":"Ares(2023)8322586"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2024-01-30","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)441"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13861_en"},{"id":"13862","title":"Amendment to Registry Regulation in response to the ETS revision/Fit For 55  ","summary":"In the framework of the \u0027Fit for 55\u0027 package, the EU ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. Following the revision of the EU ETS Directive, the European Commission needs to update several regulatory acts for the implementation of the EU ETS. One of these acts will update the Registry Regulation in order to introduce provisions for maritime, and aviation.","actType":"CORRIGENDUM","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-06-09","modified":"2023-12-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3883502"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-07-31","fbStart":"","fbEnd":"","feedback":15,"reference":"Ares(2023)5295500"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2023-10-25","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)7112"},{"type":"CORRIGENDUM","stage":"ADOPTION_WORKFLOW","date":"2023-12-12","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)8592"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13862_en"},{"id":"13911","title":"Climate neutrality plan for ETS installations in response to the ETS revision / Fit for 55","summary":"In the framework of the \u0027Fit for 55\u0027 package, the EU ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. This new act is neccessary to develop minimum requirements for the content and format of  climate-neutrality plans, for use in the context of conditional free allocation and additional free allocation to district heating.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-07-11","modified":"2023-10-31","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-07-11","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)4674475"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-08-04","fbStart":"","fbEnd":"","feedback":46,"reference":"Ares(2023)5412396"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2023-10-31","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)7298"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13911_en"},{"id":"14079","title":"Rules for reporting CORSIA eligible fuels and CORSIA units cancellation reports under the ETS Directive","summary":"Article 28c of Directive 2003/87/EC empowers the Commission to adopt delegated acts to establish rules for the monitoring, reporting and verification of emissions to implement ICAO\u0027s global market-based measure. Commission Delegated Regulation (EU) 2019/1603 establishes those rules, which should be updated to facilitate the reporting of CORSIA eligible fuels and the submission and verification of CORSIA emissions unit cancellation reports. ","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-01-04","modified":"2025-05-20","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-01-04","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)8740802"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-04-01","fbStart":"","fbEnd":"","feedback":7,"reference":"Ares(2025)2602809"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-05-20","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)3075"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14079_en"},{"id":"14217","title":"Amendment of the EU ETS Monitoring and Reporting Regulation (MRR) in response to the ETS revision/Fit For 55 (Batch 2) ","summary":"In the framework of the \u0027Fit for 55\u0027 package, the EU ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. \nFollowing this revision, the European Commission needs to update several regulatory acts for the implementation of the EU ETS. This initiative updates the rules for the Monitoring and Reporting of emissions.\n","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-04-04","modified":"2024-09-23","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-04-04","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)2279788"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-07-01","fbStart":"","fbEnd":"","feedback":155,"reference":"Ares(2024)4738358"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2024-09-23","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)6542"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14217_en"},{"id":"14371","title":"Amendment to Registry Regulation in response to the ETS revision/Fit For 55 (Batch 2)","summary":"As part of the \u0027Fit for 55\u0027 package, the ETS Directive has been revised to align it with the new EU target to reduce net greenhouse gas emissions by 55% (compared to 1990 levels) by 2030. Following this revision, the European Commission needs to update several regulatory acts for the implementation of the ETS. This initiative updates the Registry Regulation to introduce rules on aviation, fees to finance the Union Registry and ETS for buildings and road transport.\n","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-08-06","modified":"2025-02-11","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-08-06","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5546729"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-12-13","fbStart":"","fbEnd":"","feedback":20,"reference":"Ares(2024)8940286"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-02-11","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)814"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14371_en"},{"id":"14801","title":"Technical updates of the Emissions Trading Scheme (ETS) State aid guidelines","summary":"Based on the Emissions Trading Scheme (ETS) State aid Guidelines, Member States can give State aid to certain electro-intensive users to compensate for part of the higher electricity costs due to the EU ETS. The Guidelines’ objective is to minimise carbon leakage, i.e. the risk of relocation to third countries with less ambitious climate policies. The aim of the update is to include additional sectors to reflect an increased carbon leakage risk from higher CO2 prices, based on the same method and observable data.\n","actType":"COMMUNIC","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"COMP","legalBasis":[],"matchedBy":"title","published":"2025-07-31","modified":"2025-12-23","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-07-31","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)6048308"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2025-08-04","fbStart":"","fbEnd":"","feedback":173,"reference":"Ares(2025)6328348"},{"type":"COMMUNIC","stage":"ADOPTION_WORKFLOW","date":"2025-12-23","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)9298"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14801_en"},{"id":"1151","title":"Amendment of the EU ETS Auctioning Regulation","summary":null,"actType":"REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2017-03-29","modified":"2020-02-20","publications":[{"type":"REG_DRAFT","stage":"ISC_WORKFLOW","date":"2017-03-29","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2017)1681228"},{"type":"REG","stage":"ADOPTION_WORKFLOW","date":"2017-10-19","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2017)6922"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/1151_en"},{"id":"1974","title":"Amendment of the EU ETS Monitoring and Reporting Regulation (MRR)","summary":null,"actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2018-10-29","modified":"2020-02-20","publications":[{"type":"REG_IMPL_DRAFT","stage":" function classify(ev){
  for(const [re,lane,zh] of EVT){ if(re.test(ev)) return {lane, zh: zh || ev}; }

function shortTitle(t){ t = String(t||""); const m = t.match(/^(Commission (?:Delegated|Implementing) (?:Regulation|Decision|Directive) \(EU\) \d{4}\/\d+)/); let rest = t.replace(/^.*? of \d{1,2} \w+ \d{4} /,""); if(m) return m[1].replace(/^Commission /,"") + "：" + rest.slice(0,110) + (rest.length>110?"…":""); return t.slice(0,140)+(t.length>140?"…":""); }

/* ---------- build dossiers ---------- */
const D = CUR.map(c => {
  const o = OEIL[c.oeil] || null;
  const events = [];
  if(o && o.events){
    o.events.forEach(e => {
      const k = classify(e.event);
      events.push({date:e.date, lane:k.lane, zh:k.zh, orig:e.event, refs:e.refs||[], summary:e.summary||"", src:"oeil"});
    });
  }
  (c.council||[]).forEach(x => events.push({date:x.date, lane: x.stage==="deal"||x.stage==="trilogue" ? "trilogue" : "council", zh: x.label, orig: (CSTAGE[x.stage]||x.stage) + (x.body? " · "+x.body:""), note:x.note, verified: x.verified!==false, src:"curated", cstage:x.stage, planned:!!x.planned}));
  (c.milestones||[]).forEach(x => events.push({date:x.date, lane:"impl", zh:x.label, orig: MKIND[x.kind]||x.kind, verified:x.verified!==false, src:"milestone", kind:x.kind}));
  if(o && o.forecasts) o.forecasts.forEach(f => events.push({date:f.date, lane: /committee/i.test(f.event)?"epc":"epp", zh: "排期：" + (/Indicative plenary/.test(f.event)?"全会审议预定日期（一读）":/Vote scheduled in committee/.test(f.event)?"委员会表决排期":f.event), orig:"OEIL Forecast · "+f.event, src:"forecast", planned:true}));
  if(c.tracking) (c.tracking.items||[]).forEach(t => events.push({date:t.date, lane:t.lane||"other", zh:t.text, orig:(t.src||c.tracking.source)+" · 截至 "+fmt(c.tracking.asOf), src:"tracking", planned:!!t.planned, verified:t.verified!==false, url:c.tracking.url}));
  // secondary legislation (own entry only; family view aggregates)
  const s = SEC[c.id];
  if(s){
    (s.initiatives||[]).forEach(i => (i.publications||[]).forEach(p => { if(p.date && p.type!=="INIT_PLANNED") events.push({date:p.date, lane:"secondary", zh:`${ACTTYPE[i.actType]||i.actType}「${i.title}」${PUBTYPE(p.type)}`, orig:`Have Your Say · ${p.type}${p.fbEnd?" · 反馈期至 "+fmt(p.fbEnd):""}${p.feedback?" · 反馈 "+p.feedback+" 条":""}`, src:"hys", url:i.url}); }));
    (s.acts||[]).filter(a=>a.rel!=="cites" || ["standard","delegated","implementing","guidance"].includes(a.kind)).forEach(a => events.push({date:a.date, lane:"secondary", zh:`${ACTKIND[a.kind]||"文件"}发布：${shortTitle(a.title)}`, orig:`EUR-Lex · CELEX ${a.celex}`, src:"eurlex", url:a.url}));
  }
  events.forEach(e=>{ if(e.planned && e.date<=TODAY){ e.zh += "（原定日期，结果待确认）"; e.verified=false; e.planned=false; } });
  events.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const d = Object.assign({}, c, {o, events});
  d.stages = computeStages(d);
  d.completed = o ? /completed/i.test(o.status||"") : false;
  d.proposal = (events.find(e=>/^Legislative proposal/.test(e.orig))||{}).date || "";
  d.lastPast = [...events].reverse().find(e=>e.date<=TODAY && e.src!=="milestone");
  return d;
});
/* ---------- secondary legislation helpers ---------- */
function initStatus(i){
  const pubs = (i.publications||[]).filter(p=>p.date);
  const last = pubs[pubs.length-1];
  if(!last) return {k:"plan", zh:"列入规划", open:false};
  if(last.type==="ABANDONED") return {k:"abandoned", zh:"已放弃", open:false};
  const open = !!(last.fbEnd && last.fbEnd >= TODAY && (!last.fbStart || last.fbStart<=TODAY));
  if(/_DRAFT$/.test(last.type)) return {k:"draft", zh: open?"草案意见征求中":"草案已发布，待通过", open, last};
  if(last.type==="INIT_PLANNED") return {k:"plan", zh:"列入规划，草案未发布", open:false, last};
  if(/INCEP|ROADMAP|CFE|CALL_FOR_EVIDENCE|OPC/.test(last.type)) return {k:"consult", zh: open?"咨询进行中":"咨询已结束", open, last};
  return {k:"adopted", zh: /^PROP_/.test(last.type)?"已提出立法提案":"欧委会已通过", open, last};
}
function familyIds(d){ let root=d; while(root.parent && BYID[root.parent]) root=BYID[root.parent]; const ids=[]; const walk=n=>{ids.push(n.id); D.filter(c=>c.parent===n.id).forEach(walk);}; walk(root); return {root, ids}; }
function secFor(d){
  const {root, ids} = familyIds(d);
  const acts=[], inits=[], seen=new Set();
  ids.forEach(id=>{ const s=SEC[id]; if(!s) return; (s.acts||[]).forEach(a=>{ if(!seen.has(a.celex)){seen.add(a.celex); acts.push(Object.assign({owner:id},a));} }); (s.initiatives||[]).forEach(i=>{ if(!seen.has("h"+i.id)){seen.add("h"+i.id); inits.push(Object.assign({owner:id},i));} }); });
  return {root, acts, inits};
}
function allInits(){
  const out=[];
  D.forEach(d=>{ const s=SEC[d.id]; if(!s) return; const prop = familyIds(d).root.proposal || d.proposal || "";
    (s.initiatives||[]).forEach(i=>{ const st=initStatus(i);
      if(prop && ["consult","plan"].includes(st.k) && st.last && st.last.date && st.last.date < prop && !/^(REG|DEC|DIR)_(DEL|IMPL)$/.test(i.actType)) st.k="historic";
      out.push(Object.assign({d, st},i)); }); });
  return out;
}
const BYID = Object.fromEntries(D.map(d=>[d.id,d]));
const BYREF = Object.fromEntries(D.map(d=>[d.oeil,d]));

function computeStages(d){
  const ev = d.events, past = e => e.date <= TODAY;
  const find = re => ev.filter(e=>e.src==="oeil" && re.test(e.orig));
  const first = a => a.length ? a[0].date : "";
  const last = a => a.length ? a[a.length-1].date : "";
  const S = {};
  S.prop = {date:first(find(/^Legislative proposal/))};
  const epcEv = find(/^(Committee referral|Vote in committee|Committee report tabled|Committee decision to open)/);
  const voteC = find(/^(Vote in committee|Committee decision to open)/);
  S.epc = {date:first(voteC), started: epcEv.length>0, note: voteC.length? "委员会表决" : (epcEv.length? "审议中":"")};
  const agreeC = find(/^Approval in committee of the text agreed/);
  const decisions = find(/^Decision by Parliament/);
  const rule72 = find(/confirmed by plenary/);
  const cAdopt = find(/^Act adopted by Council/);
  const agreeDate = first(agreeC);
  const curDeal = (d.council||[]).filter(x=>x.stage==="deal").map(x=>x.date).sort();
  const dealDate = curDeal[0] || agreeDate;
  let mandate = "", finalEp = "";
  if(dealDate){
    const before = decisions.filter(e=>e.date < dealDate), after = decisions.filter(e=>e.date >= dealDate);
    mandate = first(before) || first(rule72) || first(find(/^Matter referred back/));
    finalEp = first(after);
  } else if(decisions.length){
    mandate = first(decisions);
    if(cAdopt.length) finalEp = last(decisions);
  } else mandate = first(rule72);
  S.epm = {date:mandate, note: rule72.length && !decisions.filter(e=>!dealDate||e.date<dealDate).length ? "谈判授权（第72条）" : (mandate?"一读立场/谈判授权":"")};
  const cpos = (d.council||[]).filter(x=>x.stage==="ga"||x.stage==="coreper").map(x=>x.date).sort();
  S.cou = {date: cpos[0]||"", note: cpos.length? "总体方针 / 谈判授权" : ""};
  const noTrilogue = !dealDate && cAdopt.length>0;
  S.tri = {date: dealDate, skip: noTrilogue, note: noTrilogue? "未经三方谈判" : (dealDate? "达成临时协议":"")};
  S.adopt = {date: first(cAdopt), note: finalEp? "议会 "+fmt(finalEp)+" · 理事会 "+fmt(first(cAdopt)) : ""};
  if(!S.cou.date && (S.tri.date||S.adopt.date)) { S.cou.skip = true; S.cou.note = noTrilogue ? "直接通过议会文本" : "OEIL 未载，待补充"; }
  const oj = find(/^Final act published/);
  S.oj = {date:first(oj), note: d.o && d.o.mainAct ? d.o.mainAct : ""};
  const impl = (d.milestones||[]).filter(m=>m.kind==="apply"||m.kind==="force"||m.kind==="transpose").map(m=>m.date).sort();
  const implPast = impl.filter(x=>x<=TODAY);
  S.impl = {date: implPast.length? implPast[implPast.length-1] : "", next: impl.find(x=>x>TODAY)||"", note:""};
  if(S.oj.date && !impl.length) S.impl.note = "见公报";
  // status per stage
  let cur = -1;
  const keys = STAGES.map(s=>s.k);
  keys.forEach(k => { S[k].done = !!(S[k].date && S[k].date<=TODAY) || (k==="epc" && !!S.epm.date) || (S[k].skip && !!S.adopt.date); });
  if(S.oj.done && !S.impl.done && S.oj.date) S.impl.done = !S.impl.next;
  for(let i=0;i<keys.length;i++){ if(!S[keys[i]].done){ cur=i; break; } }
  // parallel tracks: EP and Council work at the same time — mark whichever is unfinished as current
  S._cur = cur;
  return S;
}

      ${openI.length?openI.map(i=>`<div class="act"><span class="d" style="color:var(--open)">截止 ${fmt(i.st.last.fbEnd).slice(5)}</span><span class="pill">${esc(ACTTYPE[i.actType]||i.actType)}</span> <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> <span class="sub">· <a data-go="${i.d.id}" href="javascript:void 0">${esc(i.d.shortZh)}</a></span></div>`).join(""):'<div class="muted" style="font-size:13px">当前没有开放的反馈期</div>'}

function feedLi(e){

  return `<li><div class="d">${fmt(e.date)}</div><div><div class="t"><span class="lane-dot" style="background:${L.color}"></span>${esc(e.zh)}${e.verified===false?'<span class="unv">待核实</span>':''}</div><div class="s"><a data-go="${e.d.id}" href="javascript:void 0">${esc(e.d.shortZh||e.d.nameZh)}</a> · ${L.zh} · <span class="mono">${esc(e.d.oeil)}</span></div></div></li>`;

function allEvents(){
  const out=[]; D.forEach(d=>d.events.forEach(e=>out.push(Object.assign({d},e))));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function gantt(){
  const order = Object.keys(CATS);
  const rows = [...D].filter(d=>d.proposal).sort((a,b)=> order.indexOf(a.category)-order.indexOf(b.category) || (a.proposal<b.proposal?-1:1));
  const minY = Math.min(...rows.map(d=>+d.proposal.slice(0,4))), maxY = new Date().getFullYear()+1;
  const t0 = Date.parse(minY+"-01-01"), t1 = Date.parse(maxY+"-01-01");
  const x = d => ((Date.parse(d)-t0)/(t1-t0)*100).toFixed(2)+"%";
  const w = (a,b) => ((Date.parse(b)-Date.parse(a))/(t1-t0)*100).toFixed(2)+"%";
  let years=""; for(let y=minY;y<=maxY;y++){ years += `<span style="left:${x(y+"-01-01")}">${y}</span>`; }
  let grid=""; for(let y=minY;y<=maxY;y++){ grid += `<div class="gyear" style="left:${x(y+"-01-01")}"></div>`; }
  const today = `<div class="gtoday" style="left:${x(TODAY)}"></div>`;
  return `<div class="gantt-wrap"><div class="gantt">
    <div class="grow" style="border-bottom:1px solid var(--line)"><div></div><div class="gaxis">${years}</div></div>
    ${rows.map(d=>{
      const S=d.stages, p=d.proposal, m=S.epm.date, deal=S.tri.date, oj=S.oj.date;
      let segs="";
      if(d.completed && oj){
        const mid = deal || m || p;
        if(m && m>p) segs += `<div class="seg ep" style="left:${x(p)};width:${w(p, deal && deal<m?deal:m)}" title="提案 → 议会立场"></div>`;
        if(deal){ const s = m && m<deal ? m : p; segs += `<div class="seg tri" style="left:${x(s)};width:${w(s,deal)}" title="三方谈判"></div>`; }
        else if(!m) segs += `<div class="seg ep" style="left:${x(p)};width:${w(p,mid)}"></div>`;
        segs += `<div class="seg fin" style="left:${x(deal||m||p)};width:${w(deal||m||p,oj)}" title="协议 → 公报"></div>`;
      } else {
        if(m) segs += `<div class="seg ep" style="left:${x(p)};width:${w(p,m)}" title="提案 → 议会立场"></div>`;
        const s = m||p;
        if(deal) segs += `<div class="seg tri" style="left:${x(s)};width:${w(s,deal)}"></div><div class="seg open" style="left:${x(deal)};width:${w(deal,TODAY)}"></div>`;
        else segs += `<div class="seg open" style="left:${x(s)};width:${w(s,TODAY)}" title="审议中"></div>`;
      }
      const cous = (d.council||[]).filter(c=>c.stage==="ga"||c.stage==="coreper").map(c=>`<div class="mk cou" style="left:${x(c.date)}" title="${esc(c.label)} ${fmt(c.date)}"></div>`).join("");
      const tip = `${d.nameZh} | 提案 ${fmt(p)}${m?" | 议会立场 "+fmt(m):""}${deal?" | 协议 "+fmt(deal):""}${oj?" | 公报 "+fmt(oj):""}`;
      return `<div class="grow"><div class="gname" data-go="${d.id}" title="${esc(tip)}">${catDot(d.category)}${esc(d.shortZh||d.nameZh)}</div>
        <div class="gtrack" title="${esc(tip)}">${grid}${segs}<div class="mk prop" style="left:${x(p)}"></div>${cous}${today}</div></div>`;
    }).join("")}
  </div></div>`;
}

/* ----- dossiers ----- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return D.filter(d=>{
    if(state.cat!=="all" && d.category!==state.cat) return false;
    if(state.st==="live" && d.completed) return false;
    if(state.st==="done" && !d.completed) return false;
    if(state.st==="core" && d.relevance!=="core") return false;
    if(q){
      const hay = [d.nameZh,d.shortZh,d.oeil,d.o&&d.o.title,d.o&&d.o.mainAct,(d.tags||[]).join(" "),d.summaryZh].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function vDossiers(){
  const list = filtered();
  // group children under parents when parent is visible
  const ids = new Set(list.map(d=>d.id));
  const roots = list.filter(d=>!d.parent || !ids.has(d.parent));
  const rows=[];
  const push=(d,depth)=>{ rows.push([d,depth]); list.filter(c=>c.parent===d.id).forEach(c=>push(c,depth+1)); };
  roots.forEach(r=>push(r,0));
  const sel = BYID[state.id] || D[0];
  return `<div class="layout">
    <aside class="card side">
      <div class="filters">
        <input class="search" id="q" placeholder="搜索：名称 / 程序编号 / 法案号 / 关键词" value="${esc(state.q)}">
        <div class="chips" id="cats"><span class="chip ${state.cat==="all"?"on":""}" data-c="all">全部领域</span>${Object.entries(CATS).map(([k,v])=>`<span class="chip ${state.cat===k?"on":""}" data-c="${k}">${catDot(k)}${v.zh}</span>`).join("")}</div>
        <div class="chips" id="sts">${[["all","全部"],["live","审议中"],["done","已通过"],["core","核心法规"]].map(([k,z])=>`<span class="chip ${state.st===k?"on":""}" data-s="${k}">${z}</span>`).join("")}</div>
      </div>
      <div class="list">${rows.map(([d,dep])=>`
        <div class="item ${dep?"child":""} ${d.id===sel.id?"on":""}" data-go="${d.id}" style="${dep>1?"margin-left:"+(16*dep)+"px":""}">
          <div class="n">${catDot(d.category)}${esc(d.shortZh||d.nameZh)}</div>
          <div class="m"><span class="mono">${esc(d.oeil)}</span>${d.o&&d.o.mainAct?`<span>${esc(d.o.mainAct)}</span>`:""}<span style="color:${d.completed?"var(--done)":"var(--current)"}">● ${esc(curStageName(d))}</span></div>
        </div>`).join("") || '<div class="empty">没有匹配的法规</div>'}
      </div>
    </aside>
    <section class="detail">${sel ? vDetail(sel) : ""}</section>
  </div>`;
}
function bindDossiers(){
  const q = document.getElementById("q");
  q.addEventListener("input",()=>{ state.q=q.value; const pos=q.selectionStart; render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); });
  document.getElementById("cats").addEventListener("click",e=>{const c=e.target.closest("[data-c]"); if(!c) return; state.cat=c.dataset.c; store.set("cat",state.cat); render();});
  document.getElementById("sts").addEventListener("click",e=>{const c=e.target.closest("[data-s]"); if(!c) return; state.st=c.dataset.s; store.set("st",state.st); render();});
  const sa = document.getElementById("showAll"); if(sa) sa.addEventListener("change",()=>{state.showAll=sa.checked; render();});
  document.querySelectorAll("[data-lane]").forEach(cb=>cb.addEventListener("change",()=>{
    state.lanes = [...document.querySelectorAll("[data-lane]")].filter(x=>x.checked).map(x=>x.dataset.lane); store.set("lanes2",state.lanes); render();
  }));
}

function vDetail(d){
  const o = d.o || {};
  const S = d.stages;
  const pipe = STAGES.map((s,i)=>{
    const st = S[s.k]; const cls = st.done ? "done" : (i===S._cur ? "cur" : "");
    let dt = st.date ? (st.date>TODAY?"预计 ":"") + fmt(st.date) :(s.k==="impl" && st.next ? "下一节点 "+fmt(st.next) : (i===S._cur? "进行中" : "—"));
    if(s.k==="epc" && !st.date && st.started) dt = st.done ? "未经委员会表决" : "审议中";
    const note = (s.k==="epc" && st.done && !st.date) ? "紧急程序/直接提交全会" : st.note;
    return `<div class="stg ${cls} ${st.skip?"skip":""}"><div class="dot">${st.done?"✓":i+1}</div><div class="nm">${s.nm}</div><div class="who">${s.who}</div><div class="dt">${dt}</div>${note?`<div class="who">${esc(note)}</div>`:""}</div>`;
  }).join("");
  return `
  <div class="card dhead">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${catDot(d.category)}<span class="muted" style="font-size:12px">${esc(CATS[d.category]?CATS[d.category].zh:"")}</span>${statusPill(d)}${d.relevance==="core"?'<span class="pill core">核心</span>':""}</div>
    <h1>${esc(d.nameZh)}</h1>
    <div class="en">${esc(o.title||"")}</div>
    <div class="meta">
      <span>程序编号 <b class="mono"><a href="${oeilUrl(d.oeil)}" target="_blank" rel="noopener">${esc(d.oeil)}</a></b></span>
      ${o.procedureType?`<span>程序 <b>${esc(o.procedureType.replace(/ \(ex-codecision procedure\)/,""))}</b></span>`:""}
      ${o.instrument?`<span>文件类型 <b>${esc(o.instrument)}</b></span>`:""}
      ${o.mainAct?`<span>最终法案 <b>${o.mainActHref?`<a href="${esc(o.mainActHref)}" target="_blank" rel="noopener">${esc(o.mainAct)}</a>`:esc(o.mainAct)}</b> <span class="faint">${esc(o.mainActOj||"")}</span></span>`:""}
      ${o.fetchedAt?`<span class="faint">抓取于 ${esc(tsFmt(o.fetchedAt))}</span>`:""}
    </div>
    <div class="tags">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  </div>

  <div class="card"><div class="hd"><h3>立法阶段进程</h3><span class="muted" style="font-size:12px">当前：${esc(curStageName(d))}</span></div><div class="pipe">${pipe}</div></div>

  <div class="cols">
    <div class="card sum"><div class="hd"><h3>法规要点</h3></div><div class="bd"><p>${esc(d.summaryZh||"")}</p>
      ${(d.impactZh&&d.impactZh.length)?`<div class="sub" style="margin:6px 0 4px;font-weight:600">对电池/能源产业的影响</div><ul>${d.impactZh.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div></div>
    <div class="card"><div class="hd"><h3>法规谱系与关联</h3></div><div class="bd">${vFamily(d)}</div></div>
  </div>
  ${vTracking(d)}
  ${vSecondary(d)}

  <div class="card actors"><div class="hd"><h3>主要参与方</h3><span class="muted" style="font-size:12px">来源：OEIL Key players</span></div><div class="bd">${vActors(d)}</div></div>
  ${vDocs(d)}

  <div class="card"><div class="hd"><h3>完整进程时间线</h3>
      <div class="toolbar"><label><input type="checkbox" id="showAll" ${state.showAll?"checked":""}>显示全会表决/辩论明细</label></div></div>
    <div class="lanes">${Object.entries(LANES).map(([k,v])=>`<label><input type="checkbox" data-lane="${k}" ${state.lanes.includes(k)?"checked":""}> <span class="lane-dot" style="background:${v.color}"></span>${v.zh}</label>`).join("")}</div>
    <div class="bd">${vTimeline(d)}</div>
  </div>
  ${o.delegatedActs && o.delegatedActs.length ? `<div class="card"><div class="hd"><h3>授权法案审查（议会）</h3></div><div class="bd">${o.delegatedActs.map(a=>`<div class="relrow"><a class="mono" href="${oeilUrl(a.ref)}" target="_blank" rel="noopener">${esc(a.ref)}</a> <span class="muted">${esc(a.subject)}</span></div>`).join("")}</div></div>`:""}
  `;
}

function vFamily(d){
  // root of family
  let root = d; while(root.parent && BYID[root.parent]) root = BYID[root.parent];
  const nodes=[]; const walk=(n,dep)=>{ nodes.push([n,dep]); D.filter(c=>c.parent===n.id).forEach(c=>walk(c,dep+1)); }; walk(root,0);
  let html = "";
  if(nodes.length>1){
    html += `<div class="sub" style="margin-bottom:6px">原始法规 → 后续修订</div><div class="family">` + nodes.map(([n,dep])=>`<div class="fam-node ${n.id===d.id?"me":""}" style="padding-left:${dep*18}px">${dep?'<span class="ln">└</span>':""}${catDot(n.category)}<a data-go="${n.id}" href="javascript:void 0">${esc(n.shortZh||n.nameZh)}</a><span class="mono faint">${esc(n.o&&n.o.mainAct||n.oeil)}</span>${n.completed?"":'<span class="pill live">审议中</span>'}</div>`).join("") + `</div>`;
  }
  const rel = (d.o && d.o.relations) || [];
  if(rel.length){
    html += `<div class="sub" style="margin:${nodes.length>1?"12px":"0"} 0 4px">OEIL 记录的法律关系</div>` + rel.map(r=>{
      const inDb = BYREF[r.ref];
      const lab = r.label.replace(/^Amending act/,"修订法案").replace(/^Amending/,"修订").replace(/^Repealing/,"废止").replace(/^Amended by/,"被修订于").replace(/^Repealed by/,"被废止于").replace(/^See also/,"另见").replace(/^Supplementing/,"补充");
      return `<div class="relrow">${esc(lab)} · ${inDb?`<a data-go="${inDb.id}" href="javascript:void 0">${esc(inDb.shortZh)}</a> <span class="mono faint">${esc(r.ref)}</span>`:`<a class="mono" href="${oeilUrl(r.ref)}" target="_blank" rel="noopener">${esc(r.ref)}</a>`}</div>`;
    }).join("");
  }
  return html || '<span class="muted">暂无关联记录</span>';
}

function people(list){ return (list||[]).map(p=>`${esc(p.name)}${p.group?`<span class="grp" style="background:${grpColor(p.group)}">${esc(p.group)}</span>`:""}`).join("、"); }
function vActors(d){

        ${c.shadows&&c.shadows.length?`<details><summary>影子报告员（${c.shadows.length}）</summary><div class="shadows">${c.shadows.map(p=>`<span>${esc(p.name)}<span class="grp" style="background:${grpColor(p.group)}">${esc(p.group)}</span></span>`).join("")}</div></details>`:""}</td>

      ${comm.length?comm.map(r=>`<div class="relrow">总司 DG：<b>${esc(r[0])}</b>${r[1]?`<br>负责委员：<b>${esc(r[1])}</b>`:""}</div>`).join(""):'<span class="muted">—</span>'}</div>

function vTimeline(d){
  let ev = d.events.filter(e=>state.lanes.includes(e.lane));
  if(!state.showAll) ev = ev.filter(e=>!(e.src==="oeil" && /^(Results of vote|Debate in Parliament)/.test(e.orig)));
  if(!ev.length) return '<div class="empty">无事件（检查上方的分类开关）</div>';
  let out = '<ul class="tl">', yr = "";
  ev.forEach(e=>{
    const y = e.date.slice(0,4);
    if(y!==yr){ yr=y; out += `<li class="yr"><div class="d">${y}</div><div class="rail"></div><div></div></li>`; }
    const L = LANES[e.lane], fut = e.date>TODAY;
    const refs = (e.refs||[]).map(r=> r.href ? `<a class="mono" href="${esc(r.href.startsWith("http")?r.href:"https://oeil.europarl.europa.eu"+r.href)}" target="_blank" rel="noopener">${esc(r.text)}</a>` : `<span class="mono">${esc(r.text)}</span>`).join(" ");
    out += `<li class="${fut?"future":""}"><div class="d">${fmt(e.date.slice(5)).replace(/^/, "")}</div><div class="rail"><i style="background:${L.color}"></i></div>
      <div class="ev"><span class="lane" style="color:${L.color}">${L.zh}</span>${esc(e.zh)}${e.verified===false?'<span class="unv">待核实</span>':""}${fut?'<span class="unv" style="color:var(--faint);border-color:var(--faint)">未来</span>':""}
        <div class="orig">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.orig)}</a>`:esc(e.orig)}${refs?" · "+refs:""}${e.summary?` · <a href="${esc(e.summary)}" target="_blank" rel="noopener">摘要</a>`:""}${e.note?" · "+esc(e.note):""}</div></div></li>`;
  });
  return out + "</ul>";
}

/* ----- pending-file tracking ----- */
function vTracking(d){
  const fut = d.events.filter(e=>e.date>TODAY && e.src!=="milestone" && e.src!=="hys" && e.src!=="eurlex");
  const t = d.tracking;
  if(!t && !fut.length) return "";
  const items = d.events.filter(e=>e.date<=TODAY && (e.src==="tracking"||e.src==="curated")).slice(-8).reverse().map(e=>({date:e.date, lane:e.lane, text:e.zh + (e.verified===false?" ⚠":""), }));
  return `<div class="card"><div class="hd"><h3>${d.completed?"后续排期":"在审动态跟进"}</h3>${t?`<span class="muted" style="font-size:12px">来源：<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.source)}</a> · 截至 ${fmt(t.asOf)}</span>`:""}</div>
    <div class="bd">
      ${fut.length?`<div class="sub" style="font-weight:600;margin-bottom:6px">已排期 / 预计节点</div><ul class="feed">${fut.map(e=>`<li><div class="d">${fmt(e.date)}</div><div><div class="t"><span class="lane-dot" style="background:${LANES[e.lane].color}"></span>${esc(e.zh)}${e.verified===false?'<span class="unv">待核实</span>':""}</div><div class="s">${LANES[e.lane].zh} · ${esc(e.orig)}</div></div></li>`).join("")}</ul>`:""}
      ${items.length?`<div class="sub" style="font-weight:600;margin:12px 0 6px">最近进展</div><ul class="feed">${items.map(x=>`<li><div class="d">${fmt(x.date)}</div><div><div class="t"><span class="lane-dot" style="background:${(LANES[x.lane]||LANES.other).color}"></span>${esc(x.text)}</div><div class="s">${(LANES[x.lane]||LANES.other).zh}</div></div></li>`).join("")}</ul>`:""}
      ${t&&t.outlook?`<div class="relrow" style="margin-top:10px"><b>展望：</b>${esc(t.outlook)}</div>`:""}
    </div></div>`;
}

/* ----- secondary legislation ----- */
function initRow(i, showOwner){
  const st = i.st || initStatus(i);
  const pubs = (i.publications||[]);
  const steps = pubs.filter(p=>p.type!=="ABANDONED").map(p=>`<span class="step ${p.date?"on":""}" title="${esc(p.type)}">${esc(PUBTYPE(p.type))}${p.date?" "+fmt(p.date):""}${p.feedback?` · ${p.feedback}条反馈`:""}</span>`).join('<span class="arr">→</span>');
  const fb = st.last && st.last.fbEnd ? `反馈期 ${fmt(st.last.fbStart||"")} – ${fmt(st.last.fbEnd)}` : "";
  return `<div class="init">
    <div class="ihd"><span class="pill ${st.open?"open":st.k==="adopted"?"done":st.k==="draft"?"live":""}">${esc(st.zh)}</span><span class="pill">${esc(ACTTYPE[i.actType]||i.actType||"")}</span>
      <a href="${esc(i.url)}" target="_blank" rel="noopener" class="ititle">${esc(i.title)}</a>
      ${showOwner&&i.d?`<span class="sub">· <a data-go="${i.d.id}" href="javascript:void 0">${esc(i.d.shortZh)}</a></span>`:""}</div>
    <div class="steps">${steps}</div>
    ${fb?`<div class="sub" style="${st.open?"color:var(--open);font-weight:600":""}">${fb}${st.open?" · 正在开放":""}</div>`:""}
    ${i.matchedBy==="title"?`<div class="faint" style="font-size:11px">按标题关键词匹配</div>`:""}
  </div>`;
}
function vSecondary(d){
  let {root, acts, inits} = secFor(d);
  if(!acts.length && !inits.length) return "";
  const famProp = root.proposal || d.proposal || "";
  const isHistoric = i => { const st=initStatus(i); return famProp && ["consult","plan"].includes(st.k) && st.last && st.last.date && st.last.date < famProp && !/^(REG|DEC|DIR)_(DEL|IMPL)$/.test(i.actType); };
  const historic = inits.filter(isHistoric);
  inits = inits.filter(i=>!isHistoric(i));
  const pending = inits.filter(i=>!["adopted","abandoned"].includes(initStatus(i).k)).sort((a,b)=>{const A=initStatus(a),B=initStatus(b); return (B.open-A.open) || ((B.last&&B.last.date||"")>(A.last&&A.last.date||"")?1:-1);});
  const adoptedInits = inits.filter(i=>initStatus(i).k==="adopted");
  const groups = {};
  acts.forEach(a=>{ (groups[a.kind]=groups[a.kind]||[]).push(a); });
  const order = ["delegated","implementing","standard","guidance","report","amending","proposal","commission-act","council-act","other"];
  const via = root.id!==d.id ? `<span class="muted" style="font-size:12px">按法规族汇总（母法：${esc(root.shortZh)}）</span>` : `<span class="muted" style="font-size:12px">来源：Have Your Say · EUR-Lex</span>`;
  return `<div class="card"><div class="hd"><h3>二级立法、草案与意见征求</h3>${via}</div><div class="bd">
    <div class="sub" style="font-weight:600;margin-bottom:6px">在途草案与规划（${pending.length}）</div>
    ${pending.length?pending.map(i=>initRow(i)).join(""):'<div class="muted" style="font-size:13px">暂无在途草案</div>'}
    ${adoptedInits.length?`<details style="margin-top:8px"><summary>欧委会已通过的举措（${adoptedInits.length}）</summary>${adoptedInits.map(i=>initRow(i)).join("")}</details>`:""}
    ${historic.length?`<details style="margin-top:6px"><summary>立法提案之前的历史举措（${historic.length}）</summary>${historic.map(i=>initRow(i)).join("")}</details>`:""}
    <div class="sub" style="font-weight:600;margin:16px 0 6px">已发布的二级立法与相关文件（EUR-Lex，${acts.length}）</div>
    ${order.filter(k=>groups[k]).map(k=>`<div class="actgrp"><div class="agh">${ACTKIND[k]}（${groups[k].length}）</div>${groups[k].sort((a,b)=>a.date<b.date?1:-1).slice(0,40).map(a=>`<div class="act"><span class="d">${fmt(a.date)}</span><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(shortTitle(a.title))}</a>${a.rel==="cites"?'<span class="faint" style="font-size:11px"> · 引用</span>':""}</div>`).join("")}${groups[k].length>40?`<div class="faint" style="font-size:12px">…另有 ${groups[k].length-40} 件</div>`:""}</div>`).join("")}
  </div></div>`;
}

/* ----- OEIL documentation gateway ----- */
function vDocs(d){
  const docs = d.o && d.o.documents; if(!docs || !docs.length) return "";
  const grouped = {};
  docs.forEach(x=>{ const k=x.inst+"|"+x.date+"|"+x.type+"|"+x.extra; if(grouped[k]) grouped[k].more.push(x); else grouped[k]=Object.assign({more:[]},x); });
  const by = {}; Object.values(grouped).forEach(x=>{ if(x.more.length){ const all=[x].concat(x.more); x.refsHtml = all.map(y=>y.href?`<a class="mono" href="${esc(y.href)}" target="_blank" rel="noopener">${esc(y.ref)}</a>`:`<span class="mono">${esc(y.ref)}</span>`).join(" "); x.type += ` ×${all.length}`; } (by[x.inst]=by[x.inst]||[]).push(x); });
  return `<div class="card"><div class="hd"><h3>立法文件库</h3><span class="muted" style="font-size:12px">报告草案 · 修正案 · 委员会意见 · 成员国议会 · 咨询机构 · 来源：OEIL</span></div><div class="bd">
    ${["EP","CSL","EC","NP","OTHER"].filter(k=>by[k]).map(k=>`<div class="actgrp"><div class="agh">${INST[k]}（${by[k].length}）</div>${by[k].sort((a,b)=>a.date<b.date?1:-1).map(x=>`<div class="act"><span class="d">${fmt(x.date)}</span><span>${esc(docZh(x.type))}${x.extra?` <span class="cbadge">${esc(x.extra.replace(/_/g," "))}</span>`:""}</span> ${x.refsHtml ? x.refsHtml : x.href?`<a class="mono" href="${esc(x.href)}" target="_blank" rel="noopener">${esc(x.ref)}</a>`:`<span class="mono">${esc(x.ref)}</span>`}</div>`).join("")}</div>`).join("")}
  </div></div>`;
}

/* ----- drafts & secondary legislation (all dossiers) ----- */
let draftFilter = {st: store.get("dst2","auto"), cat:"all", q:""};
function vDrafts(){
  let list = allInits();
  const full = list.slice();
  const cnt = k => full.filter(i=> k==="open"? i.st.open : k==="all"? true : i.st.k===k).length;
  if(draftFilter.st==="auto") draftFilter.st = cnt("open") ? "open" : "draft";
  if(draftFilter.cat!=="all") list = list.filter(i=>i.d.category===draftFilter.cat);
  if(draftFilter.st==="open") list = list.filter(i=>i.st.open);
  else if(draftFilter.st!=="all") list = list.filter(i=>i.st.k===draftFilter.st);
  const q = draftFilter.q.trim().toLowerCase(); if(q) list = list.filter(i=>(i.title+" "+(i.summary||"")+" "+i.d.nameZh).toLowerCase().includes(q));
  list.sort((a,b)=>{ const ad=(a.st.last&&(a.st.open?a.st.last.fbEnd:a.st.last.date))||"", bd=(b.st.last&&(b.st.open?b.st.last.fbEnd:b.st.last.date))||""; return draftFilter.st==="open" ? (ad<bd?-1:1) : (ad<bd?1:-1); });
  const acts=[]; D.forEach(d=>{ const s=SEC[d.id]; if(s) (s.acts||[]).forEach(a=>acts.push(Object.assign({d},a))); });
  acts.sort((a,b)=>a.date<b.date?1:-1);
  const recentActs = acts.filter(a=>a.rel!=="cites"||["standard","delegated","implementing"].includes(a.kind)).slice(0,30);
  const tabs=[["open","意见征求中"],["draft","草案已发布待通过"],["plan","规划中"],["consult","咨询/证据征集"],["adopted","已通过"],["all","全部"]];
  return `<div class="card" style="margin-bottom:16px"><div class="hd" style="flex-wrap:wrap"><h3>授权法案 / 实施法案 / 立法草案 · 意见征求</h3><span class="muted" style="font-size:12px">来源：欧委会 Have Your Say${SEC_GEN?" · 更新于 "+esc(SEC_tsFmt(GEN)):""}</span></div>
    <div class="filters" style="border-bottom:1px solid var(--line)">
      <div class="chips" id="dst">${tabs.map(([k,z])=>`<span class="chip ${draftFilter.st===k?"on":""}" data-s="${k}">${z}（${cnt(k)}）</span>`).join("")}</div>
      <div class="chips" id="dcat"><span class="chip ${draftFilter.cat==="all"?"on":""}" data-c="all">全部领域</span>${Object.entries(CATS).map(([k,v])=>`<span class="chip ${draftFilter.cat===k?"on":""}" data-c="${k}">${catDot(k)}${v.zh}</span>`).join("")}</div>
      <input class="search" id="dq" placeholder="搜索草案标题 / 法规" value="${esc(draftFilter.q)}">
    </div>
    <div class="bd">${list.map(i=>initRow(i,true)).join("")||'<div class="empty">没有符合条件的草案</div>'}</div></div>
  <div class="card"><div class="hd"><h3>最新发布的二级立法（EUR-Lex）</h3></div><div class="bd">${recentActs.map(a=>`<div class="act"><span class="d">${fmt(a.date)}</span><span class="pill">${esc(ACTKIND[a.kind]||"")}</span> <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(shortTitle(a.title))}</a> <span class="sub">· <a data-go="${a.d.id}" href="javascript:void 0">${esc(a.d.shortZh)}</a></span></div>`).join("")||'<div class="muted">尚无数据，请运行更新脚本</div>'}</div></div>`;
}
function bindDrafts(){
  document.getElementById("dst").addEventListener("click",e=>{const c=e.target.closest("[data-s]"); if(!c) return; draftFilter.st=c.dataset.s; store.set("dst2",draftFilter.st); render();});
  document.getElementById("dcat").addEventListener("click",e=>{const c=e.target.closest("[data-c]"); if(!c) return; draftFilter.cat=c.dataset.c; render();});
  const q=document.getElementById("dq"); q.addEventListener("input",()=>{draftFilter.q=q.value; const p=q.selectionStart; render(); const n=document.getElementById("dq"); n.focus(); n.setSelectionRange(p,p);});
}

/* ----- feed ----- */
let feedFilter = {cat:"all", lane:"all", range:"past"};
function vFeed(){
  let ev = allEvents().filter(e=>!(e.src==="oeil" && /^(Results of vote|Debate in Parliament)/.test(e.orig)));
  if(feedFilter.cat!=="all") ev = ev.filter(e=>e.d.category===feedFilter.cat);
  if(feedFilter.lane!=="all") ev = ev.filter(e=>e.lane===feedFilter.lane);
  if(feedFilter.range==="future") ev = ev.filter(e=>e.date>TODAY);
  else if(feedFilter.range==="past") ev = ev.filter(e=>e.date<=TODAY);
  ev = ev.reverse();
  let html = "", ym="";
  ev.forEach(e=>{ const m=e.date.slice(0,7); if(m!==ym){ ym=m; html += `<li style="display:block;border:0;padding:14px 0 4px;font-weight:700">${m.replace("-"," 年 ")} 月</li>`; } html += feedLi(e); });
  return `<div class="card"><div class="hd" style="flex-wrap:wrap"><h3>全部立法动态</h3>
    <div class="chips" id="fcat" style="margin-left:auto"><span class="chip ${feedFilter.cat==="all"?"on":""}" data-c="all">全部领域</span>${Object.entries(CATS).map(([k,v])=>`<span class="chip ${feedFilter.cat===k?"on":""}" data-c="${k}">${catDot(k)}${v.zh}</span>`).join("")}</div></div>
    <div class="lanes"><span class="chips" id="flane"><span class="chip ${feedFilter.lane==="all"?"on":""}" data-l="all">全部机构</span>${Object.entries(LANES).map(([k,v])=>`<span class="chip ${feedFilter.lane===k?"on":""}" data-l="${k}"><span class="lane-dot" style="background:${v.color}"></span>${v.zh}</span>`).join("")}</span>
      <span class="chips" id="frange" style="margin-left:auto">${[["all","全部"],["past","已发生"],["future","未来节点"]].map(([k,z])=>`<span class="chip ${feedFilter.range===k?"on":""}" data-r="${k}">${z}</span>`).join("")}</span></div>
    <div class="bd"><ul class="feed">${html||'<li class="muted">无</li>'}</ul></div></div>`;
}
function bindFeed(){
  const on=(id,attr,key)=>document.getElementById(id).addEventListener("click",e=>{const c=e.target.closest("["+attr+"]"); if(!c) return; feedFilter[key]=c.getAttribute(attr); render();});
  on("fcat","data-c","cat"); on("flane","data-l","lane"); on("frange","data-r","range");
}

/* ----- help ----- */
function vHelp(){
  return `<div class="card help"><div class="hd"><h3>数据来源与更新方式</h3></div><div class="bd">
  <p><b>两层数据结构</b></p>
  <ul>
    <li><b>自动层</b> <code>data/oeil-data.js</code>：由 <code>tools/update-oeil.ps1</code> 从欧洲议会立法观察站（OEIL）抓取。包括欧委会提案、议会各委员会（主审 / 联合 / 关联 / 意见委员会）、报告员与影子报告员、委员会表决、全会决定、三方谈判授权与协议批准、理事会通过、签署与公报发布、最终法案编号、授权法案审查。</li>
    <li><b>人工层</b> <code>data/curated.js</code>：监测清单、中文名称与要点解读、产业影响、法规谱系（parent 字段），以及 OEIL 不记录的<b>理事会内部节点</b>（工作组 / COREPER 授权 / 总体方针 / 三方临时协议）和<b>实施适用节点</b>。标注“待核实”的条目需要对照理事会新闻稿或 EUR-Lex 再确认。</li>
  </ul>
  <ul>
    <li><b>二级立法层</b> <code>data/secondary-data.js</code>：由 <code>tools/update-secondary.ps1</code> 自动抓取。① EUR-Lex（Cellar SPARQL）：依据母法制定、修订母法或引用母法的授权法案、实施法案、协调标准、指南通知、欧委会报告；② 欧委会 Have Your Say：规划中的授权/实施法案、证据征集与公众咨询、<b>草案意见征求</b>（含反馈期与反馈数量）、通过阶段。配置（母法 CELEX、关键词）见 <code>data/sources.json</code>。</li>
    <li><b>在审动态层</b> <code>curated.js</code> 中的 <code>tracking</code>：Legislative Train 等站点禁止脚本抓取，由人工阅读后整理，每条注明来源与“截至”日期；OEIL 的委员会表决排期、全会预定日期、报告草案、修正案、意见等则自动抓取。</li>
    <li><b>变更追踪</b> <code>data/changes.js</code>：每次更新与上次快照对比，新增的事件、排期、文件、草案阶段、二级立法都会出现在总览“新增动态”中。</li>
  </ul>
  <p><b>一键更新全部数据</b>（在项目文件夹中打开 PowerShell）：</p>
  <pre>powershell -ExecutionPolicy Bypass -File tools\\update-all.ps1</pre>
  <p>分步运行：<code>update-oeil.ps1</code>（立法程序）→ <code>update-secondary.ps1</code>（二级立法与草案）→ <code>build.ps1</code>（变更追踪 + 生成 tracker.html）。只更新某一个程序：<code>update-oeil.ps1 -Only "2026/0068(COD)"</code>；只更新某部法规的二级立法：<code>update-secondary.ps1 -Only batteries</code>。</p>
  <p><b>新增一部法规</b>：在 <code>data/curated.js</code> 中复制一条记录，修改 <code>id</code>、<code>oeil</code>（程序编号，可在 OEIL 或 Legislative Train 上查到）、中文名称与分类，运行更新脚本后刷新页面即可。若是对已有法规的修订，填写 <code>parent</code> 指向原始法规的 id，就会自动出现在“法规谱系”中。</p>
  <p><b>阶段判定规则</b>：议会立场 = 达成协议前的第一次全会决定或第72条谈判授权；三方协议 = 理事会与议会临时协议日期（人工层）或委员会批准协议文本日期（OEIL）；正式通过 = 理事会在议会一读后通过法案；无三方谈判的紧急程序标记为“未经三方谈判”。</p>
  <p class="muted">官方来源：<a href="https://oeil.europarl.europa.eu/" target="_blank" rel="noopener">OEIL 立法观察站</a> · <a href="https://www.europarl.europa.eu/legislative-train/" target="_blank" rel="noopener">Legislative Train</a> · <a href="https://www.consilium.europa.eu/en/press/press-releases/" target="_blank" rel="noopener">理事会新闻稿</a> · <a href="https://eur-lex.europa.eu/" target="_blank" rel="noopener">EUR-Lex</a></p>
  </div></div>`;
}

parseHash(); render();
})();
</script>
