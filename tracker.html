e":"2022-02-24","title":"Commission Implementing Decision (EU) 2022/344 of 24 February 2022 amending Implementing Decision (EU) 2020/1035 to take into account certain eco-innovation CO2 savings for the calculation of the average specific CO2 emissions of Daimler AG and the Daimler AG pool (notified under document C(2022) 964) (Only the Czech, German, English, French, Irish, Italian, Hungarian, Dutch and Swedish texts are authentic) (Text with EEA relevance)","kind":"implementing","rel":"based_on","base":"32019R0631","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022D0344"},{"celex":"32022D0252","date":"2022-02-21","title":"Commission Implementing Decision (EU) 2022/252 of 21 February 2022 amending Implementing Decision (EU) 2020/1167 in order to specify the testing requirements to be applied to a 48 Volt efficient motor generator integrated in the transmission housing and combined with a 48 Volt/12 Volt DC/DC converter (Text with EEA relevance)","kind":"implementing","rel":"based_on","base":"32019R0631","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022D0252"},{"celex":"32021R1961","date":"2021-08-05","title":"Commission Delegated Regulation (EU) 2021/1961 of 5 August 2021 amending Annex I to Regulation (EU) 2019/631 of the European Parliament and of the Council in order to take into account the evolution of the mass of new passenger cars registered in 2017, 2018 and 2019 (Text with EEA relevance)","kind":"delegated","rel":"based_on","base":"32019R0631","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32021R1961"}],"initiatives":[{"id":"14750","title":"Revision of the EU rules on car labelling","summary":"EU rules on car labelling aim to ensure that information relating to the fuel consumption and CO2 emissions of new cars offered for sale or lease in the Union is made available to consumers in order to enable them to make informed choices. In light of the substantial policy and market developments since those rules were adopted and in view of the findings of the preceding evaluation, this revision will introduce changes to keep the legislation fit for purpose.","actType":"PROP_DIR","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-07-07","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-07-07","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)5251468"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2025-07-07","fbStart":"","fbEnd":"","feedback":39,"reference":"Ares(2025)5439096"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-07-07","fbStart":"","fbEnd":"","feedback":1115,"reference":"b2ac10a2-41b7-42ea-b46c-d829ee3b90be"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14750_en"},{"id":"14810","title":"Methodology to assess and report life-cycle CO2 emissions from cars and vans","summary":"The Regulation setting CO₂ emission performance standards for new passenger cars and vans requires the Commission to develop a methodology to assess and report life-cycle CO₂ emissions of cars and vans placed on the EU market. Accordingly, this act establishes the methodology for calculating, reporting, and verifying life-cycle CO₂ emissions from passenger cars and vans. As of 1 June 2026, vehicle manufacturers may voluntarily report those emissions to the Commission, using that methodology.","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/reg/2019/631/oj"],"matchedBy":"legal-basis","published":"2025-08-05","modified":"2025-07-31","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-08-05","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)6210118"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14810_en"},{"id":"12655","title":"Revision of the CO2 emission standards for cars and vans ","summary":"Road transport has a key role to play to reach the objectives of the European Green Deal. The legislation on CO2 emission performance standards for cars and vans is a key policy driver to reduce road transport emissions. Therefore, it will be revised, to ensure a clear pathway from 2025 onwards towards zero-emission mobility.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2020-10-19","modified":"2021-11-09","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-10-19","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)5472681"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-10-29","fbStart":"","fbEnd":"","feedback":129,"reference":"Ares(2020)6081912"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-11-13","fbStart":"","fbEnd":"","feedback":1055,"reference":"CO2-CARS-VANS-2020"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2021-07-15","fbStart":"","fbEnd":"","feedback":267,"reference":"COM(2021)556"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12655_en"},{"id":"14765","title":"Revision of the CO2 emission standards for cars and vans","summary":"The EU rules on CO2 emission performance standards for new cars and vans is a key policy to reduce road transport CO2 emissions and reach the Union\u0027s climate objectives. This initiative will revise the current rules, based on a fact-based analysis, taking into account all relevant technological developments, and the importance of an economically viable and socially fair transition towards zero-emission mobility.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-07-07","modified":"2026-07-03","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-05-04","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)5199896"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2025-07-07","fbStart":"","fbEnd":"","feedback":963,"reference":"Ares(2025)5438982"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-07-07","fbStart":"","fbEnd":"","feedback":1115,"reference":"b2ac10a2-41b7-42ea-b46c-d829ee3b90be"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2026-05-05","fbStart":"","fbEnd":"","feedback":0,"reference":"COM(2025)995"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14765_en"},{"id":"13439","title":"Update of the monitoring parameters and the procedure for multistage vans","summary":"In accordance with Article 7(8) of Regulation (EU) 2019/631, the Commission plans to amend Annexes II and III to that Regulation. The current amendment is aimed primarily at updating the monitoring parameters in Annex II and the procedure for determining CO2 emissions and mass for multistage  light commercial vehicles set out in Annex III","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2022-04-25","modified":"2023-06-05","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2022-04-25","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2022)3065321"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-02-13","fbStart":"","fbEnd":"","feedback":25,"reference":"Ares(2023)1037753"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2023-06-05","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)3501"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13439_en"},{"id":"12501","title":"Light Duty Vehicles (LDV) monitoring -  amendment of Annexes I, II and III","summary":"The parameters to be monitored and reported by Member States for the purpose of the CO2 emission standards for cars and vans need to be up-dated to reflect the phasing-out of the correlation procedure from 1 January 2021, the addition of some new parameters required for in-service verification purposes. It is also necessary to clarify how the specific emission targets shall be calculated in the period 2021 to 2024 for manufacturers that enter the EU market for the first time in that period.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/reg/2019/631/oj","http://data.europa.eu/eli/reg/2019/631/oj","http://data.europa.eu/eli/reg/2019/631/oj"],"matchedBy":"legal-basis","published":"2020-07-10","modified":"2020-10-16","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-07-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)3584416"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2020-08-04","fbStart":"","fbEnd":"","feedback":7,"reference":"Ares(2020)4102442"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2020-10-16","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2020)7027"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12501_en"},{"id":"1180","title":"Post 2020 light vehicle CO2 Regulation(s)","summary":null,"actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2017-11-08","modified":"2020-02-20","publications":[{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2017-11-08","fbStart":"","fbEnd":"","feedback":26,"reference":"COM(2017)676"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/1180_en"}],"fetchedAt":"2026-11-19T22:43:54Z"},"afir":{"id":"afir","acts":[{"celex":"52025DC0260","date":"2025-05-27","title":"COMMUNICATION FROM THE COMMISSION TO THE EUROPEAN PARLIAMENT AND THE COUNCIL on the technological and market readiness of heavy-duty road transport vehicles","kind":"guidance","rel":"based_on","base":"32023R1804","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025DC0260"},{"celex":"32025R0671","date":"2025-04-02","title":"Commission Delegated Regulation (EU) 2025/671 of 2 April 2025 amending Regulation (EU) 2023/1804 of the European Parliament and of the Council as regards additional data types on alternative fuels infrastructure","kind":"delegated","rel":"based_on","base":"32023R1804","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0671"},{"celex":"32025R0655","date":"2025-04-02","title":"Commission Implementing Regulation (EU) 2025/655 of 2 April 2025 laying down rules for the application of Regulation (EU) 2023/1804 of the European Parliament and of the Council as regards specifications and procedures relating to the availability and accessibility of data on alternative fuels infrastructure","kind":"implementing","rel":"based_on","base":"32023R1804","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0655"},{"celex":"32025R0656","date":"2025-04-02","title":"Commission Delegated Regulation (EU) 2025/656 of 2 April 2025 amending Regulation (EU) 2023/1804 of the European Parliament and of the Council as regards standards for wireless recharging, electric road system, vehicle-to-grid communication and hydrogen supply for road transport vehicles","kind":"delegated","rel":"based_on","base":"32023R1804","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0656"},{"celex":"32025R0645","date":"2025-04-01","title":"Commission Delegated Regulation (EU) 2025/645 of 1 April 2025 supplementing Regulation (EU) 2023/1804 of the European Parliament and of the Council as regards common technical requirements for a common application programme interface","kind":"delegated","rel":"based_on","base":"32023R1804","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0645"},{"celex":"32023R2405","date":"2023-10-18","title":"Regulation (EU) 2023/2405 of the European Parliament and of the Council of 18 October 2023 on ensuring a level playing field for sustainable air transport (ReFuelEU Aviation) (Text with EEA relevance)","kind":"amending","rel":"cites","base":"32023R1804","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2405"}],"initiatives":[{"id":"16672","title":"Review of EU rules on alternative fuels infrastructure","summary":"EU rules on alternative fuels infrastructure create a common framework for the deployment of alternative fuels infrastructure in the EU. They must be reviewed by the end of 2026. \nThis review will address among others the appropriateness of the targets for road recharging and refuelling infrastructure as well as the payment and price transparency provisions and a possible extension of the scope of the provisions regarding shore side electricity supply in maritime ports.     \n","actType":"PROP_REG","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2026-02-05","modified":"2026-08-04","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-02-05","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)1071351"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2026-03-23","fbStart":"","fbEnd":"","feedback":1076,"reference":"Ares(2026)3068207"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2026-05-11","fbStart":"","fbEnd":"","feedback":1787,"reference":"AFIR-2026"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16672_en"},{"id":"2111","title":"Evaluation of the Alternative Fuels Infrastructure Directive","summary":"Directive 2014/94/EU sets a framework of common measures for the deployment of alternative fuels infrastructure in the Union. The Commission will evaluate the functioning of that Directive. It will examine whether the Directive and its measures have been effective and appropriate to deliver on its key objectives and are still relevant in view of recent technology and market developments. ","actType":"SWD","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2019-02-20","modified":"2021-09-16","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2019-02-25","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2019)1061083"},{"type":"ROADMAP_EFC","stage":"ROADMAP","date":"2019-02-20","fbStart":"","fbEnd":"","feedback":49,"reference":"Ares(2019)1061582"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-04-06","fbStart":"","fbEnd":"","feedback":324,"reference":"2020-AFID"},{"type":"SWD","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/2111_en"},{"id":"12251","title":"Revision of Alternative Fuels Infrastructure Directive","summary":"As set out in the European Green Deal, the EU should ramp up the deployment of sustainable alternative transport fuels and its infrastructure. In view of the accelerated uptake of zero emission vehicles, the Green Deal notes that we need 1 million recharging points by 2025. This initiative will contribute to the low and zero-emission mobility by setting requirements for a sufficiently dense network of recharging and refuelling infrastructure in the EU that is easily accessible and simple to use.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2020-03-17","modified":"2021-11-19","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-03-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)1530811"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-04-06","fbStart":"","fbEnd":"","feedback":86,"reference":"Ares(2020)1948408"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-04-06","fbStart":"","fbEnd":"","feedback":324,"reference":"2020-AFID"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2021-07-16","fbStart":"","fbEnd":"","feedback":129,"reference":"COM(2021)559"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12251_en"},{"id":"14345","title":"Technical specifications related to the format, frequency and quality of data on alternative fuels infrastructure","summary":"The aim of this Commission Implementing Regulation is to lay down specifications related to the format, frequency and quality in which data on alternative fuels infrastructure is made available under Regulation (EU) 2023/1804. This Regulation introduces the technical specifications for the data types as amended and supplemented by Commission Delegated Regulation xxx/xxx adopted in parallel to this act. ","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2024-07-22","modified":"2025-04-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5145323"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-12-02","fbStart":"","fbEnd":"","feedback":28,"reference":"Ares(2024)8583189"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2025-04-12","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)1917"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14345_en"},{"id":"14346","title":"Standards for wireless recharging, electric road system and vehicle-to grid-communication of recharging infrastructure","summary":"The aim of this Commission Delegated Regulation is to pursue the adoption of European standards in support of Regulation (EU) 2023/1804 on the deployment of alternative fuels infrastructure. The lack of common standards for recharging and refuelling points constitutes a barrier for the creation of a single market of alternative fuels infrastructure. Standardisation is an essential mechanism to create economies of scale and support the uptake of new technological solutions in this sector. ","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2024-07-22","modified":"2025-04-02","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5145339"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-12-02","fbStart":"","fbEnd":"","feedback":63,"reference":"Ares(2024)8569766"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-04-02","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)1918"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14346_en"},{"id":"14347","title":"Data types for alternative fuels infrastructure","summary":"The aim of this Commission Delegated Regulation is to amend Art.20(2) of Regulation (EU) 2023/1804 to include additional data types concerning publicly accessible recharging and refueling points for alternative fuels. ","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2024-07-22","modified":"2025-04-02","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5145343"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-12-02","fbStart":"","fbEnd":"","feedback":28,"reference":"Ares(2024)8560934"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-04-02","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)1912"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14347_en"},{"id":"14362","title":"Common technical requirements for a common application interface for alternative fuels infrastructure data","summary":"The aim of this Commission Delegated Regulation is to supplement Regulation (EU) 2023/1804 to introduce common technical requirements to enable an automated and uniform data exchange between the operators of publicly accessible recharging and refuelling points and data users. Protocol solutions developed by relevant market actors, including third-party providers, should comply with the common technical requirements laid down in this Regulation for the APIs intended to fulfil the purpose of Article 20(3) of Regulation 2023/1804.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2024-07-26","modified":"2025-04-02","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5290851"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-12-02","fbStart":"","fbEnd":"","feedback":12,"reference":"Ares(2024)8569781"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-04-02","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)1913"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14362_en"},{"id":"2130","title":"European standards for alternative fuels infrastructure for L vehicles, shore-side electricity for inland navigation ves","summary":"This amendment of the Commission Delegated Regulation EU 2018/674, adopted by the Commission on 17 November 2017, supplementing Directive 2014/94/EU of the European Parliament and of the Council concerns technical updates of the implementation of certain alternative fuels standards in order to strengthen interoperability and clarity for the implementation. The updates are requested by some Member States and the European Committee for Standardisation (CEN)\n\n\n\n\n","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":["http://data.europa.eu/eli/dir/2014/94/oj","http://data.europa.eu/eli/dir/2014/94/oj","http://data.europa.eu/eli/dir/2014/94/oj","http://data.europa.eu/eli/dir/2014/94/oj"],"matchedBy":"title","published":"2019-03-15","modified":"2020-02-20","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2019-03-20","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2018)5335168"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2019-03-15","fbStart":"","fbEnd":"","feedback":10,"reference":"Ares(2019)1728567"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2019-08-13","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2019)5960"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/2130_en"},{"id":"12906","title":"Standards for recharging points for e-buses","summary":"The present Commission Delegated Regulation supplements the technical specifications for recharging points for electric buses referred to point 1.6 of Annex II to Directive 2014/94/EU. The standards have been developed and adopted by CEN/Cenelec, as established in the request addressed to the European Standardisation Organizations (Commission Implementing Decision C(2015) 1330 of 12.3.2015- M533).","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"MOVE","legalBasis":[],"matchedBy":"title","published":"2021-02-19","modified":"2021-06-17","publications":[ ","date":"2026-02-19","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)1634728"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-11-19","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)10806938"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16932_en"},{"id":"16933","title":"Rules on the adjustment of CBAM certificates to reflect the EU ETS free allocation","summary":"This initiative will align the CBAM benchmark values in the implementing act with the final ETS benchmarks for the period 2026-2030 which is essential to ensure the functioning of the CBAM in its definitive phase and to consistently reflect the rules for the allocation of free allowances under the EU ETS.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":["http://data.europa.eu/eli/reg/2023/956/oj"],"matchedBy":"legal-basis","published":"2026-02-19","modified":"2026-07-28","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-02-19","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)1634857"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16933_en"},{"id":"14123","title":"Qualifications for accreditation of verifiers and verification principles for CBAM purposes ","summary":"This initiative will identify relevant groups of activities to be verified by providing an alignment of the qualifications of an accredited verifier that are necessary to perform verifications for the purpose of CBAM with those for ETS purposes. ","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":["http://data.europa.eu/eli/reg/2023/956/oj"],"matchedBy":"legal-basis","published":"2024-01-18","modified":"2025-09-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-01-18","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)230164"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14123_en"},{"id":"15132","title":"Amendment of the Implementing Act on the CBAM Registry","summary":"This implementing act will amend several elements of the implementing act as regards to the establishment of the CBAM registry. ","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":["http://data.europa.eu/eli/reg/2023/956/oj"],"matchedBy":"legal-basis","published":"2025-10-09","modified":"2025-10-04","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-10-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)8363580"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15132_en"},{"id":"14115","title":"Rules for customs procedures for CBAM purposes ","summary":"The initiative shall establish the rules for goods brought to the continental self or the exclusive economic zone and will specify the conditions, rules and procedures for the goods (or processed products from goods resulting from the inward procedure) brought to the continental shelf or the exclusive economic zone of a Member State. \n\nThe initiative shall also laydown the rules for the specific data to be communicated on imported goods by customs authorities to the Commission. \n","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":["http://data.europa.eu/eli/reg/2023/956/oj"],"matchedBy":"legal-basis","published":"2024-01-17","modified":"2024-01-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-01-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)184631"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14115_en"},{"id":"14829","title":"Adjustment of the obligation to surrender CBAM certificates to take account of ETS free allowances phase-out","summary":"This initiative down detailed rules on how carbon border adjustment mechanism (CBAM) certificates to be surrendered by authorised CBAM declarants shall be adjusted to reflect the extent to which EU emission trading schemes (ETS) allowances are allocated free of charge. These rules should be elaborated taking into account the principles applied in the EU ETS.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":[],"matchedBy":"title","published":"2025-08-28","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-08-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)6809917"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2025-08-28","fbStart":"","fbEnd":"","feedback":126,"reference":"Ares(2025)6962930"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14829_en"},{"id":"14748","title":"Extension of the scope of the carbon border adjustment mechanism to downstream products and anti-circumvention measures","summary":"The initiative aims at extending the carbon border adjustment mechanism (CBAM) scope to some downstream products to reduce the risk of carbon leakage. The latter occurs if EU producers of downstream goods move production abroad to avoid increased carbon costs, or if EU buyers switch to imports from third countries with weaker climate policies. Additional anti-circumvention measures would target practices aiming to avoid the CBAM financial obligation, without due cause or economic justification.\n","actType":"PROP_REG","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":[],"matchedBy":"title","published":"2025-07-01","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-07-01","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)5215671"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2025-07-01","fbStart":"","fbEnd":"","feedback":352,"reference":"Ares(2025)5255022"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-07-01","fbStart":"","fbEnd":"","feedback":371,"reference":"cbam-downstream-anticircumvention-electricity-2025"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14748_en"},{"id":"14132","title":"Sale and repurchase of CBAM certificates","summary":"This Delegated Act will set out the conditions for the sale and re-purchase of carbon border adjustment mechanism (CBAM) certificates through a common central platform following a joint procurement procedure between Member States and the Commission. ","actType":"REG_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"TAXUD","legalBasis":[],"matchedBy":"title","published":"2024-01-30","modified":"2026-08-07","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-01-30","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)546926"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-07-09","fbStart":"","fbEnd":"","feedback":93,"reference":"Ares(2026)6860249"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14132_en"},{"id":"14828","title":"Carbon border adjustment mechanism (CBAM) methodology for the definitive period","summary":"This initiative will lay down the methodology for the CBAM definitive period detailing the calculation of embedded emissions based on actual emissions and setting out rules on the application of the elements of the calculation methods for indirect emissions.  ","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"TAXUD","legalBasis":[],"matchedBy":"title","published":"2025-08-28","modified":"2026-06-26","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-08-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)6809916"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2025-08-28","fbStart":"","fbEnd":"","feedback":246,"reference":"Ares(2025)6962931"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14828_en"},{"id":"14830","title":"Carbon price paid in a third country under the carbon border adjustment mechanism (CBAM)","summary":"This initiative will set out rules for the conversion into a corresponding number of CBAM (carbon border adjustment mechanism) certificates of the carbon price effectively paid in a third country for the declared embedded emissions, taking into account any form of compensation available in that country resulting in a reduction of the price. \n","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"TAXUD","legalBasis":[],"matchedBy":"title","published":"2025-08-28","modified":"2026-06-11","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-08-28","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)6809938"},{"type":"CALL_FOR_EVIDENCE","stage":"PLANNING_WORKFLOW","date":"2025-08-28","fbStart":"","fbEnd":"","feedback":145,"reference":"Ares(2025)6962941"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-05-13","fbStart":"","fbEnd":"","feedback":177,"reference":"Ares(2026)4841230"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14830_en"},{"id":"12228","title":"Carbon Border Adjustment Mechanism","summary":"The European Green Deal includes the firm ambition of making Europe climate-neutral by 2050. As long as many international partners do not share the same climate ambition, there is a risk of carbon leakage. Should these differences persist worldwide, a Carbon Border Adjustment Mechanism that effectively places a carbon price on imported products for selected sectors, can contribute to managing the risks of carbon leakage, reducing global emissions while keeping the carbon price signal.","actType":"PROP_REG","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"TAXUD","legalBasis":[],"matchedBy":"title","published":"2020-03-04","modified":"2021-11-19","publications":[{"type":"INIT_P stry and agriculture sector, and (EU) 2018/1999 as regards improvement in monitoring, reporting, tracking of progress and review","kind":"proposal","rel":"cites","base":"32003L0087","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0554"},{"celex":"52021PC0571","date":"2021-07-14","title":"Proposal for a DECISION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL amending Decision (EU) 2015/1814 as regards the amount of allowances to be placed in the market stability reserve for the Union greenhouse gas emission trading scheme until 2030","kind":"proposal","rel":"cites","base":"32003L0087","url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52021PC0571"}],"initiatives":[{"id":"16240","title":"States considered to be applying CORSIA in 2026 for ETS purposes ","summary":"EU rules on an emissions trading system (the ETS Directive) implement appropriately the carbon offsetting scheme (‘CORSIA’) set up by the International Civil Aviation Organization for airlines based in the EU and EEA countries.\nThe Commission must adopt acts every year listing countries other than EU/EEA countries, Switzerland and the United Kingdom, that are considered to be applying CORSIA.\nThis list for 2026 will be used to calculate the CORSIA offsetting required from airlines under the Directive.\n","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"OPEN","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2026-01-06","modified":"2026-10-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-01-06","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)11438579"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-10-30","fbStart":"","fbEnd":"","feedback":1,"reference":"Ares(2026)10224553"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16240_en"},{"id":"19792","title":"EU emissions trading system (ETS2) - verification simplification for regulated entities with low emissions ","summary":"Under the ETS Directive, Annual Emission Reports are verified. This delegated act simplifies verification requirements for regulated entities with low emissions under ETS2 via an amendment of Annex V (Criteria for verification) of the Directive. This will allow Member States to consider emissions of these regulated entities to be verified when appropriately checked by the Competent Authority, lowering the administrative costs for small regulated entities. ","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj"],"matchedBy":"legal-basis","published":"2026-11-17","modified":"2026-11-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-11-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)10534919"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19792_en"},{"id":"14577","title":"Approvals of unilateral extensions of ETS2 scope and corresponding additional allowances","summary":"The revised ETS Directive (Directive 2003/87/EC) introduces a new emission trading system for emissions from fuels combusted in buildings, road transport and other sectors. It also allows Member States to extend the scope of this new system to additional sectors on their territory, subject to approval by the Commission. These delegated Commission decisions assess the requests for extension introduced by certain Member States and authorize the issue of additional allowances.","actType":"DEC_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj"],"matchedBy":"legal-basis","published":"2025-03-17","modified":"2025-03-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-03-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)1938334"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14577_en"},{"id":"17033","title":"Reporting of ETS2 cost pass-through ","summary":"This Implementing Act is adopted pursuant to the Commission’s legal obligation under Article 30f(3) of Directive 2003/87/EC. It sets rules for the reporting by regulated entities of the share of ETS2 costs related to the surrender of allowances which have been passed on to final consumers of fuels for the preceding year.","actType":"REG_IMPL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj"],"matchedBy":"legal-basis","published":"2026-02-27","modified":"2026-02-24","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-02-27","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)2014161"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17033_en"},{"id":"14746","title":"Approval of unilateral inclusion of additional activities and gases and corresponding additional allowances","summary":"The ETS Directive (Directive 2003/87/EC) covers emissions from energy-intensive industry sectors, aviation and, since 2024, maritime. It also allows Member States to include additional activities and gases, subject to approval by the Commission. This delegated Commission decision assesses the requests for unilateral inclusion of additional activities and gases by the Netherlands and authorises the issue of additional allowances.","actType":"DEC_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj"],"matchedBy":"legal-basis","published":"2025-07-03","modified":"2025-06-28","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-07-03","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)5146968"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14746_en"},{"id":"14504","title":"Amendment to the Registry Regulation to introduce fees to finance the Union Registry","summary":"\nThis initiative updates the Registry Regulation to introduce provisions to finance the Union Registry. \n\nIn order to ensure a proper financing of the Union Registry in line with the increased number of users and the increased coverage of the EU ETS,  the Commission should be allowed to charge a fee. \n","actType":"REG_DEL","stage":"PLANNING_WORKFLOW","status":"ACTIVE","feedbackStatus":"UPCOMING","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj"],"matchedBy":"legal-basis","published":"2025-02-10","modified":"2025-09-25","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-02-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)396542"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14504_en"},{"id":"14549","title":"EU emissions trading system for maritime, aviation and stationary installations, and market stability reserve - review","summary":"The EU emissions trading system is a key policy tool to achieve the EU’s climate targets. Certain elements of the system are subject to review by 2026, including on assessing additional policies to reach those targets. In addition, the market stability reserve is also subject to review by 2026. Both are being evaluated to feed into these reviews. ","actType":"PROP_DIR","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-03-05","modified":"2026-11-04","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-03-05","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)1583154"},{"type":"CFE_IMPACT_ASSESS","stage":"PLANNING_WORKFLOW","date":"2025-04-14","fbStart":"","fbEnd":"","feedback":377,"reference":"Ares(2025)3030455"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2025-04-15","fbStart":"","fbEnd":"","feedback":535,"reference":"ETS1Review"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2026-08-20","fbStart":"","fbEnd":"","feedback":110,"reference":"COM(2026)620"},{"type":"PROP_REG","stage":"ADOPTION_WORKFLOW","date":"2026-08-20","fbStart":"","fbEnd":"","feedback":40,"reference":"COM(2026)619"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"2026-08-25","fbStart":"","fbEnd":"","feedback":126,"reference":"COM(2026)616"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14549_en"},{"id":"12494","title":"Revision of the EU Emission Trading System Directive concerning aviation ","summary":"This legislative initiative aims at amending the EU Emissions Trading System regarding aviation. Specifically, it will serve to implement the Carbon Offsetting and Reduction Scheme for International Aviation by the EU in a way that is consistent with the EU’s 2030 climate objectives. The initiative will also propose to increase the number of allowances being auctioned under the System as far as aircraft operators are concerned. This proposal will be one part of the broader European Green Deal.","actType":"PROP_DIR","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2020-07-03","modified":"2021-11-09","publications":[{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-07-03","fbStart":"","fbEnd":"","feedback":53,"reference":"Ares(2020)3515933"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-10-01","fbStart":"","fbEnd":"","feedback":91,"reference":"EU-ETS-Aviation-2020"},{"type":"PROP_DEC","stage":"ADOPTION_WORKFLOW","date":"2021-07-15","fbStart":"","fbEnd":"","feedback":11,"reference":"COM(2021)567"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"2021-07-15","fbStart":"","fbEnd":"","feedback":8,"reference":"COM(2021)552"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12494_en"},{"id":"12660","title":"Updating the EU Emissions Trading System","summary":"To prepare transition to economy-wide climate neutrality by 2050, the Commission proposed to scale up greenhouse gas emission reductions for 2030 to at least 55% compared with 1990 levels. To deliver on this ambition, all relevant policies will be reviewed. This includes the EU Emissions Trading System, including an extension to new sectors in next year\u0027s legal proposal. It will also cover the review of the Market Stability Reserve foreseen within 3 years of it starting.","actType":"PROP_DIR","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2020-10-19","modified":"2021-11-09","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-10-19","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)5488235"},{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2020-10-29","fbStart":"","fbEnd":"","feedback":262,"reference":"Ares(2020)6081850"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2020-11-13","fbStart":"","fbEnd":"","feedback":481,"reference":"UPDATING-EUETS-2020"},{"type":"PROP_DIR","stage":"ADOPTION_WORKFLOW","date":"2021-07-15","fbStart":"","fbEnd":"","feedback":236,"reference":"COM(2021)551"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12660_en"},{"id":"14727","title":"EU Emissions Trading System - update of neighbouring container transhipment ports","summary":"Update of the act identifying the neighbouring container transhipment ports under the Emissions Trading System to reduce the risk of evasion, pursuant to the conditions in Article 3ga(2) of Directive 2003/87/EC: the share of transhipment of containers of these ports and they distance to a port under the jurisdiction of a Member State. This is linked with an update of the act identifying the neighbouring container transhipments ports under FuelEU.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/reg/2003/87/oj"],"matchedBy":"title","published":"2025-06-16","modified":"2026-10-02","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-06-16","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)4617616"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-07-17","fbStart":"","fbEnd":"","feedback":16,"reference":"Ares(2026)7140141"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14727_en"},{"id":"14216","title":"EU emissions trading system  - update of Activity Level Changes Regulation ","summary":"In the framework of the \u0027Fit for 55\u0027 package, the EU ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. \nFollowing this revision, the European Commission needs to update several regulatory acts for the implementation of the EU ETS. This initiative updates the rules for adjustments to free allocation of emission allowances due to activity level changes\n","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-04-04","modified":"2025-01-10","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-04-04","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)2279772"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-12-12","fbStart":"","fbEnd":"","feedback":31,"reference":"Ares(2024)8915071"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14216_en"},{"id":"19225","title":"Approval of unilateral extension of ETS1 scope by Sweden","summary":"This draft Commission Delegated Decision will constitute the approval by the Commission of an application by Sweden for a unilateral extension of scope of the EU ETS pursuant to Article 24 of Directive 2003/87/EC to greenhouse gases emissions from pulp, paper and board installations that are otherwise excluded from the EU ETS pursuant to Annex I, point (1) to Directive 2003/87/EC for exceeding the 95 % biomass threshold.","actType":"DEC_DEL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2026-09-10","modified":"2026-11-17","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-09-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)8456971"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-10-19","fbStart":"","fbEnd":"","feedback":10,"reference":"Ares(2026)9817014"},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/19225_en"},{"id":"13127","title":"Strengthing the Market Stability Reserve linked to the review of the EU Emissions Trading System","summary":null,"actType":"PROP_DEC","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/tfeu_2010/oj","http://data.europa.eu/eli/tfeu_2010/oj"],"matchedBy":"title","published":"2021-07-15","modified":"2021-11-09","publications":[{"type":"PROP_DEC","stage":"ADOPTION_WORKFLOW","date":"2021-07-15","fbStart":"","fbEnd":"","feedback":22,"reference":"COM(2021)571"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13127_en"},{"id":"15772","title":"Revision of the soda ash benchmark value for free allocation of emission allowances for 2025","summary":"In the context of the \u0027Fit for 55\u0027 package, the ETS Directive has been revised with the EU target to reduce net greenhouse gas emissions by 55% by 2030, compared to 1990 levels. \nFollowing this revision, the European Commission needs to update several regulatory acts for the implementation of the ETS. This initiative updates the 2025 soda ash benchmark value for alignment with the revised rules for the monitoring and reporting of emissions in the EU-ETS (Implementing Regulation (EU) 2024/2493).\n","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-11-20","modified":"2026-01-16","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-11-20","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)9852913"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-12-18","fbStart":"","fbEnd":"","feedback":6,"reference":"Ares(2025)11341997"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15772_en"},{"id":"14507","title":"States considered to be applying  CORSIA in 2025 for ETS purposes","summary":"Directive 2003/87/EC implements ICAO’s carbon offset scheme (‘CORSIA’) in respect of airlines based in the EU and EEA countries. Article 25a(3) of this Directive requires the Commission to adopt annual implementing acts listing states other than EEA countries, Switzerland and the United Kingdom which are considered to be applying CORSIA. This list is the basis to calculate the CORSIA offsetting that airlines should do under Article 12(6) of the ETS Directive. This list is for 2025 emissions.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-02-10","modified":"2025-06-20","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-02-10","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)396564"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-05-22","fbStart":"","fbEnd":"","feedback":2,"reference":"Ares(2025)4145262"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14507_en"},{"id":"13863","title":"Amendment of the EU ETS Monitoring and Reporting Regulation (MRR) in response to the ETS revision/Fit For 55 ","summary":"In the framework of the \u0027Fit for 55\u0027 package, the EU ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. Following the revision of the EU ETS Directive, the European Commission needs to update several regulatory acts for the implementation of the EU ETS. One of these acts will update the rules for Monitoring and Reporting of emissions.","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-06-09","modified":"2023-08-24","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3884568"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-07-26","fbStart":"","fbEnd":"","feedback":73,"reference":"Ares(2023)5183559"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13863_en"},{"id":"17032","title":"ETS2 Financial compensation ","summary":"This Implementing Act is adopted pursuant to the Commission’s legal obligation under Article 30f(5) and Article 30c(3) of Directive 2003/87/EC. It sets detailed rules for providing financial compensation to final consumers of fuels which face ETS2 carbon costs in cases where double counting or unintended coverage could not be avoided. ","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2026-02-27","modified":"2026-08-15","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2026-02-27","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2026)2013036"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-07-17","fbStart":"","fbEnd":"","feedback":25,"reference":"Ares(2026)7140351"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17032_en"},{"id":"15873","title":"Revision of the benchmark values for free allocation of emission allowances (2026-2030)","summary":"In the context of the \u0027Fit for 55\u0027 package of EU legislation, the ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. \nFollowing this revision, the European Commission needs to update several regulatory acts for the implementation of the ETS. This initiative updates the benchmarks values for free allocation of emission allowances.\n","actType":"REG_IMPL","stage":"ISC_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-12-02","modified":"2026-06-09","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-12-02","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)10342057"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2026-05-11","fbStart":"","fbEnd":"","feedback":442,"reference":"Ares(2026)4752349"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"","fbStart":"","fbEnd":"","feedback":0,"reference":null}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15873_en"},{"id":"14160","title":"Approvals of unilateral extensions of ETS2 scope and corresponding additional allowances","summary":"The revised ETS Directive (Directive 2003/87/EC) introduces a new emission trading system for emissions from fuels combusted in buildings, road transport and other sectors. It also allows Member States to extend the scope of this new system to additional sectors on their territory, subject to approval by the Commission. These delegated Commission decisions assess the requests for extension introduced by certain Member States and authorize the issue of additional allowances.","actType":"DEC_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-02-22","modified":"2025-04-15","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-02-22","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)1183880"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-07-19","fbStart":"","fbEnd":"","feedback":10,"reference":"Ares(2024)5250082"},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"2024-09-24","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)6559"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-02-17","fbStart":"","fbEnd":"","feedback":5,"reference":"Ares(2025)1255113"},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"2025-04-15","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)2232"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14160_en"},{"id":"14342","title":"Approvals of unilateral extensions of ETS2 scope and corresponding additional allowances","summary":"The revised ETS Directive (Directive 2003/87/EC) introduces a new emission trading system for emissions from fuels combusted in buildings, road transport and other sectors. It also allows Member States to extend the scope of this new system to additional sectors on their territory, subject to approval by the Commission. These delegated Commission decisions assess the requests for extension introduced by certain Member States and authorize the issue of additional allowances.","actType":"DEC_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-07-17","modified":"2024-11-27","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-17","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5033379"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-09-27","fbStart":"","fbEnd":"","feedback":3,"reference":"Ares(2024)6850002"},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"2024-11-27","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)8160"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14342_en"},{"id":"12104","title":"Revision of the EU Emission Trading System Monitoring and Reporting Regulation (MRR)","summary":"The monitoring, reporting and verification of greenhouse gas emissions must be robust, transparent, consistent and accurate for the EU Emissions Trading System (EU ETS) to operate effectively. This initiative aims to update the existing monitoring and reporting rules before the beginning of phase 4 of the EU ETS (2021), in order to make them more efficient and actual. ","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2020-01-13","modified":"2021-03-18","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-01-13","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2019)6841440"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2020-05-29","fbStart":"","fbEnd":"","feedback":62,"reference":"Ares(2020)2800422"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2021-03-18","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2020)8769"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12104_en"},{"id":"15472","title":"EU emissions trading system (ETS2) – early auctioning of allowances","summary":"As part of the ’Fit for 55’ package, the ETS Directive has been revised and a new and separate emissions trading system was established for buildings, road transport and additional sectors (ETS2). \nThis initiative updates the Auctioning Regulation with regard to timing, administration and specific rules for the auctioning of ETS2 allowances.  \n","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2025-10-31","modified":"2026-04-08","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2025-10-31","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2025)9156480"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-12-08","fbStart":"","fbEnd":"","feedback":33,"reference":"Ares(2025)10817207"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2026-04-08","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2026)2119"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15472_en"},{"id":"12105","title":"Revision of the EU Emission Trading System Accreditation and Verification Regulation (AVR)","summary":"The monitoring, reporting and verification of greenhouse gas emissions must be robust, transparent, consistent and accurate for the EU Emissions Trading System (EU ETS) to operate effectively. This initiative aims to update the existing rules before the beginning of phase 4 of the EU ETS (2021), in order to ensure a proper verification of the emissions and other data reported by operators, and accreditation of the verifiers.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2020-01-13","modified":"2021-03-18","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2020-01-13","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2020)36820"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2020-05-29","fbStart":"","fbEnd":"","feedback":6,"reference":"Ares(2020)2800510"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2021-03-18","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2020)8768"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12105_en"},{"id":"14293","title":"Approvals of unilateral extensions of ETS2 scope and corresponding additional allowances","summary":"The revised ETS Directive (Directive 2003/87/EC) introduces a new emission trading system for emissions from fuels combusted in buildings, road transport and other sectors. It also allows Member States to extend the scope of this new system to additional sectors on their territory, subject to approval by the Commission. These delegated Commission decisions assess the requests for extension introduced by certain Member States and authorize the issue of additional allowances.","actType":"DEC_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-06-12","modified":"2024-09-24","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-06-12","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)4086828"},{"type":"DEC_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-07-19","fbStart":"","fbEnd":"","feedback":4,"reference":"Ares(2024)5249568"},{"type":"DEC_DEL","stage":"ADOPTION_WORKFLOW","date":"2024-09-24","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)6555"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14293_en"},{"id":"13868","title":"Rules for the administration of shipping companies by administering authorities under the EU Emissions Trading System","summary":"This Implementing Regulation establishes the detailed rules relating to the administration of shipping companies by administering authorities under the EU ETS Directive (Directive 2003/87/EC), including in relation to the attribution of companies to administering authorities.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-06-09","modified":"2023-11-22","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3884723"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-08-31","fbStart":"","fbEnd":"","feedback":31,"reference":"Ares(2023)5929413"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2023-11-22","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)7831"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13868_en"},{"id":"13923","title":"EU emissions trading system - update of the Verification and Accreditation Regulation","summary":"As part of the \u0027Fit for 55\u0027 package, the ETS Directive has been revised to align it with the new EU target set in the European Climate Law to reduce net greenhouse gas emissions by at least 55% (compared to 1990 levels) by 2030. Following the revision of the EU ETS Directive, the European Commission needs to update several regulatory acts for the implementation of the ETS. This initiative updates the rules for accreditation of verifiers engaging in verification of reports.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-07-20","modified":"2024-05-08","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-07-20","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)4926012"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-03-18","fbStart":"","fbEnd":"","feedback":8,"reference":"Ares(2024)2054229"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2024-05-08","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)3239"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13923_en"},{"id":"2041","title":"Revision of the ETS State aid Guidelines","summary":"Member States can compensate some electro-intensive users, for part of the higher electricity costs resulting from the EU Emissions Trading Scheme. \nThe objective of such compensation is to minimise carbon leakage risk, which materialises when emission costs cause relocation from the EU to third countries without comparable constraints.\nThe existing rules allowing for compensation will be revised to ensure that they are adapted to the new Emissions Trading Scheme for the period 2021-2030.","actType":"COMMUNIC","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"COMP","legalBasis":[],"matchedBy":"title","published":"2018-12-20","modified":"2021-12-01","publications":[{"type":"IMPACT_ASSESS_INCEP","stage":"ROADMAP","date":"2018-12-20","fbStart":"","fbEnd":"","feedback":46,"reference":"Ares(2018)6600267"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2019-02-21","fbStart":"","fbEnd":"","feedback":124,"reference":"ETS_Guideline_revision_2020_BRP"},{"type":"COMMUNIC","stage":"ADOPTION_WORKFLOW","date":"2021-03-23","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2020)6400"},{"type":"COMMUNIC","stage":"ADOPTION_WORKFLOW","date":"2021-12-01","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2021)8413"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/2041_en"},{"id":"14279","title":"EU Emissions Trading System  - update of Verification and Accreditation Regulation (AVR), Batch 2 ","summary":"As part of the \u0027Fit for 55\u0027 package, the EU ETS Directive has been revised to align it with the EU 2030 target to reduce net greenhouse gas emissions by 55% (compared to 1990 levels) by 2030. The European Commission needs to update several regulatory acts for the implementation of the revised EU ETS. The AVR revision complements the MRR revision by addressing the verification aspect. The AVR ensures that verifiers are qualified and accredited which enhances reliability of the emission data.  ","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-05-24","modified":"2025-06-19","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-05-24","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)3582378"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2025-03-25","fbStart":"","fbEnd":"","feedback":8,"reference":"Ares(2025)2412008"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2025-06-19","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2025)3849"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14279_en"},{"id":"13867","title":"List of neighbouring container transhipment ports for the purposes of the EU Emissions Trading System (ETS) Directive","summary":"This Implementing Regulation establishes the list of neighbouring container transhipment ports where the share of transhipment of containers exceeds 65% of the total container traffic of that port, and located outside the Union but less than 300 nautical miles of a port under the jurisdiction of a Member State, as per Article [3g(2)] of Directive 2003/87/EC.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-06-09","modified":"2023-10-31","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-06-09","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)3884711"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-08-21","fbStart":"","fbEnd":"","feedback":36,"reference":"Ares(2023)5694831"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2023-10-31","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2023)7122"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/13867_en"},{"id":"11873","title":"EU emissions trading system – adjusting the auction process for the period 2021-2030","summary":"This Regulation amends the Auctioning Regulation in three main aspects:\n•\tAligning the Auctioning Regulation with the architecture of phase 4 of EU ETS (2021-2030) as set out in the revised ETS Directive;\n•\tAligning the Auctioning Regulation with the financial market legislation and market oversight regime and taking into account the classification of emission allowances as financial instruments;\n•\tIncorporating lessons learned from auctioning in phase 3 of EU ETS (2013-2020).","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":["http://data.europa.eu/eli/dir/2003/87/oj","http://data.europa.eu/eli/dir/2003/87/oj","http://data.europa.eu/eli/dir/2003/87/oj"],"matchedBy":"legal-basis","published":"2019-07-09","modified":"2020-02-20","publications":[{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2019-07-09","fbStart":"","fbEnd":"","feedback":5,"reference":"Ares(2019)4358461"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2019-08-28","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2019)6182"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/11873_en"},{"id":"1649","title":"Revising the rules for free allocation in the EU Emissions Trading System","summary":"It is necessary to elaborate implementing legislation in time for the start of phase 4 of the EU ETS (2021-2030).\nThe Benchmarking Decision will have to be revised in order to:\n- set the rules for determining free allocation to industrial installations covered by the EU ETS;\n- update the benchmark values which represent an essential parameter in determining free allocations;\n- determine rules for future adjustments to free allocation.\n","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2018-03-20","modified":"2020-02-20","publications":[{"type":"ROADMAP","stage":"ROADMAP","date":"2018-03-20","fbStart":"","fbEnd":"","feedback":28,"reference":"Ares(2018)1523713"},{"type":"OPC_LAUNCHED","stage":"OPC_LAUNCHED","date":"2018-11-30","fbStart":"","fbEnd":"","feedback":104,"reference":"ETS4ALCPublicQuestionnaire"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2019-06-11","fbStart":"","fbEnd":"","feedback":48,"reference":"Ares(2019)3735250"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2019-11-13","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2019)7864"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/1649_en"},{"id":"14363","title":"States considered to be applying  CORSIA in 2024 for ETS purposes","summary":"Directive 2003/87/EC implements ICAO’s carbon offset scheme (‘CORSIA’) in respect of airlines based in the EU and EEA countries. Article 25a(3) of this Directive requires the Commission to adopt annual implementing acts listing states other than EEA countries, Switzerland and the United Kingdom which are considered to be applying CORSIA. This list is the basis to calculate the CORSIA offsetting that airlines should do under Article 12(6) of the ETS Directive. This list is for 2024 emissions.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-07-26","modified":"2024-11-12","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-07-26","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)5299752"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-08-27","fbStart":"","fbEnd":"","feedback":9,"reference":"Ares(2024)6074042"},{"type":"REG_IMPL","stage":"ADOPTION_WORKFLOW","date":"2024-11-12","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)7783"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14363_en"},{"id":"14135","title":"Permanent storage of EU ETS emissions through carbon capture and utilisation","summary":"The EU ETS Directive has been revised with the EU target set out in the European Climate Law to reduce net greenhouse gas (GHG) emissions by 55% by 2030, compared to 1990 levels. This Delegated Act, adopted pursuant to Article 12(3b) of the EU ETS Directive, will establish the conditions under which ETS emissions can be considered necessary to consider that these greenhouse gases have become permanently chemically bound in a product so that they do not enter the atmosphere under normal use and under any normal end-of-life activity.","actType":"REG_DEL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2024-02-01","modified":"2024-07-30","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2024-02-01","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2024)602833"},{"type":"REG_DEL_DRAFT","stage":"ISC_WORKFLOW","date":"2024-06-18","fbStart":"","fbEnd":"","feedback":93,"reference":"Ares(2024)4402362"},{"type":"REG_DEL","stage":"ADOPTION_WORKFLOW","date":"2024-07-30","fbStart":"","fbEnd":"","feedback":0,"reference":"C(2024)5294"}],"url":"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14135_en"},{"id":"14033","title":"Countries considered to apply CORSIA in 2023 for ETS purposes","summary":"Directive 2003/87/EC implements the ICAO’s carbon offset scheme (‘CORSIA’) in respect of airlines based in the EU and EEA countries. Article 25a(3) of the ETS Directive requires the Commission to adopt annual implementing acts listing states other than EEA countries, Switzerland and the United Kingdom which are considered to be applying CORSIA. This list is the basis to calculate the CORSIA offsetting that airlines should do under Article 12(6) of the ETS Directive.","actType":"REG_IMPL","stage":"ADOPTION_WORKFLOW","status":"ACTIVE","feedbackStatus":"CLOSED","dg":"CLIMA","legalBasis":[],"matchedBy":"title","published":"2023-11-24","modified":"2024-02-22","publications":[{"type":"INIT_PLANNED","stage":"INIT_PLANNED","date":"2023-11-24","fbStart":"","fbEnd":"","feedback":0,"reference":"Ares(2023)7887109"},{"type":"REG_IMPL_DRAFT","stage":"ISC_WORKFLOW","date":"2023-12-18","fbStart":"","fbEnd":"","feedback":6,"reference":"Ares(2023)8617128"},{"type":"REG_IMPL","sta
