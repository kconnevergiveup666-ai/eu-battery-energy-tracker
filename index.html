<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>欧盟电池与能源立法追踪</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --line:#e2e5ea; --text:#1b1f24; --muted:#5f6b7a; --faint:#8a95a3;
  --accent:#1f5fd6; --accent-weak:#e6eefc;
  --c-commission:#1f5fd6; --c-epc:#7a3fd1; --c-epp:#c2398a; --c-council:#d9822b; --c-trilogue:#b8860b; --c-final:#18864b; --c-impl:#0e8f8f; --c-future:#8a95a3;
  --battery:#0e8f8f; --industry:#7a3fd1; --power:#d9822b; --renewable:#18864b; --transport:#1f5fd6; --carbon:#6b7280; --digital:#c0396b; --circular:#6d8a1f; --supply:#a0522d; --safety:#0f7c9c;
  --done:#18864b; --current:#d9822b; --pending:#c9ced6;
  --c-sec:#5b6ee1; --c-other:#8a6d3b; --c-stake:#b4338a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
:root{--open:#c0392b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --c-sec:#8fa0ff; --c-other:#c9a46a; --c-stake:#ec7cc8; --open:#ff7a6b } }
:root[data-theme="dark"]{ --c-sec:#8fa0ff; --c-other:#c9a46a; --c-stake:#ec7cc8; --open:#ff7a6b }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b; --text:#e6e9ed; --muted:#a1abb8; --faint:#7d8896;
    --accent:#6ea0ff; --accent-weak:#1b2a44;
    --c-commission:#6ea0ff; --c-epc:#a98bf0; --c-epp:#e879b8; --c-council:#f0a456; --c-trilogue:#e0b84a; --c-final:#4cc08a; --c-impl:#3cc6c6; --c-future:#7d8896;
    --battery:#3cc6c6; --industry:#a98bf0; --power:#f0a456; --renewable:#4cc08a; --transport:#6ea0ff; --carbon:#9aa3af; --digital:#f07aa6; --circular:#a9c95a; --supply:#e0a07a; --safety:#5cc3e0;
    --done:#4cc08a; --current:#f0a456; --pending:#3a424d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b; --text:#e6e9ed; --muted:#a1abb8; --faint:#7d8896;
  --accent:#6ea0ff; --accent-weak:#1b2a44;
  --c-commission:#6ea0ff; --c-epc:#a98bf0; --c-epp:#e879b8; --c-council:#f0a456; --c-trilogue:#e0b84a; --c-final:#4cc08a; --c-impl:#3cc6c6; --c-future:#7d8896;
  --battery:#3cc6c6; --industry:#a98bf0; --power:#f0a456; --renewable:#4cc08a; --transport:#6ea0ff; --carbon:#9aa3af; --digital:#f07aa6; --circular:#a9c95a; --supply:#e0a07a; --safety:#5cc3e0;
  --done:#4cc08a; --current:#f0a456; --pending:#3a424d; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hwrap{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:8px}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;cursor:pointer}

main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card .bd{padding:14px 16px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.feed li:last-child{border-bottom:0}
.feed .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.feed .t{font-size:13.5px}
.feed .s{font-size:12px;color:var(--muted)}
.lane-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* gantt */
.gantt-wrap{overflow-x:auto}
.gantt{min-width:880px}
.grow{display:grid;grid-template-columns:200px 1fr;align-items:center;min-height:30px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.gname{font-size:12.5px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gname:hover{color:var(--accent)}
.gtrack{position:relative;height:30px}
.gaxis{position:relative;height:22px;font-size:11px;color:var(--faint)}
.gaxis span{position:absolute;transform:translateX(-50%);top:3px}
.gyear{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--c-epp);opacity:.6}
.seg{position:absolute;top:9px;height:12px;border-radius:3px}
.seg.ep{background:var(--c-epc)} .seg.tri{background:var(--c-trilogue)} .seg.fin{background:var(--c-final)}
.seg.open{background:repeating-linear-gradient(45deg,var(--c-epc) 0 4px,transparent 4px 8px);opacity:.75;border:1px solid var(--c-epc)}
.mk{position:absolute;top:7px;width:10px;height:16px;transform:translateX(-50%)}
.mk.prop{border-left:2px solid var(--c-commission);width:2px;top:4px;height:22px}
.mk.cou{width:10px;height:10px;top:10px;background:var(--c-council);transform:translateX(-50%) rotate(45deg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* dossiers */
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.filters{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.list{overflow:auto;padding:6px}
.item{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel2)}
.item.on{background:var(--accent-weak);border-color:var(--accent)}
.item .n{font-weight:600;font-size:13.5px}
.item .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.item.child{margin-left:16px;border-left:2px solid var(--line);border-radius:0 8px 8px 0}
.cat{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,transparent)}
.pill.live{color:var(--current);border-color:color-mix(in srgb,var(--current) 50%,transparent)}
.pill.core{color:var(--c-epp);border-color:color-mix(in srgb,var(--c-epp) 40%,transparent)}

.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.dhead{padding:18px 20px}
.dhead h1{font-size:20px;margin:6px 0 4px}
.dhead .en{color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;background:var(--panel2);border-radius:6px;padding:2px 8px;color:var(--muted)}

/* stage pipeline */
.pipe{display:grid;grid-template-columns:repeat(8,1fr);gap:0;padding:18px 14px 14px;overflow-x:auto}
.stg{position:relative;text-align:center;padding:0 4px;min-width:96px}
.stg:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--pending);z-index:0}
.stg:first-child:before{display:none}
.stg.done:before,.stg.cur:before{background:var(--done)}
.stg .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel);border:3px solid var(--pending);color:var(--faint)}
.stg.done .dot{background:var(--done);border-color:var(--done);color:#fff}
.stg.cur .dot{border-color:var(--current);color:var(--current);box-shadow:0 0 0 4px color-mix(in srgb,var(--current) 20%,transparent)}
.stg.skip .dot{border-style:dashed}
.stg .nm{font-size:12.5px;font-weight:600}
.stg .who{font-size:11px;color:var(--faint)}
.stg .dt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>*,.grid2>*{min-width:0}
.sum p{margin:0 0 10px}
.sum ul{margin:0;padding-left:18px} .sum li{margin:4px 0}

/* actors */
.actors .bd{overflow-x:auto;-webkit-overflow-scrolling:touch}
.actors table{width:100%;border-collapse:collapse;font-size:13px}
.actors th,.actors td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.actors th{font-size:11.5px;color:var(--faint);font-weight:600}
.cbadge{display:inline-block;font-weight:700;font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--panel2);margin-right:6px;font-family:ui-monospace,Consolas,monospace}
.grp{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:4px;color:#fff;vertical-align:1px}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.shadows{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sub{font-size:12px;color:var(--muted)}

/* timeline */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{position:relative;display:grid;grid-template-columns:96px 22px 1fr;gap:0 10px;padding:6px 0}
.tl .d{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding-top:1px}
.tl .rail{position:relative}
.tl .rail:before{content:"";position:absolute;left:10px;top:-6px;bottom:-6px;width:2px;background:var(--line)}
.tl li:first-child .rail:before{top:10px} .tl li:last-child .rail:before{bottom:calc(100% - 10px)}
.tl .rail i{position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.tl .ev{font-size:13.5px}
.tl .ev .orig{font-size:11.5px;color:var(--faint)}
.tl .ev .lane{font-size:11px;font-weight:600;margin-right:6px}
.tl li.future .ev{opacity:.75} .tl li.future .rail i{background:transparent!important;border:2px dashed var(--c-future)}
.tl li.yr{grid-template-columns:96px 22px 1fr;padding:12px 0 4px}
.tl li.yr .d{font-weight:700;color:var(--text);font-size:13px}
.unv{font-size:10.5px;color:var(--current);border:1px solid var(--current);border-radius:4px;padding:0 4px;margin-left:6px}
.toolbar{display:flex;gap:10px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}
.toolbar label{cursor:pointer;display:flex;gap:4px;align-items:center}
.lanes{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line)}

.family{display:flex;flex-direction:column;gap:6px}
.fam-node{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:13px}
.fam-node .ln{color:var(--faint)}
.fam-node.me{font-weight:700}
.relrow{font-size:12.5px;padding:3px 0}

.empty{padding:40px;text-align:center;color:var(--muted)}
.pill.st-support{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.pill.st-oppose{color:var(--open);border-color:color-mix(in srgb,var(--open) 45%,transparent)}
.pill.st-amend{color:var(--current);border-color:color-mix(in srgb,var(--current) 50%,transparent)}
.pill.typ{color:var(--c-stake);border-color:color-mix(in srgb,var(--c-stake) 40%,transparent)}
.stk-actor{border-top:1px solid var(--line);padding:12px 0}
.stk-actor:first-child{border-top:0}
.stk-actor .nm{font-weight:600}
.stk-actor .pos{margin:6px 0 0;padding-left:18px}
.stk-actor .pos li{margin:3px 0}
.stk-eff{font-size:12.5px;color:var(--muted);margin-top:3px}
.bi3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.bi3>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bi3 h4{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.bi3 h4 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bi3 ul,.bi-act{margin:0;padding-left:18px}
.bi3 li,.bi-act li{margin:4px 0;font-size:13.5px}
.pill.lv-high{color:var(--open);border-color:color-mix(in srgb,var(--open) 45%,transparent);font-weight:600}
.pill.lv-medium{color:var(--current);border-color:color-mix(in srgb,var(--current) 50%,transparent);font-weight:600}
.pill.lv-low{color:var(--muted)}
@media (max-width:820px){ .bi3{grid-template-columns:1fr} }
.pill.sec{color:var(--c-sec);border-color:color-mix(in srgb,var(--c-sec) 45%,transparent)}
.pill.open{color:var(--open);border-color:color-mix(in srgb,var(--open) 50%,transparent);font-weight:600}
.init{padding:9px 0;border-bottom:1px dashed var(--line)} .init:last-child{border-bottom:0}
.ihd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ititle{font-weight:600;font-size:13.5px}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:5px 0 2px;font-size:11.5px}
.step{padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--faint)}
.step.on{color:var(--text)}
.arr{color:var(--faint)}
.actgrp{margin-bottom:10px} .agh{font-size:12px;font-weight:600;color:var(--muted);margin:6px 0 2px}
.act{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;padding:3px 0 3px 94px;position:relative}
.act .d{position:absolute;left:0;top:3px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.chg li .t{font-size:13px}
.chg-grp{border-top:1px solid var(--line);padding:10px 0}
.chg-grp:first-child{border-top:0;padding-top:0}
.chg-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-weight:600;font-size:14px}
.chg-src{font-weight:400;font-size:12px}
.chg-d{margin-left:auto;font-weight:400;font-size:12px}
.chg-items{list-style:none;margin:6px 0 0;padding:0 0 0 14px}
.chg-items li{margin:5px 0}
.chg-items .s{font-size:12px;color:var(--faint)}
.chg details summary{cursor:pointer;font-size:12.5px;color:var(--accent);margin:4px 0 0 14px}
.chg-date{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.chg-more{display:block;width:100%;margin-top:10px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--accent);font-size:13px;cursor:pointer}
.consult-mini .bd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px}
.consult-mini a{margin-left:auto}
.help code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:12.5px}
.help pre{background:var(--panel2);padding:10px 12px;border-radius:8px;overflow:auto;font-size:12.5px}

@media (max-width: 1000px){
  .layout,.grid2,.cols{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .list{max-height:320px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pipe{grid-template-columns:repeat(8,110px)}
}
@media (max-width: 560px){
  main{padding:12px 16px 40px} .hwrap{padding:10px 16px}
  .tl li{grid-template-columns:78px 22px 1fr}
  nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  nav.tabs button{white-space:nowrap;flex:0 0 auto}
  .actors table{min-width:600px}
  .pill{white-space:normal}
  .ev,.feed .t,.feed .s,.chg-items .t,.stk-actor,.relrow{overflow-wrap:anywhere}
  .actors td:nth-child(2){white-space:nowrap}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">欧盟电池与能源立法追踪<small>EU Battery &amp; Energy Industrial Policy Legislative Tracker</small></div>
    <nav class="tabs" id="tabs">
      <button data-v="overview">总览</button>
      <button data-v="dossiers">法规库</button>
      <button data-v="drafts">草案与二级立法</button>
      <button data-v="feed">动态时间线</button>
      <button data-v="actors">利益相关方</button>
      <button data-v="help">数据与更新</button>
    </nav>
    <div class="hright"><span id="gen"></span><button class="iconbtn" id="langBtn" title="切换语言">EN</button><button class="iconbtn" id="themeBtn" title="切换明暗">◐</button></div>
  </div>
</header>
<main id="app"></main>

<script src="data/curated.js"></script>
<script src="data/oeil-data.js"></script>
<script src="data/secondary-data.js"></script>
<script src="data/changes.js"></script>
<script src="data/stakeholders.js"></script>
<script src="data/curated.en.js"></script>
<script src="data/stakeholders.en.js"></script>
<script>
/* UI language: 中文 (default) or English. English content overlays the Chinese fields by id; anything without a translation falls back to Chinese. */
window.LANG = (function(){ try{ var v=localStorage.getItem("lang"); return v ? JSON.parse(v) : "zh"; }catch(e){ return "zh"; } })();
window.EN_UI = {
"欧委会": "Commission",
"议会委员会": "EP committees",
"议会全会": "EP plenary",
"理事会": "Council",
"三方谈判": "Trilogue",
"签署/公报": "Signature / OJ",
"实施节点": "Implementation",
"二级立法/草案": "Secondary acts / drafts",
"咨询机构/成员国议会": "Advisory bodies / national parliaments",
"利益相关方": "Stakeholders",
"授权条例": "Delegated regulation",
"授权决定": "Delegated decision",
"授权指令": "Delegated directive",
"实施条例": "Implementing regulation",
"实施决定": "Implementing decision",
"实施指令": "Implementing directive",
"条例提案": "Proposal for a regulation",
"指令提案": "Proposal for a directive",
"决定提案": "Proposal for a decision",
"委员会条例": "Commission regulation",
"委员会决定": "Commission decision",
"指令": "Directive",
"通讯": "Communication",
"建议": "Recommendation",
"指南": "Guidelines",
"工作文件": "Staff working document",
"报告": "Report",
"其他": "Other",
"草案征求意见": "draft open for feedback",
"列入规划": "planned",

  } else mandate = first(rule72);
  S.epm = {date:mandate, note: rule72.length && !decisions.filter(e=>!dealDate||e.date<dealDate).length ? Z("谈判授权（第72条）") : (mandate?Z("一读立场/谈判授权"):"")};
  const cpos = (d.council||[]).filter(x=>x.stage==="ga"||x.stage==="coreper").map(x=>x.date).sort();
  S.cou = {date: cpos[0]||"", note: cpos.length? Z("总体方针 / 谈判授权") : ""};
  const noTrilogue = !dealDate && cAdopt.length>0;
  S.tri = {date: dealDate, skip: noTrilogue, note: noTrilogue? Z("未经三方谈判") : (dealDate? Z("达成临时协议"):"")};
  S.adopt = {date: first(cAdopt), note: finalEp? Z("议会 ")+fmt(finalEp)+Z(" · 理事会 ")+fmt(first(cAdopt)) : ""};
  if(!S.cou.date && (S.tri.date||S.adopt.date)) { S.cou.skip = true; S.cou.note = noTrilogue ? Z("直接通过议会文本") : Z("OEIL 未载，待补充"); }
  const oj = find(/^Final act published/);
  S.oj = {date:first(oj), note: d.o && d.o.mainAct ? d.o.mainAct : ""};
  const impl = (d.milestones||[]).filter(m=>m.kind==="apply"||m.kind==="force"||m.kind==="transpose").map(m=>m.date).sort();
  const implPast = impl.filter(x=>x<=TODAY);
  S.impl = {date: implPast.length? implPast[implPast.length-1] : "", next: impl.find(x=>x>TODAY)||"", note:""};
  if(S.oj.date && !impl.length) S.impl.note = Z("见公报");
  // status per stage
  let cur = -1;
  const keys = STAGES.map(s=>s.k);
  keys.forEach(k => { S[k].done = !!(S[k].date && S[k].date<=TODAY) || (k==="epc" && !!S.epm.date) || (S[k].skip && !!S.adopt.date); });
  if(S.oj.done && !S.impl.done && S.oj.date) S.impl.done = !S.impl.next;
  for(let i=0;i<keys.length;i++){ if(!S[keys[i]].done){ cur=i; break; } }
  // parallel tracks: EP and Council work at the same time — mark whichever is unfinished as current
  S._cur = cur;
  return S;
}

/* ---------- live search: keep the input element, refresh only the results; wait for IME composition to finish ---------- */
function liveSearch(id, setQ, view, sels){
  const q = document.getElementById(id); if(!q) return;
  let composing = false, timer = null;
  const run = () => {
    setQ(q.value);
    const tmp = document.createElement("div"); tmp.innerHTML = view();
    sels.forEach(sel => {
      const cur = document.querySelector(sel), nu = tmp.querySelector(sel);
      if(!cur || !nu) return;
      cur.innerHTML = nu.innerHTML;
      cur.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",e=>{ e.preventDefault(); nav("dossiers", el.dataset.go); }));
    });
  };
  q.addEventListener("compositionstart", ()=>{ composing = true; });
  q.addEventListener("compositionend", ()=>{ composing = false; clearTimeout(timer); timer = setTimeout(run, 0); });
  q.addEventListener("input", e=>{ if(composing || e.isComposing) return; clearTimeout(timer); timer = setTimeout(run, 120); });
}

  groups.sort((a,b)=> a.detected<b.detected?1:a.detected>b.detected?-1:(a.latest<b.latest?1:a.latest>b.latest?-1:(b.items.length-a.items.length)));

function filtered(){
  const q = state.q.trim().toLowerCase();
  return D.filter(d=>{
    if(state.cat!=="all" && d.category!==state.cat) return false;
    if(state.st==="live" && d.completed) return false;
    if(state.st==="done" && !d.completed) return false;
    if(state.st==="core" && d.relevance!=="core") return false;
    if(state.st==="sec" && !d.secondary) return false;
    if(q){
      const hay = [d.nameZh,d.shortZh,d.oeil,d.act&&d.act.ref,d.o&&d.o.title,d.o&&d.o.mainAct,(d.tags||[]).join(" "),d.summaryZh].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function vDossiers(){
  const list = filtered();
  // group children under parents when parent is visible
  const ids = new Set(list.map(d=>d.id));
  const corder = Object.keys(CATS);
  const roots = list.filter(d=>!d.parent || !ids.has(d.parent)).map((d,i)=>[d,i]).sort((a,b)=>(corder.indexOf(a[0].category)-corder.indexOf(b[0].category))||(a[1]-b[1])).map(x=>x[0]);
  const rows=[];
  const push=(d,depth)=>{ rows.push([d,depth]); list.filter(c=>c.parent===d.id).forEach(c=>push(c,depth+1)); };
  roots.forEach(r=>push(r,0));
  const sel = BYID[state.id] || D[0];
  return `<div class="layout">
    <aside class="card side">
      <div class="filters">
        <input class="search" id="q" placeholder="${Z("搜索：名称 / 程序编号 / 法案号 / 关键词")}" value="${esc(state.q)}">
        <div class="chips" id="cats"><span class="chip ${state.cat==="all"?"on":""}" data-c="all">${Z("全部领域")}</span>${Object.entries(CATS).map(([k,v])=>`<span class="chip ${state.cat===k?"on":""}" data-c="${k}">${catDot(k)}${v.zh}</span>`).join("")}</div>
        <div class="chips" id="sts">${[["all",Z("全部")],["live",Z("审议中")],["done",Z("已通过")],["core",Z("核心法规")],["sec",Z("二级法案")]].map(([k,z])=>`<span class="chip ${state.st===k?"on":""}" data-s="${k}">${z}</span>`).join("")}</div>
      </div>
      <div class="list">${rows.map(([d,dep])=>`
        <div class="item ${dep?"child":""} ${d.id===sel.id?"on":""}" data-go="${d.id}" style="${dep>1?"margin-left:"+(16*dep)+"px":""}">
          <div class="n">${catDot(d.category)}${esc(d.shortZh||d.nameZh)}</div>
          <div class="m">${d.secondary?Z("<span class=\"pill sec\">二级法案</span>"):""}<span class="mono">${esc(d.refLabel)}</span>${d.o&&d.o.mainAct?`<span>${esc(d.o.mainAct)}</span>`:""}<span style="color:${d.completed?"var(--done)":"var(--current)"}">● ${esc(curStageName(d))}</span></div>
        </div>`).join("") || Z("<div class=\"empty\">没有匹配的法规</div>")}
      </div>
    </aside>
    <section class="detail">${sel ? vDetail(sel) : ""}</section>
  </div>`;
}
function bindDossiers(){
  liveSearch("q", v=>{ state.q=v; }, vDossiers, [".side .list"]);
  document.getElementById("cats").addEventListener("click",e=>{const c=e.target.closest("[data-c]"); if(!c) return; state.cat=c.dataset.c; store.set("cat",state.cat); render();});
  document.getElementById("sts").addEventListener("click",e=>{const c=e.target.closest("[data-s]"); if(!c) return; state.st=c.dataset.s; store.set("st",state.st); render();});

}

function vDetail(d){
  const o = d.o || {};
  const S = d.stages;
  const pipe = STAGES.map((s,i)=>{
    const st = S[s.k]; const cls = st.done ? "done" : (i===S._cur ? "cur" : "");
    let dt = st.date ? (st.date>TODAY?Z("预计 "):"") + fmt(st.date) :(s.k==="impl" && st.next ? Z("下一节点 ")+fmt(st.next) : (i===S._cur? Z("进行中") : "—"));
    if(s.k==="epc" && !st.date && st.started) dt = st.done ? Z("未经委员会表决") : Z("审议中");
    const note = (s.k==="epc" && st.done && !st.date) ? Z("紧急程序/直接提交全会") : st.note;
    return `<div class="stg ${cls} ${st.skip?"skip":""}"><div class="dot">${st.done?"✓":i+1}</div><div class="nm">${s.nm}</div><div class="who">${s.who}</div><div class="dt">${dt}</div>${note?`<div class="who">${esc(note)}</div>`:""}</div>`;
  }).join("");
  return `
  <div class="card dhead">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${catDot(d.category)}<span class="muted" style="font-size:12px">${esc(CATS[d.category]?CATS[d.category].zh:"")}</span>${statusPill(d)}${d.relevance==="core"?Z("<span class=\"pill core\">核心</span>"):""}${d.secondary?Z("<span class=\"pill sec\">二级法案</span>"):""}</div>
    <h1>${esc(d.nameZh)}</h1>
    <div class="en">${esc(o.title||"")}</div>
    <div class="meta">
      ${d.oeil?`<span>${Z("程序编号")} <b class="mono"><a href="${oeilUrl(d.oeil)}" target="_blank" rel="noopener">${esc(d.oeil)}</a></b></span>`:`<span>${d.act?Z("法案"):Z("状态")} <b class="mono">${d.act&&d.act.url?`<a href="${esc(d.act.url)}" target="_blank" rel="noopener">${esc(d.refLabel)}</a>`:esc(d.refLabel)}</b></span>`}
      ${o.procedureType?`<span>${Z("程序")} <b>${esc(o.procedureType.replace(/ \(ex-codecision procedure\)/,""))}</b></span>`:""}
      ${o.instrument?`<span>${Z("文件类型")} <b>${esc(o.instrument)}</b></span>`:""}
      ${o.mainAct?`<span>${Z("最终法案")} <b>${o.mainActHref?`<a href="${esc(o.mainActHref)}" target="_blank" rel="noopener">${esc(o.mainAct)}</a>`:esc(o.mainAct)}</b> <span class="faint">${esc(o.mainActOj||"")}</span></span>`:""}
      ${o.fetchedAt?`<span class="faint">${Z("抓取于")} ${esc(tsFmt(o.fetchedAt))}</span>`:""}
    </div>
    <div class="tags">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  </div>

  ${d.oeil ? `<div class="card"><div class="hd"><h3>${Z("立法阶段进程")}</h3><span class="muted" style="font-size:12px">${Z("当前：")}${esc(curStageName(d))}</span></div><div class="pipe">${pipe}</div></div>` : vActInfo(d)}

  <div class="cols">
    <div class="card sum"><div class="hd"><h3>${Z("法规要点")}</h3></div><div class="bd"><p>${esc(d.summaryZh||"")}</p>
      ${(d.impactZh&&d.impactZh.length)?`<div class="sub" style="margin:6px 0 4px;font-weight:600">${Z("对电池/能源产业的影响")}</div><ul>${d.impactZh.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div></div>
    <div class="card"><div class="hd"><h3>${Z("法规谱系与关联")}</h3></div><div class="bd">${vFamily(d)}</div></div>
  </div>
  ${vTracking(d)}
  ${vStake(d)}
  ${vSecondary(d)}

  ${d.oeil?`<div class="card actors"><div class="hd"><h3>${Z("主要参与方")}</h3><span class="muted" style="font-size:12px">${Z("来源：OEIL Key players")}</span></div><div class="bd">${vActors(d)}</div></div>`:""}
  ${vDocs(d)}

  <div class="card"><div class="hd"><h3>${Z("完整进程时间线")}</h3>
      <div class="toolbar"><label><input type="checkbox" id="showAll" ${state.showAll?"checked":""}>${Z("显示全会表决/辩论明细")}</label></div></div>
    <div class="lanes">${Object.entries(LANES).map(([k,v])=>`<label><input type="checkbox" data-lane="${k}" ${state.lanes.includes(k)?"checked":""}> <span class="lane-dot" style="background:${v.color}"></span>${v.zh}</label>`).join("")}</div>
    <div class="bd">${vTimeline(d)}</div>
  </div>
  ${o.delegatedActs && o.delegatedActs.length ? `<div class="card"><div class="hd"><h3>${Z("授权法案审查（议会）")}</h3></div><div class="bd">${o.delegatedActs.map(a=>`<div class="relrow"><a class="mono" href="${oeilUrl(a.ref)}" target="_blank" rel="noopener">${esc(a.ref)}</a> <span class="muted">${esc(a.subject)}</span></div>`).join("")}</div></div>`:""}
  ${vBatteryImpact(d)}
  `;
}

const LEVEL = {high:Z("影响程度：高"), medium:Z("影响程度：中"), low:Z("影响程度：低")};
function vBatteryImpact(d){
  const b = d.batteryImpact; if(!b) return "";
  const col = (title, color, list) => `<div><h4><i style="background:${color}"></i>${title}</h4>${(list&&list.length)?`<ul>${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:Z("<div class=\"muted\" style=\"font-size:13px\">无直接影响</div>")}</div>`;
  const next = (d.milestones||[]).filter(m=>m.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1).slice(0,5);
  return `<div class="card"><div class="hd" style="flex-wrap:wrap"><h3>${Z("对电池生产企业的主要影响")}</h3><span class="pill lv-${esc(b.level)}">${LEVEL[b.level]||""}</span><span class="muted" style="font-size:12px;margin-left:auto">${Z("视角：对欧出口或在欧设厂的电池企业")}</span></div><div class="bd">
    ${b.levelNote?`<p style="margin:0 0 8px">${esc(b.levelNote)}</p>`:""}
    ${(b.segments||[]).length?`<div class="tags">${b.segments.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
    <div class="bi3">
      ${col(Z("合规"),"var(--c-commission)",b.compliance)}
      ${col(Z("准入"),"var(--open)",b.access)}
      ${col(Z("政策支持"),"var(--done)",b.support)}
    </div>
    ${next.length?`<div class="sub" style="font-weight:600;margin:14px 0 6px">${Z("接下来的关键时间点")}</div><ul class="feed">${next.map(m=>`<li><div class="d">${fmt(m.date)}</div><div><div class="t">${esc(m.label)}${m.verified===false?Z("<span class=\"unv\">待核实</span>"):""}</div><div class="s">${esc(MKIND[m.kind]||m.kind)}</div></div></li>`).join("")}</ul>`:""}
    ${(b.actions||[]).length?`<div class="sub" style="font-weight:600;margin:14px 0 6px">${Z("建议行动")}</div><ol class="bi-act">${b.actions.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}

}

    ${row(Z("类型"), esc(ACTKINDZH[a.kind]||a.kind||""))}

    ${row(Z("编号"), a.ref ? (a.url?`<a class="mono" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.ref)}</a>`:`<span class="mono">${esc(a.ref)}</span>`) : "")}

    ${d.secondary ? `<div class="sub" style="margin-top:8px">${Z("二级法案不经过普通立法程序，没有欧洲议会程序编号；草案意见征求和通过情况通过 Have Your Say 与 EUR-Lex 自动跟踪（见下方“二级立法”）。")}</div>` : ""}
  </div></div>`;
}

function vFamily(d){
  // root of family
  let root = d; while(root.parent && BYID[root.parent]) root = BYID[root.parent];
  const nodes=[]; const walk=(n,dep)=>{ nodes.push([n,dep]); D.filter(c=>c.parent===n.id).forEach(c=>walk(c,dep+1)); }; walk(root,0);
  let html = "";
  if(nodes.length>1){
    html += `<div class="sub" style="margin-bottom:6px">${Z("原始法规 → 后续修订")}</div><div class="family">` + nodes.map(([n,dep])=>`<div class="fam-node ${n.id===d.id?"me":""}" style="padding-left:${dep*18}px">${dep?'<span class="ln">└</span>':""}${catDot(n.category)}<a data-go="${n.id}" href="javascript:void 0">${esc(n.shortZh||n.nameZh)}</a><span class="mono faint">${esc(n.o&&n.o.mainAct||n.oeil)}</span>${n.completed?"":Z("<span class=\"pill live\">审议中</span>")}</div>`).join("") + `</div>`;
  }
  const rel = (d.o && d.o.relations) || [];
  if(rel.length){
    html += `<div class="sub" style="margin:${nodes.length>1?"12px":"0"} 0 4px">${Z("OEIL 记录的法律关系")}</div>` + rel.map(r=>{
      const inDb = BYREF[r.ref];
      const lab = r.label.replace(/^Amending act/,Z("修订法案")).replace(/^Amending/,Z("修订")).replace(/^Repealing/,Z("废止")).replace(/^Amended by/,Z("被修订于")).replace(/^Repealed by/,Z("被废止于")).replace(/^See also/,Z("另见")).replace(/^Supplementing/,Z("补充"));
      return `<div class="relrow">${esc(lab)} · ${inDb?`<a data-go="${inDb.id}" href="javascript:void 0">${esc(inDb.shortZh)}</a> <span class="mono faint">${esc(r.ref)}</span>`:`<a class="mono" href="${oeilUrl(r.ref)}" target="_blank" rel="noopener">${esc(r.ref)}</a>`}</div>`;
    }).join("");
  }
  return html || Z("<span class=\"muted\">暂无关联记录</span>");
}

function people(list){ return (list||[]).map(p=>`${esc(p.name)}${p.group?`<span class="grp" style="background:${grpColor(p.group)}">${esc(p.group)}</span>`:""}`).join(Z("、")); }
function vActors(d){

        ${c.shadows&&c.shadows.length?`<details><summary>${Z("影子报告员（")}${c.shadows.length}${Z("）")}</summary><div class="shadows">${c.shadows.map(p=>`<span>${esc(p.name)}<span class="grp" style="background:${grpColor(p.group)}">${esc(p.group)}</span></span>`).join("")}</div></details>`:""}</td>

  <div class="cols" style="margin-top:14px">

      ${cou.length?cou.map(r=>`<div class="relrow">${esc(r.join(" · "))}</div>`).join(""):""}
      ${curCou.length?curCou.map(x=>`<div class="relrow">${fmt(x.date)} · ${esc(CSTAGE[x.stage]||x.stage)} · ${esc(x.body||"")}${x.verified===false?Z("<span class=\"unv\">待核实</span>"):""}</div>`).join(""):(cou.length?"":Z("<span class=\"muted\">OEIL 未记载理事会内部节点；可在 data/curated.js 的 council 字段补充。</span>"))}
    </div>
  </div>`;
}

function vTimeline(d){
  let ev = d.events.filter(e=>state.lanes.includes(e.lane));
  if(!state.showAll) ev = ev.filter(e=>!(e.src==="oeil" && /^(Results of vote|Debate in Parliament)/.test(e.orig)));
  if(!ev.length) return Z("<div class=\"empty\">无事件（检查上方的分类开关）</div>");
  let out = '<ul class="tl">', yr = "";
  ev.forEach(e=>{
    const y = e.date.slice(0,4);
    if(y!==yr){ yr=y; out += `<li class="yr"><div class="d">${y}</div><div class="rail"></div><div></div></li>`; }
    const L = LANES[e.lane], fut = e.date>TODAY;
    const refs = (e.refs||[]).map(r=> r.href ? `<a class="mono" href="${esc(r.href.startsWith("http")?r.href:"https://oeil.europarl.europa.eu"+r.href)}" target="_blank" rel="noopener">${esc(r.text)}</a>` : `<span class="mono">${esc(r.text)}</span>`).join(" ");
    out += `<li class="${fut?"future":""}"><div class="d">${fmt(e.date.slice(5)).replace(/^/, "")}</div><div class="rail"><i style="background:${L.color}"></i></div>
      <div class="ev"><span class="lane" style="color:${L.color}">${L.zh}</span>${esc(e.zh)}${e.verified===false?Z("<span class=\"unv\">待核实</span>"):""}${fut?Z("<span class=\"unv\" style=\"color:var(--faint);border-color:var(--faint)\">未来</span>"):""}
        <div class="orig">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.orig)}</a>`:esc(e.orig)}${refs?" · "+refs:""}${e.summary?` · <a href="${esc(e.summary)}" target="_blank" rel="noopener">${Z("摘要")}</a>`:""}${e.note?" · "+esc(e.note):""}</div></div></li>`;
  });
  return out + "</ul>";
}

/* ----- pending-file tracking ----- */
function vTracking(d){
  const fut = d.events.filter(e=>e.date>TODAY && e.src!=="milestone" && e.src!=="hys" && e.src!=="eurlex");
  const t = d.tracking;
  if(!t && !fut.length) return "";
  const items = d.events.filter(e=>e.date<=TODAY && (e.src==="tracking"||e.src==="curated")).slice(-8).reverse().map(e=>({date:e.date, lane:e.lane, text:e.zh + (e.verified===false?" ⚠":""), }));
  return `<div class="card"><div class="hd"><h3>${d.completed?Z("后续排期"):Z("在审动态跟进")}</h3>${t?`<span class="muted" style="font-size:12px">${Z("来源：")}<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.source)}</a> ${Z("· 截至")} ${fmt(t.asOf)}</span>`:""}</div>
    <div class="bd">
      ${fut.length?`<div class="sub" style="font-weight:600;margin-bottom:6px">${Z("已排期 / 预计节点")}</div><ul class="feed">${fut.map(e=>`<li><div class="d">${fmt(e.date)}</div><div><div class="t"><span class="lane-dot" style="background:${LANES[e.lane].color}"></span>${esc(e.zh)}${e.verified===false?Z("<span class=\"unv\">待核实</span>"):""}</div><div class="s">${LANES[e.lane].zh} · ${esc(e.orig)}</div></div></li>`).join("")}</ul>`:""}
      ${items.length?`<div class="sub" style="font-weight:600;margin:12px 0 6px">${Z("最近进展")}</div><ul class="feed">${items.map(x=>`<li><div class="d">${fmt(x.date)}</div><div><div class="t"><span class="lane-dot" style="background:${(LANES[x.lane]||LANES.other).color}"></span>${esc(x.text)}</div><div class="s">${(LANES[x.lane]||LANES.other).zh}</div></div></li>`).join("")}</ul>`:""}
      ${t&&t.outlook?`<div class="relrow" style="margin-top:10px"><b>${Z("展望：")}</b>${esc(t.outlook)}</div>`:""}
    </div></div>`;
}

/* ----- secondary legislation ----- */
function initRow(i, showOwner){
  const st = i.st || initStatus(i);
  const pubs = (i.publications||[]);
  const steps = pubs.filter(p=>p.type!=="ABANDONED").map(p=>`<span class="step ${p.date?"on":""}" title="${esc(p.type)}">${esc(PUBTYPE(p.type))}${p.date?" "+fmt(p.date):""}${p.feedback?` · ${p.feedback}${Z("条反馈")}`:""}</span>`).join('<span class="arr">→</span>');
  const fb = st.last && st.last.fbEnd ? `${Z("反馈期")} ${fmt(st.last.fbStart||"")} – ${fmt(st.last.fbEnd)}` : "";
  return `<div class="init">
    <div class="ihd"><span class="pill ${st.open?"open":st.k==="adopted"?"done":st.k==="draft"?"live":""}">${esc(st.zh)}</span><span class="pill">${esc(ACTTYPE[i.actType]||i.actType||"")}</span>
      <a href="${esc(i.url)}" target="_blank" rel="noopener" class="ititle">${esc(i.title)}</a>

/* ----- help ----- */
function vHelpEn(){
  return `<div class="card help"><div class="hd"><h3>Data sources and updates</h3></div><div class="bd">
  <p><b>Data layers</b></p>
  <ul>
    <li><b>Automatic layer</b> <code>data/oeil-data.js</code>: fetched from the European Parliament Legislative Observatory (OEIL) by <code>tools/update-oeil.ps1</code> — Commission proposals, EP committees (lead / joint / associated / opinion), rapporteurs and shadow rapporteurs, committee votes, plenary decisions, trilogue mandates and agreements, Council adoption, signature and Official Journal publication, final act numbers and delegated-act scrutiny.</li>
    <li><b>Curated layer</b> <code>data/curated.js</code>: the watch list (10 areas), Chinese names and summaries, industry impact, file families (<code>parent</code>), internal Council steps not recorded by OEIL (working party / COREPER mandate / general approach / provisional agreement) and application milestones. Items marked “to verify” should be checked against Council press releases or EUR-Lex.</li>

    <li><b>Secondary acts and planned legislation</b>: key delegated and implementing acts, Commission guidelines, REACH restrictions, CLP classifications and trade-defence measures are listed as their own entries (filter “Secondary acts”) under their base act. They have no EP procedure number, so <code>oeil</code> is left empty and the <code>act</code> field records type, reference and status. Legislation not yet proposed (e.g. the Circular Economy Act) also has an empty procedure number until it is proposed.</li>
    <li><b>Impact on battery manufacturers</b> <code>batteryImpact</code> in <code>curated.js</code>: impact level, affected business segments, impacts split into compliance / market access / policy support, and recommended actions, written for battery makers exporting to or producing in the EU.</li>
    <li><b>Stakeholder layer</b> <code>data/stakeholders.js</code>: curated positions of industry associations, NGOs, think tanks, coalitions, key people, governments and EP groups, plus dated influence events (letters, position papers, studies, political deals), each with a source link. “(approx.)” means the date is known only to the month; “to verify” means a single secondary source.</li>
    <li><b>Ongoing developments</b> <code>tracking</code> in <code>curated.js</code>: Legislative Train and similar sites block automated access, so these items are read and summarised manually, each with its source and “as of” date.</li>
    <li><b>Change tracking</b> <code>data/changes.js</code>: each run is compared with the previous snapshot; new events, scheduled votes, documents, draft stages and secondary acts appear under “New since the last update”. The first fetch of a newly added file is treated as a baseline.</li>
    <li><b>English version</b> <code>data/curated.en.js</code> and <code>data/stakeholders.en.js</code> hold the English content by id; interface strings are in <code>index.html</code> (<code>EN_UI</code>). Anything without a translation is shown in Chinese.</li>
  </ul>
  <p><b>Update everything</b> (PowerShell in the project folder):</p>
  <pre>powershell -ExecutionPolicy Bypass -File tools\\update-all.ps1</pre>
  <p>Step by step: <code>update-oeil.ps1</code> (procedures) → <code>update-secondary.ps1</code> (secondary acts and drafts) → <code>build.ps1</code> (change tracking + tracker.html). Single procedure: <code>update-oeil.ps1 -Only "2026/0068(COD)"</code>; secondary acts for one file: <code>update-secondary.ps1 -Only batteries</code>. GitHub Actions refreshes the site daily at 22:00 UTC.</p>
  <p><b>Add a file</b>: copy an entry in <code>data/curated.js</code>, set <code>id</code>, <code>oeil</code> (procedure number from OEIL or the Legislative Train), names and area, then run the update. For an amendment, set <code>parent</code> to the original act's id so it appears in the file family. Add the English text in <code>data/curated.en.js</code> under the same id.</p>
  <p><b>Stage rules</b>: EP position = first plenary decision before the agreement, or the Rule 72 mandate; trilogue deal = provisional agreement date (curated) or committee approval of the agreed text (OEIL); adoption = Council adoption after the EP first reading; urgent procedures without trilogue are marked “No trilogue”.</p>
